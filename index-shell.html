<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FootMate | 케이스 스터디</title>
<meta name="theme-color" content="#07111F">
<style>html,body{width:100%;height:100%;margin:0;background:#07111F;color:#A7B8D0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}#boot{height:100%;display:grid;place-items:center}#boot strong{display:block;color:#fff;margin-bottom:6px}</style>
</head>
<body>
<div id="boot"><div><strong>FootMate 케이스 스터디를 불러오는 중입니다.</strong>최신 구현 상태와 문서를 동기화합니다.</div></div>
<script>
(async function(){
  try{
    const response=await fetch('/index-source'+location.search,{cache:'no-store'});
    if(!response.ok)throw new Error('index source '+response.status);
    let html=await response.text();
    const patch='<script src="/index-patches.js?v=20260910-2"><\/script>';
    html=html.includes('</body>')?html.replace('</body>',patch+'</body>'):html+patch;
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error('[FootMate index shell] source load failed',error);
    const boot=document.getElementById('boot');
    if(boot)boot.innerHTML='<div><strong>케이스 스터디를 불러오지 못했습니다.</strong><a href="/index-source" style="color:#8FC3FF">원본 보기</a></div>';
  }
})();
</script>
</body>
</html>
