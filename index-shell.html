<style>html,body{width:100%;height:100%;margin:0;background:#07111F;color:#A7B8D0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}#boot{height:100%;display:grid;place-items:center}#boot strong{display:block;color:#fff;margin-bottom:6px}</style>

<body>
<div id="boot"><div><strong>FootMate 케이스 스터디를 불러오는 중입니다.</strong></div></div>
<script>
(async function(){
  try{
    const response=await fetch('/index-source'+location.search,{cache:'no-store'});
    if(!response.ok)throw new Error('index source '+response.status);
    let html=await response.text();
    const styles='<link rel="stylesheet" href="/case-study-experience.css?v=20260918-1"><link rel="stylesheet" href="/src/next/case-study.css?v=20260919-1"><link rel="stylesheet" href="/src/next/case-study-compat.css?v=20260919-1">';
    const patch='<script src="/index-patches.js?v=20260917-1"><\/script><script src="/index-experience.js?v=20260919-1"><\/script><script src="/src/next/case-study.js?v=20260919-1"><\/script>';
    html=html.includes('</head>')?html.replace('</head>',styles+'</head>'):styles+html;
    html=html.includes('</body>')?html.replace('</body>',patch+'</body>'):html+patch;
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error('[FootMate index shell] source load failed',error);
    const boot=document.getElementById('boot');
    if(boot)boot.innerHTML='<div><strong>케이스 스터디를 불러오지 못했습니다.</strong><a href="/index-source" style="color:#C9EF62">원본 보기</a></div>';
  }
})();
</script>
