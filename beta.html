<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FootMate | Demo</title>
<meta name="description" content="풋살 조건 선택부터 AI 추천·로그인·참가 흐름을 확인할 수 있는 FootMate Demo입니다.">
<meta name="theme-color" content="#f7f8f7">
<meta name="footmate-release" content="6.0.0">
<meta name="footmate-release-name" content="connected-beta">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/toss/tossface@37720aa5cf2ec9a853a9787f29e39002c58cc2e7/dist/tossface.css">
<link rel="stylesheet" href="/src/beta/app.css?v=1">
<link rel="stylesheet" href="/src/beta/growth.css?v=1">
<link rel="stylesheet" href="/src/beta/auth.css?v=513">
<link rel="stylesheet" href="/src/beta/enhancements.css?v=512">
<link rel="stylesheet" href="/src/beta/release.css?v=16">
<link rel="stylesheet" href="/src/shared/typography.css?v=1">
<style>
.footmate-app #footmate-beta {
  width: 100%;
  margin-inline: auto;
  background: #f7f8f7;
}

@media (min-width: 431px) {
  body.footmate-app {
    background: #e8eeea;
    min-height: 100dvh;
    display: grid;
    align-content: center;
    padding-block: 16px;
    --demo-frame-height: min(844px, calc(100dvh - 32px));
    --demo-frame-gap: calc((100dvh - var(--demo-frame-height)) / 2);
    --demo-frame-side: calc((100vw - 390px) / 2);
  }

  .footmate-app #footmate-beta {
    width: 390px;
    height: var(--demo-frame-height);
    min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    border-radius: 28px;
    box-shadow: 0 0 0 1px #d3ded6, 0 12px 48px #15352620;
  }

  .footmate-app .fm-beta-shell {
    padding-inline: 12px;
  }

  .footmate-app .fm-beta-app-nav {
    bottom: var(--demo-frame-gap);
    width: 390px;
    border-radius: 0 0 28px 28px;
  }

  .footmate-app .fm-beta-filter-scrim {
    inset: var(--demo-frame-gap) var(--demo-frame-side);
    border-radius: 28px;
  }

  .footmate-app .fm-beta-condition-sheet::backdrop {
    clip-path: inset(max(16px, calc((100dvh - 844px) / 2)) calc((100vw - 390px) / 2) round 28px);
  }

  .footmate-app .fm-beta-condition-sheet,
  .footmate-app .fm-beta-quick-filters .fm-beta-quick-panel {
    inset: auto 0 var(--demo-frame-gap);
    width: 390px;
    max-height: calc(var(--demo-frame-height) - 16px);
    margin: 0 auto;
    border-radius: 24px 24px 28px 28px;
  }
}

.footmate-app [data-beta-app="true"] .fm-beta-catalog:has(.fm-beta-browse-controls) {
  flex: 1 0 auto;
}

.footmate-app .fm-beta-catalog:has(.fm-beta-browse-controls) :is(.fm-beta-match-list, .fm-beta-compare-tray) {
  margin-bottom: 8px;
}

.footmate-app .fm-beta-browse-controls {
  margin-top: auto;
  flex-shrink: 0;
}
.footmate-app .fm-beta-ui-icon.fm-icon {
  font-size: 16px;
  width: 18px;
}

.footmate-app .fm-beta-opening .fm-next-intro-copy:has(+ .fm-beta-opening-preview) {
  margin-bottom: 10px;
}

.footmate-app .fm-beta-opening .fm-beta-opening-preview {
  margin-bottom: 8px;
  padding: 0;
  border: 1px solid #d9ddda;
  border-radius: 16px;
  background: transparent;
  color: #222724;
  box-shadow: none;
  text-align: left;
}

.footmate-app .fm-beta-opening-preview .fm-beta-preview-card {
  padding: 9px 14px 5px;
  border: 0;
  background: transparent;
}

.footmate-app .fm-beta-preview-card small {
  color: #555d58;
  font-weight: 700;
}

.footmate-app .fm-beta-preview-card h2 {
  margin: 4px 0;
  color: #1d2923;
  letter-spacing: -0.02em;
}

.footmate-app .fm-beta-preview-card p {
  margin: 2px 0 0;
  color: #555d58;
}

.footmate-app .fm-beta-opening-preview .fm-beta-preview-controls {
  justify-content: space-between;
  gap: 8px;
  margin: 0 14px;
  border-top: 1px solid #d9ddda;
  color: #555d58;
  font-variant-numeric: tabular-nums;
}

.footmate-app .fm-beta-preview-controls .fm-beta-link {
  min-height: 44px;
  padding: 0;
  color: #326047;
}

.footmate-app .fm-beta-opening .fm-app-entry {
  justify-content: space-between;
  padding-block: max(32px, env(safe-area-inset-top)) max(32px, env(safe-area-inset-bottom));
}

.footmate-app .fm-beta-opening .fm-next-intro-copy {
  margin-block: 12px;
}

.footmate-app .fm-beta-opening .fm-next-actions {
  margin-block: 12px 0;
}

@media (max-height: 700px) {
  .footmate-app .fm-beta-opening .fm-app-entry {
    padding-block: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-bottom));
  }
}

@media (prefers-reduced-motion: no-preference) {
  .footmate-app #footmate-beta:has(.fm-beta-opening[data-preview-motion="true"]) {
    position: relative;
    isolation: isolate;
  }

  .footmate-app #footmate-beta:has(.fm-beta-opening[data-preview-motion="true"])::after {
    content: "FOOTMATE";
    position: absolute;
    z-index: 10;
    inset: 0;
    pointer-events: none;
    display: grid;
    place-items: center;
    background: #f2f5fa;
    color: #173663;
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 0.1em;
    animation: fm-wordmark-in 250ms ease-out both, fm-launch-splash 900ms ease-out both;
  }

  .footmate-app .fm-beta-opening[data-preview-motion="true"] .fm-app-entry {
    animation: fm-launch-reveal 900ms ease-out both;
  }
}

@keyframes fm-wordmark-in {
  from { text-indent: 0; padding-top: 8px; color: transparent; }
  to { padding-top: 0; color: #173663; }
}

@keyframes fm-launch-splash {
  0%, 72% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

@keyframes fm-launch-reveal {
  0%, 67% { visibility: hidden; opacity: 0; }
  68% { visibility: visible; opacity: 0; }
  100% { visibility: visible; opacity: 1; }
}

.footmate-app .fm-beta-opening-preview h3 {
  margin: 4px 0;
  font-size: 17px;
  line-height: 1.4;
}

.footmate-app [data-beta-main] > .fm-beta-opening-preview {
  display: none;
}

.footmate-app [data-beta-main]:has(.fm-beta-onboarding) > .fm-beta-opening-preview {
  display: block;
  max-width: none;
  margin: 8px 0 12px;
  padding: 0;
  border-color: #d9ddda;
  background: transparent;
}

.footmate-app [data-beta-main] .fm-beta-preview-card {
  border: 0;
  background: transparent;
}

.footmate-app [data-auto-launch="true"] .fm-app-entry {
  animation: none;
  visibility: hidden;
}

.footmate-app [data-combined-discovery] > .fm-beta-opening-preview {
  display: block;
  max-width: none;
  margin: 8px 0 12px;
  padding: 0;
  background: transparent;
}
@media (prefers-reduced-motion: no-preference) {
  .footmate-app .fm-beta-shell:has([data-combined-discovery]) {
    animation: fm-discovery-reveal 480ms ease-out both;
  }
}

@keyframes fm-discovery-reveal {
  from { opacity: 0; translate: 0 6px; }
  to { opacity: 1; translate: 0 0; }
}
</style>
</head>
<body>
<script>if (/^\/(?:demo|beta)\/?$/.test(location.pathname)) document.body.classList.add("footmate-app");</script>
<main id="footmate-beta" class="fm-beta" data-beta-state="booting" aria-live="polite"></main>
<noscript>FootMate Demo를 이용하려면 JavaScript를 켜주세요.</noscript>
<script>(()=>{const u=new URL(location.href);if(u.searchParams.get("entry")==="footmate"){u.searchParams.delete("entry");history.replaceState(history.state,"",u.pathname+u.search+u.hash)}})();</script>
<script src="/src/beta/recovery-bootstrap.js?v=1"></script>
<script src="/src/beta/social-auth-bootstrap.js?v=1"></script>
<script type="module" src="/src/beta/app.js?v=542"></script>
<script type="module">
const root=document.getElementById('footmate-beta');
const launch=async()=>{
  await import('/src/beta/readiness.js?v=2');
  await import('/src/beta/growth.js?v=18');
  await import('/src/beta/social-auth.js?v=2');
  await import('/src/beta/push.js?v=1');
  await import('/src/beta/media.js?v=2');
};
if(root.dataset.betaState!=='booting')launch();
else{
  const observer=new MutationObserver(()=>{
    if(root.dataset.betaState==='booting')return;
    observer.disconnect();
    launch();
  });
  observer.observe(root,{attributes:true,attributeFilter:['data-beta-state']});
}
</script>
</body>
</html>
