<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FootMate | Closed Beta</title>
<meta name="description" content="실제 회원, 경기 데이터와 참가 상태를 연결한 FootMate Closed Beta입니다.">
<meta name="theme-color" content="#0B251B">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/src/v5/beta.css?v=1">
<link rel="stylesheet" href="/src/v5/beta-growth.css?v=1">
<link rel="stylesheet" href="/src/v5/beta-auth.css?v=1">
<link rel="stylesheet" href="/src/v5/beta-enhancements.css?v=1">
</head>
<body>
<main id="footmate-beta" class="fm-beta" data-beta-state="booting" aria-live="polite"></main>
<noscript>FootMate Closed Beta를 이용하려면 JavaScript를 켜주세요.</noscript>
<script>
(()=>{const key='footmate:app:oauth-pending:v1';if(!sessionStorage.getItem(key))return;const query=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.replace(/^#/,''));const callback=Boolean(hash.get('access_token')||hash.get('error')||hash.get('error_description')||query.get('code')||query.get('error')||query.get('error_description'));if(!callback)return;const target=new URL('/app',location.origin);target.searchParams.set('oauth_return','1');target.searchParams.set('resume','1');for(const name of ['code','error','error_description']){const value=query.get(name);if(value)target.searchParams.set(name,value)}target.hash=location.hash;location.replace(`${target.pathname}${target.search}${target.hash}`)})();
</script>
<script src="/src/v5/beta-recovery-bootstrap.js?v=1"></script>
<script src="/src/v5/beta-social-auth-bootstrap.js?v=1"></script>
<script type="module" src="/src/v5/beta.js?v=1"></script>
<script type="module">
const root=document.getElementById('footmate-beta');
const launch=async()=>{
  await import('/src/v5/beta-readiness.js?v=1');
  await import('/src/v5/beta-growth.js?v=1');
  await import('/src/v5/beta-social-auth.js?v=1');
  await import('/src/v5/beta-push.js?v=1');
  await import('/src/v5/beta-media.js?v=1');
};
if(root.dataset.betaState!=='booting')launch();
else{
  const observer=new MutationObserver(()=>{
    if(root.dataset.betaState==='booting')return;
    observer.disconnect();
    launch();
  });
  observer.observe(root,{attributes:true,attributeFilter:['data-beta-state']});
}
</script>
</body>
</html>
