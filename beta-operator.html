<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FootMate | Closed Beta Operator</title>
<meta name="description" content="FootMate Closed Beta 운영자 경기·참가자 관리 콘솔입니다.">
<meta name="theme-color" content="#0B251B">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/src/v5/beta.css?v=1">
<link rel="stylesheet" href="/src/v5/beta-readiness.css?v=1">
<link rel="stylesheet" href="/src/v5/beta-operator.css?v=1">
</head>
<body>
<main id="footmate-beta-operator" class="fm-beta fm-operator" data-operator-state="booting" aria-live="polite"></main>
<noscript>FootMate Closed Beta 운영자 콘솔을 이용하려면 JavaScript를 켜주세요.</noscript>
<script type="module" src="/src/v5/beta-operator.js?v=1"></script>
<script type="module">
const root=document.getElementById('footmate-beta-operator');
const launch=()=>import('/src/v5/beta-operator-readiness.js?v=1');
if(root.dataset.operatorState!=='booting')launch();
else{
  const observer=new MutationObserver(()=>{
    if(root.dataset.operatorState==='booting')return;
    observer.disconnect();
    launch();
  });
  observer.observe(root,{attributes:true,attributeFilter:['data-operator-state']});
}
</script>
</body>
</html>
