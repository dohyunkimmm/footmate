<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FootMate | 인터랙티브 프로토타입</title>
<meta name="theme-color" content="#2F6FD3">
<style>
html,body{width:100%;height:100%;margin:0;background:#eef2f8;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
#boot{height:100%;display:grid;place-items:center;color:#596980;font-size:13px}
#boot strong{display:block;color:#172033;font-size:15px;margin-bottom:6px}
</style>
</head>
<body>
<div id="boot"><div><strong>FootMate 데모를 불러오는 중입니다.</strong>v1.1 Experience Polish와 검증 레이어를 연결합니다.</div></div>
<script>
(async function(){
  try{
    const response=await fetch('/demo-source'+location.search,{cache:'no-store'});
    if(!response.ok)throw new Error('demo source '+response.status);
    let html=await response.text();
    const styles='<link rel="stylesheet" href="/footmate-patches.css?v=20260911-1"><link rel="stylesheet" href="/footmate-finalize.css?v=20260911-1"><link rel="stylesheet" href="/footmate-product-hardening.css?v=20260911-1"><link rel="stylesheet" href="/footmate-v1.1.css?v=20260918-2">';
    const scripts='<script src="/footmate-core.js?v=20260911-1"><\/script><script src="/footmate-product-core.js?v=20260911-1"><\/script><script src="/footmate-patches.js?v=20260911-1"><\/script><script src="/footmate-finalize.js?v=20260911-1"><\/script><script src="/footmate-product-hardening.js?v=20260911-1"><\/script><script src="/footmate-persist-extra.js?v=20260911-1"><\/script><script src="/footmate-v1.1.js?v=20260918-2"><\/script>';
    html=html.includes('</head>')?html.replace('</head>',styles+'</head>'):styles+html;
    html=html.includes('</body>')?html.replace('</body>',scripts+'</body>'):html+scripts;
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error('[FootMate shell] source load failed',error);
    const boot=document.getElementById('boot');
    if(boot)boot.innerHTML='<div><strong>데모를 불러오지 못했습니다.</strong><a href="/demo-source" style="color:#2F6FD3">원본 데모 열기</a></div>';
  }
})();
</script>
</body>
</html>
