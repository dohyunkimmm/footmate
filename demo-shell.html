<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FootMate | 인터랙티브 프로토타입</title>
<meta name="theme-color" content="#0D422E">
<style>
html,body{width:100%;height:100%;margin:0;background:#08150f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
#boot{height:100%;display:grid;place-items:center;color:#708279;font-size:13px}
#boot strong{display:block;color:#f7fbf8;font-size:15px;margin-bottom:6px}
</style>
</head>
<body>
<div id="boot"><div><strong>FootMate 데모를 불러오는 중입니다.</strong>제품 모듈을 연결합니다.</div></div>
<script>
(async function(){
  try{
    const response=await fetch('/demo-source'+location.search,{cache:'no-store'});
    if(!response.ok)throw new Error('demo source '+response.status);
    let html=await response.text();
    const styles='<link rel="stylesheet" href="/src/v2/styles/compatibility-patches.css?v=20260918-1"><link rel="stylesheet" href="/src/v2/styles/compatibility-finalize.css?v=20260918-1"><link rel="stylesheet" href="/src/v2/styles/product-inspector.css?v=20260918-1"><link rel="stylesheet" href="/src/v2/styles/experience.css?v=20260918-2"><link rel="stylesheet" href="/src/v2/styles/tokens.css?v=20260918-2"><link rel="stylesheet" href="/src/v2/styles/app.css?v=20260918-3"><link rel="stylesheet" href="/src/v2/styles/core-funnel.css?v=20260919-1"><link rel="stylesheet" href="/src/v2/styles/decision-recovery.css?v=20260919-1"><link rel="stylesheet" href="/src/v2/styles/visual-experience.css?v=20260919-1"><link rel="stylesheet" href="/src/v2/styles/visual-tokens.css?v=20260919-1"><link rel="stylesheet" href="/src/v2/styles/visual-identity.css?v=20260919-1"><link rel="stylesheet" href="/src/v2/styles/visual-guardrails.css?v=20260919-1">';
    const scripts='<script src="/footmate-core.js?v=20260911-1"><\/script><script src="/footmate-product-core.js?v=20260911-1"><\/script><script src="/src/v2/compat/scenario-persistence-bridge.js?v=20260918-1"><\/script><script src="/footmate-patches.js?v=20260918-4"><\/script><script src="/footmate-finalize.js?v=20260918-2"><\/script><script src="/footmate-product-hardening.js?v=20260918-5"><\/script><script type="module" src="/src/v2/bootstrap.js?v=20260919-3"><\/script><script type="module" src="/src/v2/v28-release.js?v=20260919-1"><\/script>';
    html=html.includes('</head>')?html.replace('</head>',styles+'</head>'):styles+html;
    html=html.includes('</body>')?html.replace('</body>',scripts+'</body>'):html+scripts;
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error('[FootMate shell] source load failed',error);
    const boot=document.getElementById('boot');
    if(boot)boot.innerHTML='<div><strong>데모를 불러오지 못했습니다.</strong><a href="/demo-source" style="color:#D3F36B">원본 데모 열기</a></div>';
  }
})();
</script>
</body>
</html>
