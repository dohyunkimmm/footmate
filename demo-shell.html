<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FootMate | AI Agent Workflow 프로토타입</title>
<meta name="theme-color" content="#1a2d6e">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#e8ecf5}
#footmateSource{display:block;width:100%;height:100%;border:0;opacity:0;transition:opacity .12s ease}
#footmateSource.ready{opacity:1}
</style>
</head>
<body>
<iframe id="footmateSource" title="FootMate 인터랙티브 데모" allow="clipboard-read; clipboard-write"></iframe>
<script>
(function(){
  const frame=document.getElementById('footmateSource');
  const initialHash=location.hash || '';
  const initialSearch=location.search || '';
  frame.src='/demo-source'+initialSearch+initialHash;
  function addStyle(doc, href){
    return new Promise((resolve,reject)=>{const link=doc.createElement('link');link.rel='stylesheet';link.href=href;link.onload=resolve;link.onerror=reject;doc.head.appendChild(link);});
  }
  function addScript(doc, src){
    return new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;doc.head.appendChild(s);});
  }
  frame.addEventListener('load', async function(){
    try{
      const doc=frame.contentDocument;
      await addStyle(doc,'/footmate-patches.css?v=20260909-1');
      await addScript(doc,'/footmate-core.js?v=20260909-1');
      await addScript(doc,'/footmate-patches.js?v=20260909-1');
      frame.classList.add('ready');
    }catch(err){
      console.error('[FootMate shell] runtime patch load failed',err);
      frame.classList.add('ready');
    }
  });
  window.addEventListener('hashchange',()=>{
    try{frame.contentWindow.location.hash=location.hash;}catch(e){}
  });
})();
</script>
</body>
</html>
