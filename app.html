<script type="module">import {footmatePlatform} from '/src/v4/platform/application/platform.js';const root=document.getElementById('footmate-next');if(root){const exactBoundary='실시간 위치·지도·팀 채팅·알림 backend는 연결하지 않았습니다. 상태와 복구 흐름을 검증하는 deterministic simulation입니다.';const markerKey='footmate:internal-route';const mode=['guided','evidence'].includes(new URLSearchParams(location.search).get('mode'))?new URLSearchParams(location.search).get('mode'):'real';const replacements=[[/중급\+/g,'고급'],[/초중급/g,'초급'],[/포워드/g,'공격수'],[/\bFW\b/g,'공격수']];const allowInternalReload=()=>{try{sessionStorage.setItem(markerKey,JSON.stringify({preserve:true,expiresAt:Date.now()+15000}))}catch{}};const relay=(action,extra={})=>{const button=document.createElement('button');button.type='button';button.hidden=true;button.dataset.action=action;for(const [key,value] of Object.entries(extra))button.dataset[key]=value;root.append(button);button.click();button.remove()};const installStyles=()=>{if(document.getElementById('fm-core-flow-qa-style'))return;const style=document.createElement('style');style.id='fm-core-flow-qa-style';style.textContent=`.fm-ai-card.fm-ai-core{position:relative;margin:16px 20px 28px!important;padding:22px!important;border:2px solid rgba(9,46,33,.2)!important;background:radial-gradient(circle at 100% 0%,rgba(216,255,115,.34),transparent 34%),linear-gradient(145deg,#f7fff0 0%,#fff 68%)!important;box-shadow:0 18px 46px rgba(9,46,33,.13)!important;overflow:hidden}.fm-ai-card.fm-ai-core:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:#d8ff73}.fm-ai-card.fm-ai-core .fm-ai-head strong{font-size:22px!important;line-height:1.3!important;}.fm-ai-core-badge{display:inline-flex;align-items:center;min-height:24px;margin-left:7px;border-radius:999px;padding:0 9px;background:#092e21;color:#fff;font-size:10px;font-weight:800;}.fm-ai-card.fm-ai-core .fm-ai-input-row input,.fm-ai-card.fm-ai-core .fm-ai-input-row button{height:50px}.fm-core-provider{display:grid;gap:16px}.fm-core-provider-consent{display:flex;gap:9px;align-items:flex-start;border:1px solid #dfe6e1;border-radius:15px;padding:13px;background:#f7f9f6;color:#34473d;font-size:12px;line-height:1.55}.fm-core-provider-consent input{margin-top:2px}.fm-core-provider-actions{display:grid;gap:9px}.fm-core-provider-actions button{min-height:50px;border-radius:14px;font-weight:800}.fm-core-provider-submit{border:0;background:#092e21;color:#fff}.fm-core-provider-submit:disabled{opacity:.45}.fm-core-provider-back{border:1px solid #dfe6e1;background:#fff;color:#34473d}.fm-team-message-panel{display:grid;gap:14px;margin:16px 0 4px;border:1px solid rgba(9,46,33,.13);border-radius:20px;padding:18px;background:#fff;color:#132019;box-shadow:0 12px 28px rgba(9,46,33,.08)}.fm-team-message-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.fm-team-message-head small{display:block;color:#66756c;font-size:10px;font-weight:800;}.fm-team-message-head h3{margin:4px 0 0;font-size:18px}.fm-team-message-head button{border:0;background:transparent;color:#52645a;font-weight:800;cursor:pointer}.fm-team-message-list{display:grid;gap:9px}.fm-team-message{border:1px solid #e2e8e4;border-radius:14px;padding:12px;background:#f8faf7;color:#132019}.fm-team-message b{display:block;margin-bottom:4px;font-size:12px}.fm-team-message p{margin:0;color:#34473d;font-size:12px;line-height:1.6}.fm-team-message-boundary{margin:0;border-top:1px solid #e5ebe7;padding-top:11px;color:#5f7067;font-size:10px;line-height:1.6}.fm-core-next-action{background:#092e21!important;color:#fff!important;border-color:#092e21!important}.fm-core-return-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.fm-core-return-actions button{min-height:46px;border-radius:14px;font-weight:800}.fm-core-return-actions button:first-child{border:0;background:#092e21;color:#fff}.fm-core-return-actions button:last-child{border:1px solid #dbe4df;background:#fff;color:#34473d}[data-core-postgame-hidden]{display:none!important}@media(max-width:359px){.fm-core-return-actions{grid-template-columns:1fr}.fm-ai-card.fm-ai-core{margin-left:14px!important;margin-right:14px!important}}`;document.head.append(style);};const visibleText=()=>{const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes){let value=node.nodeValue||'';for(const [pattern,next] of replacements)value=value.replace(pattern,next);if(value!==node.nodeValue)node.nodeValue=value}for(const el of root.querySelectorAll('[aria-label],[placeholder],[title]'))for(const attr of ['aria-label','placeholder','title'])if(el.hasAttribute(attr)){let value=el.getAttribute(attr)||'';for(const [pattern,next] of replacements)value=value.replace(pattern,next);el.setAttribute(attr,value)}};const patchAi=()=>{const card=root.querySelector('[data-ai-assistant]');if(!card)return;card.classList.add('fm-ai-core');const head=card.querySelector('.fm-ai-head>div');if(head&&!head.querySelector('.fm-ai-core-badge'))head.querySelector('.fm-ai-kicker')?.insertAdjacentHTML('afterend','<span class="fm-ai-core-badge">핵심 경기 탐색</span>');const home=card.closest('[data-screen="home"]');const greeting=home?.querySelector('.fm-next-greeting');if(home&&greeting&&greeting.nextElementSibling!==card)greeting.after(card);const initial=card.querySelector('[data-ai-status] span');const savedMode=card.querySelector('[data-ai-mode]')?.dataset.mode;if(initial&&(!savedMode||savedMode==='idle'))initial.textContent='AI 장애나 지연 시 기존 rules-based 검색으로 자동 전환합니다.';};const patchAuth=()=>{root.querySelectorAll('.fm-auth-provider--naver,.fm-auth-provider--apple,.fm-next-social--apple').forEach(node=>node.remove())};const renderProvider=(button)=>{const screen=button.closest('[data-screen="auth"]'),card=screen?.querySelector('.fm-auth-card');if(!screen||!card)return;const provider=button.dataset.provider,label=provider==='kakao'?'카카오':'Google',logo=button.innerHTML;screen.dataset.coreAuthProvider=provider;card.innerHTML=`<div class="fm-auth-brand"><strong>FootMate</strong></div><div class="fm-core-provider"><span class="fm-core-provider-logo">${logo}</span><div class="fm-core-provider-copy"><h2>${label}로 가입하기</h2><p>선택한 경기와 설정을 유지해 가입합니다.</p><p>/app은 가입 UX simulation이며 실제 Google·Kakao OAuth는 Closed Beta에 연결됩니다.</p></div><label class="fm-core-provider-consent"><input type="checkbox" data-core-auth-consent><span><b>[필수]</b> FootMate 이용약관과 개인정보 처리방침에 동의합니다.</span></label><div class="fm-core-provider-actions"><button class="fm-core-provider-submit" type="button" data-core-auth-confirm disabled>${label}로 가입하고 계속</button><button class="fm-core-provider-back" type="button" data-auth-panel="login">다른 로그인 방법</button></div></div>`;};const teamPanel=()=>{const screen=root.querySelector('[data-screen="schedule"]');if(!screen)return;const old=screen.querySelector('[data-core-team-message]');if(old){old.remove();return}const panel=document.createElement('section');panel.className='fm-team-message-panel';panel.dataset.coreTeamMessage='true';panel.setAttribute('aria-label','팀 메시지');panel.innerHTML=`<div class="fm-team-message-head"><div><small>TEAM MESSAGE · SIMULATION</small><h3>팀 메시지</h3></div><button type="button" data-core-action="close-team">닫기</button></div><div class="fm-team-message-list"><article class="fm-team-message"><b>FootMate 운영</b><p>조끼는 현장에서 제공합니다. 경기 시작 10분 전까지 코트 앞에서 준비해주세요.</p></article><article class="fm-team-message"><b>팀 공지</b><p>도착이 늦어질 경우 ‘늦을 것 같아요’ 상태를 먼저 남겨주세요.</p></article></div><p class="fm-team-message-boundary">${exactBoundary}</p>`;(screen.querySelector('.fm-next-upcoming')||screen.querySelector('.fm-next-section'))?.insertAdjacentElement('afterend',panel);panel.scrollIntoView({block:'nearest'});};const patchMatchday=()=>{const session=footmatePlatform.session.read()||{};if(session.matchStage==='postgame'){root.querySelectorAll('[data-matchday-version],[data-matchday-home]').forEach(node=>node.dataset.corePostgameHidden='true');return}const panel=root.querySelector('[data-matchday-state="checked-in"]');const actions=panel?.querySelector('.fm-matchday-actions');if(actions&&!actions.querySelector('[data-core-action="complete-match"]'))actions.insertAdjacentHTML('afterbegin','<button type="button" class="fm-core-next-action" data-core-action="complete-match">경기 완료 · 다음으로</button>');};const patchReturn=()=>{const panel=root.querySelector('[data-return-state="saved"]');if(!panel||panel.querySelector('.fm-core-return-actions'))return;panel.insertAdjacentHTML('beforeend','<div class="fm-core-return-actions"><button type="button" data-core-action="find-next">새 경기 찾기</button><button type="button" data-core-action="return-home">홈으로</button></div>');};const clearFailedReloadMarker=()=>{if(root.querySelector('[data-participation-panel="failure"]'))try{sessionStorage.removeItem(markerKey)}catch{}};const apply=()=>{installStyles();patchAuth();patchAi();patchMatchday();patchReturn();visibleText();clearFailedReloadMarker();root.dataset.coreFlowQa='1'};root.addEventListener('submit',event=>{const form=event.target.closest('[data-ai-form]');if(!form)return;const input=form.querySelector('[data-ai-input]');if(!input)return;const original=input.value,normalized=original.replace(/고급/g,'중급+').replace(/초급/g,'초중급');if(normalized!==original){input.value=normalized;queueMicrotask(()=>{if(input.value===normalized)input.value=original})}},true);root.addEventListener('change',event=>{if(event.target.matches('[data-core-auth-consent]')){const button=event.target.closest('[data-screen="auth"]')?.querySelector('[data-core-auth-confirm]');if(button)button.disabled=!event.target.checked}},true);root.addEventListener('click',event=>{const provider=event.target.closest('.fm-auth-provider--kakao,.fm-auth-provider--google');if(provider){event.preventDefault();event.stopImmediatePropagation();renderProvider(provider);return}const core=event.target.closest('[data-core-action],[data-core-auth-confirm]');if(core){event.preventDefault();event.stopImmediatePropagation();if(core.matches('[data-core-auth-confirm]')){relay('sign-in');return}const action=core.dataset.coreAction;if(action==='close-team'){core.closest('[data-core-team-message]')?.remove();return}if(action==='complete-match'){const current=footmatePlatform.session.read()||{};footmatePlatform.session.write({...current,matchStage:'postgame',route:'schedule'});allowInternalReload();location.reload();return}if(action==='find-next'){relay('nav-discover');return}if(action==='return-home'){relay('nav-home');return}}const actionTarget=event.target.closest('[data-action],[data-matchday-action],[data-participation-action]');if(!actionTarget)return;const action=actionTarget.dataset.action,matchdayAction=actionTarget.dataset.matchdayAction,participationAction=actionTarget.dataset.participationAction;if(action==='team-chat'){event.preventDefault();event.stopImmediatePropagation();teamPanel();return}if(action==='rate-match'||['schedule','find'].includes(matchdayAction)||['cancel-payment','resolve-pending','retry-payment'].includes(participationAction)||action==='confirm-payment'||actionTarget.hasAttribute('data-participation-submit'))allowInternalReload();},true);let queued=false;const observer=new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;apply()})});observer.observe(root,{childList:true,subtree:true,characterData:true});apply();}</script>
