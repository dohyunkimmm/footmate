<script>(()=>{const root=document.getElementById('footmate-next'),key='footmate:v5.1:ai';if(!root)return;let pending=false;const set=(node,value)=>{if(node&&node.textContent!==value)node.textContent=value};const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}};const summary=result=>{const region=String(result?.region||'').replace(/\s*·\s*/g,'·').trim(),role=[result?.level,result?.position].filter(Boolean).join(' ');if(region&&role)return `${region}에서 조건에 맞는 ${role} 경기를 찾습니다.`;if(region)return `${region}에서 조건에 맞는 경기를 찾습니다.`;if(role)return `조건에 맞는 ${role} 경기를 찾습니다.`;return '조건에 맞는 경기를 찾습니다.'};function apply(){const screen=root.querySelector('[data-screen="home"]'),card=screen?.querySelector('.fm-ai-card[data-ia-role="primary-assistant"]');if(!card)return;const mode=card.querySelector('[data-ai-mode]')?.dataset.mode,connected=card.dataset.aiState==='result'&&mode==='connected-ai',title=card.querySelector('.fm-ai-head strong');if(!connected){if(title?.dataset.fmConnectedCopy==='1'){set(title,'AI에게 원하는 경기를 말해보세요.');delete title.dataset.fmConnectedCopy}return}const saved=read(),result=saved?.mode==='connected-ai'?saved.result:null;if(title){set(title,'원하는 경기를 말해보세요.');title.dataset.fmConnectedCopy='1'}if(result){const status=card.querySelector('[data-ai-status]');set(status?.querySelector('b'),summary(result));set(status?.querySelector('span'),'AI가 조건을 해석하고, 추천 순위는 기존 엔진이 계산합니다.')}}const schedule=()=>{if(pending)return;pending=true;requestAnimationFrame(()=>requestAnimationFrame(()=>{pending=false;apply()}))};new MutationObserver(schedule).observe(root,{childList:true,subtree:true,attributes:true,attributeFilter:['data-ai-state','data-mode','data-screen']});schedule()})();</script>
