name: FootMate Portfolio Assets Refresh
on:
  push:
    branches: ['improvement/footmate-case-study-qa-20261104']
    paths:
      - 'qa/refine-case-study-assets.py'
      - '.github/workflows/case-study-review-refresh.yml'
      - 'src/case-study/nine-sections.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footmate-portfolio-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Prepare slide QA tools
        run: |
          set -euo pipefail
          python3 -m venv /tmp/footmate-review
          /tmp/footmate-review/bin/pip install --quiet python-pptx==1.0.2
      - name: Refine original workbook and presentation
        run: |
          /tmp/footmate-review/bin/python qa/refine-case-study-assets.py
          /tmp/footmate-review/bin/python qa/improve-case-study-chart.py
      - name: Verify revised assets and scenario references
        run: |
          /tmp/footmate-review/bin/python - <<'PY'
          from zipfile import ZipFile
          from xml.etree import ElementTree as E
          from pptx import Presentation
          w='src/case-study/downloads/footmate_model.xlsx'
          p='src/case-study/downloads/footmate_report.pptx'
          ns={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
          with ZipFile(w) as z:
              assert z.testzip() is None
              root=E.fromstring(z.read('xl/worksheets/sheet5.xml'))
              formulas={x.get('r'):x.find('m:f',ns).text
                        for x in root.findall('.//m:c',ns) if x.find('m:f',ns) is not None}
              for addr in ('B6','B7','B8','B9'):
                  assert '원장입력' in formulas[addr],addr
              assert 'xl/worksheets/sheet6.xml' in z.namelist()
          slides=Presentation(p).slides
          assert len(slides)==10
          assert any(x.has_chart for x in slides[4].shapes)
          assert '약 28곳' in ' '.join(x.text for x in slides[3].shapes if x.has_text_frame)
          assert '비용 대비' in ' '.join(x.text for x in slides[8].shapes if x.has_text_frame)
          print('PASS: workbook source-gated checks and 10-slide presentation')
          PY
          node --check src/case-study/nine-sections.js
          node scripts/sync-case-study-assets.cjs --check
      - name: Render and update embedded slide images
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-noto-cjk
          mkdir -p /tmp/footmate-ppt
          libreoffice -env:UserInstallation=file:///tmp/lo-footmate-review --headless --convert-to pdf --outdir /tmp/footmate-ppt src/case-study/downloads/footmate_report.pptx
          test "$(pdfinfo /tmp/footmate-ppt/footmate_report.pdf | awk '/^Pages:/ {print $2}')" = "10"
          for page in $(seq 1 10); do
            number="$(printf '%02d' "$page")"
            pdftoppm -f "$page" -l "$page" -scale-to-x 1280 -scale-to-y -1 -png -singlefile /tmp/footmate-ppt/footmate_report.pdf "/tmp/footmate-ppt/page-$number"
          done
          python3 - <<'PY'
          from pathlib import Path
          import base64,json
          titles=['플랫폼 운영과 수익성 개선','운영 모델과 책임','공급과 플랫폼 경유 예약',
                  '수익성 개선안','월간 성과관리','손익 차이와 운영 조치','운영 데이터와 통제',
                  'IT 투자 범위와 비용','12개월 비용 대비 손익률','최종 판단 · 단계적 투자']
          slides=[]
          for i,title in enumerate(titles,1):
              img=Path(f'/tmp/footmate-ppt/page-{i:02}.png').read_bytes()
              assert img.startswith(bytes.fromhex('89504e470d0a1a0a')) and len(img)>5000
              slides.append({'title':title,'src':'data:image/png;base64,'+base64.b64encode(img).decode('ascii')})
          Path('src/case-study/report-previews.js').write_text(
              'window.REPORT_SLIDES='+json.dumps(slides,ensure_ascii=False,separators=(',',':'))+';\n',encoding='utf-8')
          assert len(slides)==10
          print('PASS: slide previews synchronized from edited PPTX')
          PY
      - name: Commit original assets and synchronized previews
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/case-study/downloads/footmate_report.pptx src/case-study/downloads/footmate_model.xlsx src/case-study/report-previews.js
          if git diff --cached --quiet; then
            echo 'PASS: assets already synchronized'
          else
            git commit -m 'docs: synchronize verified XLSX, PPTX and slide previews'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
