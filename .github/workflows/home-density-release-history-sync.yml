name: Home Density Release History Sync
on:
  push:
    branches: [docs/home-initial-viewport-density-closure]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/home-initial-viewport-density-closure
      - name: Prepend verified closure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/RELEASE-HISTORY.md')
          s=p.read_text()
          marker='## Real App Home initial viewport density closure · 2026-09-24'
          if marker in s:
              raise SystemExit('closure already present')
          anchor='이 문서는 현재 public branch의 **검증된 durable release 사실**을 기록한다. 일시적인 Preview 취소·quota·대기 상태는 누적하지 않는다. docs-only merge로 moving `main`이 바뀌어도 각 release의 product/runtime baseline과 exact Production SHA는 별도로 유지한다.\n\n'
          section='''## Real App Home initial viewport density closure · 2026-09-24\n\n- Scope: Real App Home 진입 직후의 과도한 vertical scroll을 줄이기 위해 standalone max 560px shell의 greeting·추천 context·AI Match Assistant·section heading·personalization explanation density를 압축\n- Root cause: Product shell은 max 560px로 고정되어 있지만 일부 Home density 규칙이 browser viewport breakpoint에 묶여 있어 shell보다 넓은 viewport에서 상단 카드 stack이 불필요하게 다시 확장됨\n- Runtime PR: #265 · merged SHA `f18da024038ef0260b1e3a8af25221b0d5f21be7`\n- Product/runtime baseline: `f18da024038ef0260b1e3a8af25221b0d5f21be7`\n- Geometry contract: 390×844에서 첫 추천 match가 persistent bottom navigation 위에 의미 있게 노출되도록 `firstCardTop <= 600` 및 `navTop - firstCardTop >= 120`; 601px viewport에서도 fixed 560px shell compactness와 no-horizontal-overflow를 별도 regression으로 고정\n- Preserved boundary: IA·copy·AI core emphasis·44px touch target·bottom navigation·routes·state machines·deterministic recommendation·Matching/ELO ownership·Product `/demo`·Portfolio `/demo?mode=portfolio`·39-screen baseline·v5.2.0 release identity 유지\n- Performance boundary: first-party asset request budget 24/24 유지\n- Final PR QA: Real App White Surface QA #120 · run `36005724651` · SUCCESS · actual Ubuntu/Chromium `toHaveScreenshot()` comparison 20/20 PASS; FootMate QA #1217 · run `36005724905` · SUCCESS · Regression 36 PASS · Browser E2E + axe PASS · Mobile Safari/WebKit PASS\n- Final post-merge QA: Real App White Surface QA #121 · run `36006648149` · SUCCESS; FootMate QA #1219 · run `36006647616` · SUCCESS · Regression 36 PASS · Browser E2E + axe PASS · Product Visual Regression PASS · Mobile Safari/WebKit PASS · Production Smoke PASS\n- Exact Production verification: HTTP smoke PASS · AI inference PASS (`openai/gpt-5.4-nano`, `fallbackUsed=true`) · Chromium smoke 7/7 PASS\n- Exact Vercel Production: `dpl_2QZVYSvd2WvtGn2fwRMSsYtBjw5L` · SHA `f18da024038ef0260b1e3a8af25221b0d5f21be7` · READY · official alias `footmate-black.vercel.app`\n- Documentation boundary: README·Closed Beta runbook·AI architecture는 기능/운영 계약이 바뀌지 않아 중복 수정하지 않음; Case Study는 별도 프로젝트 경계를 유지하며 이번 FootMate 변경에서 직접 수정하지 않음\n\n'''
          if anchor not in s:
              raise SystemExit('release history header anchor missing')
          p.write_text(s.replace(anchor, anchor+section, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RELEASE-HISTORY.md
          git diff --cached --check
          git commit -m "docs: record Home initial viewport density closure"
          git push origin HEAD:docs/home-initial-viewport-density-closure
