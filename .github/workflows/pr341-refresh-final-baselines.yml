name: PR341 Refresh Final Baselines

on:
  push:
    branches: [polish/home-ai-compact-20260926]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[pr341-final-baselines]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: polish/home-ai-compact-20260926

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Align compact Home contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          bootstrap = Path('src/v4/platform/presentation/bootstrap.js')
          text = bootstrap.read_text(encoding='utf-8')
          old = 'font-size:9px!important;'
          if old not in text:
              raise SystemExit('compact condition font marker not found')
          bootstrap.write_text(text.replace(old,'font-size:10px!important;',1),encoding='utf-8')

          product = Path('tests/e2e/product-completion.spec.cjs')
          text = product.read_text(encoding='utf-8')
          old = "  await expect(screen.locator('.fm-next-greeting h1')).toHaveText('오늘, 어떤 경기에서 뛸까요?');"
          new = "  await expect(screen.locator(':scope > .fm-next-greeting')).toHaveCount(0);\n  await expect(screen.locator(':scope > .fm-next-topbar [data-action=\"nav-profile\"]')).toHaveCount(0);"
          if old not in text:
              raise SystemExit('old Home greeting contract not found')
          product.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Install browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION" css-tree@3.1.0
          npx playwright install --with-deps chromium

      - name: Refresh affected Home screenshot baselines
        run: |
          npx playwright test --project=chromium \
            tests/e2e/v5.1-visual-baseline.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs \
            tests/e2e/v5.1-release-flow-review.spec.cjs \
            tests/e2e/real-app-white-surface.spec.cjs \
            tests/e2e/product-completion.spec.cjs \
            --update-snapshots

      - name: Commit final source, contracts and baselines
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v4/platform/presentation/bootstrap.js tests
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "test: finalize compact Home baselines [pr341-final-baselines]"
          git push origin HEAD:polish/home-ai-compact-20260926
