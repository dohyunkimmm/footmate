name: Patch Case Study Section Label Contract
on:
  push:
    branches:
      - fix/case-study-section-labels-en
    paths:
      - .github/workflows/patch-case-study-section-label-contract.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/case-study-section-labels-en
          fetch-depth: 0
      - name: Patch Case Study content contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/v5.1-case-study-content.spec.cjs')
          s=p.read_text()
          s=s.replace("document.documentElement.dataset.footmateCaseStudyHeadingLanguage==='en'","document.documentElement.dataset.footmateCaseStudySectionLabelLanguage==='en'")
          start=s.index("test('story headings are English while supporting body copy remains Korean-first'")
          end=s.index("\ntest('merged sections keep one clear job without exposing route strings as reader labels'",start)
          replacement="""test('section labels are English while story headings and supporting body copy remain Korean-first',async({page})=>{\n  await openCaseStudy(page);\n  await expect(page.locator('html')).toHaveAttribute('data-footmate-case-study-section-label-language','en');\n  await expect(page.locator('html')).toHaveAttribute('data-footmate-case-study-heading-language','ko');\n\n  const labels=await page.locator('.slide:not([hidden]) .fm-next-story-kicker').allTextContents();\n  expect(labels).toEqual([\n    '02 · Problem',\n    '03 · Persona · JTBD',\n    '04 · Product Principle · Core Journey',\n    '05 · Design Decision 01',\n    '06 · Design Decision 02',\n    '07 · Design Decision 03',\n    '08 · Sign in · Join',\n    '09 · Matchday · Return',\n    '10 · Recovery',\n    '11 · Domain · AI Boundary',\n    '12 · Validation',\n    '13 · Production Boundary'\n  ]);\n\n  const headings=await page.locator('.slide:not([hidden]) .fm-next-story h2').allTextContents();\n  expect(headings).toHaveLength(12);\n  expect(headings.every(title=>/[가-힣]/.test(title))).toBe(true);\n  const leads=await page.locator('.slide:not([hidden]) .fm-next-story-lead').allTextContents();\n  expect(leads.join('\\n')).toMatch(/[가-힣]/);\n});\n"""
          s=s[:start]+replacement+s[end:]
          for line in [
            "  expect(thesis).toContain('Build one continuous decision flow instead of adding more features.');\n",
            "  expect(signInJoin).toContain('Preserve the chosen match through authentication and participation.');\n",
            "  expect(domain).toContain('Separate state ownership, provider boundaries, and AI authority.');\n",
            "  expect(production).toContain('Only describe capabilities that are actually connected and verified.');\n",
          ]:
            s=s.replace(line,'')
          p.write_text(s)
          PY
      - name: Commit contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-case-study-content.spec.cjs
          git diff --cached --quiet && { echo "No contract changes"; exit 1; }
          git commit -m "test: align Case Study section label language contract"
          git push origin HEAD:fix/case-study-section-labels-en
