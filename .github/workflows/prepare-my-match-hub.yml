name: Prepare MY match hub
on:
  push:
    branches:
      - feat/my-match-hub-3tab-20260927
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply codemod
        run: python3 scripts/prepare-my-match-hub.py
      - name: Check patch integrity
        run: |
          git diff --check
          node --check src/v4/app.js
          node --check src/v4/matchday.js
          node --check tests/e2e/v4-matchday.spec.cjs
      - name: Commit prepared changes
        run: |
          rm .github/workflows/prepare-my-match-hub.yml scripts/prepare-my-match-hub.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: move match hub into MY"
          git push
