name: Temporary Fix Real App Welcome Visible
on:
  push:
    branches: [fix/real-app-welcome-visible-alignment-20260925]
permissions:
  contents: write
jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Patch welcome positioning, CTA parity and cache bust
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.html')
          text = app.read_text()
          style = '''<style id="fm-real-app-welcome-visible-fix">html[data-footmate-surface="real"] .fm-next-page[data-mode="real"] [data-screen="welcome"] .fm-next-topbar--dark{position:absolute;top:0}html[data-footmate-surface="real"] .fm-next-page[data-mode="real"] [data-screen="welcome"] .fm-personalization-quick{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:54px;min-height:54px;padding:0 20px;border:0;border-radius:16px;background:linear-gradient(180deg,#0b3828 0%,var(--fm-pitch) 100%);color:#fff;box-shadow:0 12px 28px rgba(9,46,33,.19);font-size:15px;font-weight:800;letter-spacing:-.015em}</style>'''
          marker = '</style>\n\n</head><body>'
          if 'fm-real-app-welcome-visible-fix' not in text:
              if marker not in text:
                  raise SystemExit('app.html insertion marker not found')
              text = text.replace(marker, f'</style>\n{style}\n\n</head><body>', 1)
          text = text.replace('/src/v4/app.js?v=490', '/src/v4/app.js?v=491')
          text = text.replace('/src/v4/personalization.js?v=490', '/src/v4/personalization.js?v=491')
          app.write_text(text)

          spec = Path('tests/e2e/real-app-white-surface.spec.cjs')
          text = spec.read_text()
          transform_line = "  await expect(page.locator('[data-screen=\"welcome\"] .fm-next-topbar--dark')).toHaveCSS('transform','matrix(1, 0, 0, 1, 0, -12)');"
          position_line = "  await expect(page.locator('[data-screen=\"welcome\"] .fm-next-topbar--dark')).toHaveCSS('position','absolute');"
          if position_line not in text:
              if transform_line not in text:
                  raise SystemExit('welcome topbar assertion marker not found')
              text = text.replace(transform_line, transform_line + '\n' + position_line, 1)
          old_geometry = "  const geometry=async locator=>locator.evaluate(node=>{const style=getComputedStyle(node);const box=node.getBoundingClientRect();return {height:box.height,paddingTop:style.paddingTop,paddingBottom:style.paddingBottom,borderRadius:style.borderRadius}});"
          new_geometry = "  const geometry=async locator=>locator.evaluate(node=>{const style=getComputedStyle(node);const box=node.getBoundingClientRect();return {height:box.height,paddingTop:style.paddingTop,paddingBottom:style.paddingBottom,borderRadius:style.borderRadius,borderTopWidth:style.borderTopWidth,backgroundImage:style.backgroundImage,color:style.color,fontSize:style.fontSize,fontWeight:style.fontWeight,letterSpacing:style.letterSpacing,boxShadow:style.boxShadow,justifyContent:style.justifyContent}});"
          if new_geometry not in text:
              if old_geometry not in text:
                  raise SystemExit('CTA geometry helper marker not found')
              text = text.replace(old_geometry, new_geometry, 1)
          spec.write_text(text)
          PY
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh changed welcome baselines
        run: |
          npx playwright test tests/e2e/real-app-white-surface.spec.cjs --project=chromium --grep "Welcome" --update-snapshots
          npx playwright test tests/e2e/v5.1-release-flow-review.spec.cjs --project=chromium --grep "welcome hero" --update-snapshots
      - name: Compare changed welcome baselines
        run: |
          npx playwright test tests/e2e/real-app-white-surface.spec.cjs --project=chromium --grep "Welcome"
          npx playwright test tests/e2e/v5.1-release-flow-review.spec.cjs --project=chromium --grep "welcome hero"
      - name: Commit verified fix and remove temporary workflow
        run: |
          git rm .github/workflows/tmp-fix-real-app-welcome-visible.yml
          git add app.html tests/e2e/real-app-white-surface.spec.cjs tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-welcome-390-chromium-linux.png tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-personalized-welcome-390-chromium-linux.png tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-390-chromium-linux.png tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-1440-chromium-linux.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make Real App welcome changes visibly apply [welcome-visible-generated]"
          git push origin HEAD:fix/real-app-welcome-visible-alignment-20260925