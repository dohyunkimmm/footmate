name: Reorder FootMate final presentation slides
on:
  push:
    branches: [fix/footmate-roi-slide-order-20261102]
    paths:
      - scripts/swap-last-ppt-slides.py
permissions:
  contents: write
jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet python-pptx
      - name: Swap slide 9/10 and viewer metadata without changing slide content
        run: python scripts/swap-last-ppt-slides.py
      - name: Commit changed presentation and viewer metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/case-study/downloads/footmate_report.pptx src/case-study/report-previews.js src/case-study/materials.html
          if ! git diff --cached --quiet; then
            git commit -m "Move ROI analysis before final decision memo in PPT and previews"
            git push origin HEAD:fix/footmate-roi-slide-order-20261102
          fi
