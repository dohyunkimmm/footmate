name: Refresh Release Welcome Baseline

on:
  push:
    branches:
      - fix/welcome-visible-shift-20260926

permissions:
  contents: write

jobs:
  baseline:
    if: ${{ !contains(github.event.head_commit.message, '[update-release-welcome-baseline]') && !contains(github.event.head_commit.message, '[remove-release-welcome-baseline]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Playwright
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Refresh release Welcome baselines
        run: |
          npx playwright test tests/e2e/v5.1-release-flow-review.spec.cjs --project=chromium --grep "welcome hero keeps readable contrast and an approved full-surface baseline" --update-snapshots
          git status --short
          test "$(git status --short | wc -l | tr -d ' ')" = "2"
          git status --short | grep -F "tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-390-chromium-linux.png"
          git status --short | grep -F "tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-1440-chromium-linux.png"
      - name: Verify refreshed baselines by real comparison
        run: npx playwright test tests/e2e/v5.1-release-flow-review.spec.cjs --project=chromium --grep "welcome hero keeps readable contrast and an approved full-surface baseline"
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-390-chromium-linux.png tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-1440-chromium-linux.png
          git commit -m "test: approve moved Welcome release baselines [update-release-welcome-baseline]"
          git push origin HEAD:fix/welcome-visible-shift-20260926
