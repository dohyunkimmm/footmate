name: Refresh low-priority visual baselines

on:
  push:
    branches:
      - polish/low-priority-ux-20260927

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Refresh only reviewed low-priority baselines
        run: |
          npx playwright test --project=chromium \
            tests/e2e/priority-ux.spec.cjs \
            tests/e2e/checkin-state.spec.cjs \
            tests/e2e/v5.1-release-flow-review.spec.cjs \
            --grep "MY distinguishes saved and current settings|check-in completion is shared|checked-in continuation action matches" \
            --update-snapshots
      - name: Commit only approved baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/e2e/priority-ux.spec.cjs-snapshots/priority-profile-current-390-chromium-linux.png \
            tests/e2e/checkin-state.spec.cjs-snapshots/checkin-my-completed-390-chromium-linux.png \
            tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-checked-in-390-chromium-linux.png
          if git diff --cached --quiet; then
            echo "No baseline changes"
            exit 0
          fi
          git commit -m "test: refresh low-priority visual baselines"
          git push origin HEAD:${{ github.ref_name }}
