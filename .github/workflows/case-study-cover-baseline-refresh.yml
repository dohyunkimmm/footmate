name: Temporary Case Study Cover Baseline Refresh
on:
  push:
    branches: [fix/case-study-ai-search-preview]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh changed Case Study cover baselines
        run: npx playwright test tests/e2e/v5.1-case-study-visual.spec.cjs --grep "cover" --update-snapshots
      - name: Commit refreshed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/
          git diff --cached --quiet && exit 0
          git commit -m "test: refresh Case Study AI cover baselines"
          git push
