name: Refresh Task Usability Baselines

on:
  push:
    branches:
      - portfolio/task-usability-evidence

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: portfolio/task-usability-evidence
          fetch-depth: 0
      - name: Download reviewed browser evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/evidence
          mkdir -p /tmp/evidence
          gh run download 35976687553 --repo "$GITHUB_REPOSITORY" --name v5.3-browser-e2e-35976687553 --dir /tmp/evidence
      - name: Replace only reviewed 03 and 13 baselines
        shell: bash
        run: |
          set -euo pipefail
          dest='tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots'
          copy_actual() {
            src_name="$1"
            dest_name="$2"
            src="$(find /tmp/evidence -type f -name "$src_name" -print -quit)"
            test -n "$src"
            cp "$src" "$dest/$dest_name"
          }
          copy_actual 'case-study-13-persona-1440-actual.png' 'case-study-13-persona-1440-chromium-linux.png'
          copy_actual 'case-study-13-persona-390-actual.png' 'case-study-13-persona-390-chromium-linux.png'
          copy_actual 'case-study-full-body-3-320-actual.png' 'case-study-full-body-3-320-chromium-linux.png'
          copy_actual 'case-study-full-body-3-390-actual.png' 'case-study-full-body-3-390-chromium-linux.png'
          copy_actual 'case-study-13-production-1440-actual.png' 'case-study-13-production-1440-chromium-linux.png'
          copy_actual 'case-study-13-production-390-actual.png' 'case-study-13-production-390-chromium-linux.png'
          copy_actual 'case-study-full-body-13-320-actual.png' 'case-study-full-body-13-320-chromium-linux.png'
          copy_actual 'case-study-full-body-13-390-actual.png' 'case-study-full-body-13-390-chromium-linux.png'
          git diff --stat -- "$dest"
          test "$(git diff --name-only -- "$dest" | wc -l)" -eq 8
      - name: Commit reviewed baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/
          git commit -m 'test: approve task usability visual baselines'
          git push origin HEAD:portfolio/task-usability-evidence
