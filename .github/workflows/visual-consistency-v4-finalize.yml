name: Visual Consistency V4 Finalize
on:
  push:
    branches: [design/visual-consistency-v4-20260928]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION" css-tree@3.1.0
      - name: Verify CSS syntax and ownership
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const csstree=require('css-tree');
          const html=fs.readFileSync('app.html','utf8');
          const css=fs.readFileSync('src/v4/visual-consistency-v4.css','utf8');
          if(!html.includes('/src/v4/visual-consistency-v4.css?v=1'))throw new Error('consistency stylesheet missing');
          csstree.parse(css);
          console.log('PASS CSS syntax and ownership');
          NODE
      - name: Refresh impacted Product visual baselines
        run: |
          npx playwright test --project=chromium \
            tests/e2e/visual-consistency-v4.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs \
            tests/e2e/v5.1-visual-baseline.spec.cjs \
            tests/e2e/v5.1-release-flow-review.spec.cjs \
            tests/e2e/real-app-white-surface.spec.cjs \
            --update-snapshots
      - name: Compare refreshed Product visual baselines separately
        run: |
          npx playwright test --project=chromium \
            tests/e2e/visual-consistency-v4.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs \
            tests/e2e/v5.1-visual-baseline.spec.cjs \
            tests/e2e/v5.1-release-flow-review.spec.cjs \
            tests/e2e/real-app-white-surface.spec.cjs
      - name: Run focused functional regression
        run: |
          npx playwright test --project=chromium \
            tests/e2e/v4-participation.spec.cjs \
            tests/e2e/welcome-position.spec.cjs \
            tests/e2e/welcome-source-layout.spec.cjs \
            tests/e2e/v5.1-core.spec.cjs
      - name: Commit verified baselines and remove temporary finalizer
        env:
          BRANCH_NAME: design/visual-consistency-v4-20260928
        run: |
          rm -f .github/workflows/visual-consistency-v4-finalize.yml
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No baseline changes to commit"
            exit 0
          fi
          git commit -m "test: lock final visual consistency baselines"
          git push origin "HEAD:${BRANCH_NAME}"
