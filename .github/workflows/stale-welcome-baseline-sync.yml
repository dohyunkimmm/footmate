name: One-off stale welcome baseline sync
on:
  push:
    branches: [fix/real-app-shell-native-polish]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh stale white-surface welcome baselines
        run: npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs --update-snapshots
      - name: Commit refreshed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/real-app-white-surface.spec.cjs-snapshots
          if git diff --cached --quiet; then
            echo "No baseline changes"
            exit 0
          fi
          git commit -m "test: sync approved welcome white-surface baselines"
          git push
