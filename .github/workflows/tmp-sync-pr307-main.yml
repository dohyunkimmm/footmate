name: Temporary PR307 Main Sync
on:
  push:
    branches: [fix/real-app-welcome-copy-cta-final]
    paths: [.github/workflows/tmp-sync-pr307-main.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/real-app-welcome-copy-cta-final
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:fix/real-app-welcome-copy-cta-final
