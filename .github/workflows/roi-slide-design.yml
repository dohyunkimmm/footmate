name: ROI slide design match
on:
  push:
    branches: [fix/roi-slide-design-match-20261102]
    paths:
      - .github/workflows/roi-slide-design.yml
      - scripts/style-roi-slide.py
permissions:
  contents: write
jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install slide renderer and image dependencies
        run: |
          python -m pip install --quiet python-pptx pillow fonttools brotli pymupdf
          if ! command -v libreoffice >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-impress > /dev/null
          fi
      - name: Prepare official Pretendard and Tossface fonts locally
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          for weight in Regular Medium SemiBold Bold; do
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/orioncactus/pretendard/main/packages/pretendard/dist/public/static/Pretendard-$weight.otf" -o "$HOME/.local/share/fonts/Pretendard-$weight.otf"
          done
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/toss/tossface/main/dist/TossFaceFontMac-09.woff2' -o /tmp/TossFaceFontMac-09.woff2
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match Pretendard
      - name: Match slide 10 layout and all fonts
        run: python scripts/style-roi-slide.py
      - name: Validate all slides and preview images
        run: |
          python - <<'PY'
          from pptx import Presentation
          import json
          from pathlib import Path
          prs=Presentation('src/case-study/downloads/footmate_report.pptx')
          assert len(prs.slides)==10
          bad=[]
          for i,sl in enumerate(prs.slides,1):
            for sh in sl.shapes:
              frames=[]
              if sh.has_text_frame: frames.append(sh.text_frame)
              if sh.has_table: frames.extend(c.text_frame for row in sh.table.rows for c in row.cells)
              for frame in frames:
                for paragraph in frame.paragraphs:
                  for run in paragraph.runs:
                    if run.text and run.font.name!='Pretendard':
                      bad.append((i,run.text,run.font.name))
          assert not bad, f'Font mismatches: {bad[:20]}'
          assert '예상 ROI' in prs.slides[-1].shapes[0].text
          path=Path('src/case-study/report-previews.js')
          content=path.read_text()
          assert len(json.loads(content.split('=',1)[1].rstrip().rstrip(';')))==10
          print('PASS all text Pretendard and Tossface icon embedded, 10 PNG slides')
          PY
      - name: Commit matched PPTX and previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/case-study/downloads/footmate_report.pptx src/case-study/report-previews.js
          if ! git diff --cached --quiet; then
            git commit -m "Use Pretendard across slides and Tossface emoji on ROI slide"
            git push origin HEAD:fix/roi-slide-design-match-20261102
          fi
