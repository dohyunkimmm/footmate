name: Generate Real App White Tone Baselines

on:
  push:
    branches: [ui/real-app-white-tone]

permissions:
  contents: write

jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Install browser and CSS syntax QA dependencies
        run: npm install --no-save @playwright/test@1.55.1 @axe-core/playwright@4.10.2 css-tree@3.1.0
      - name: Parse Real App white-tone CSS
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const csstree=require('css-tree');
          const html=fs.readFileSync('app.html','utf8');
          const match=html.match(/<style id="fm-real-app-white-tone">([\s\S]*?)<\/style>/);
          if(!match)throw new Error('fm-real-app-white-tone inline style not found');
          csstree.parse(match[1],{context:'stylesheet'});
          console.log('PASS Real App white-tone CSS syntax');
          NODE
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate impacted Product visual baselines
        run: npx playwright test tests/e2e/v5.1-visual-baseline.spec.cjs tests/e2e/v5.1-visual-system-completion.spec.cjs --update-snapshots
      - name: Commit approved candidate baselines
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/v5.1-visual-baseline.spec.cjs-snapshots tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots
          if git diff --cached --quiet; then
            echo 'No Product visual baseline changes generated.'
            exit 0
          fi
          git commit -m 'test: update approved Real App white-tone visual baselines'
          git push origin HEAD:ui/real-app-white-tone
