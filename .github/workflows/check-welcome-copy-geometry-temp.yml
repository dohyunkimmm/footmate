name: Check Welcome Copy Geometry Temp
on:
  push:
    branches:
      - fix/welcome-brand-copy-offset-20260926
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check Welcome brand copy is fully inside app shell
        run: |
          cat > tests/e2e/_temp-welcome-copy-geometry.spec.cjs <<'EOF'
          const {test,expect}=require('@playwright/test');
          test('welcome copy geometry',async({page})=>{
            await page.setViewportSize({width:390,height:844});
            await page.goto('/app',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>localStorage.clear());
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__FOOTMATE_V5__?.version==='5.1.1');
            await page.evaluate(()=>document.fonts?.ready||Promise.resolve());
            const geometry=await page.locator('[data-screen="welcome"] .fm-next-brand').evaluate(node=>{
              const app=node.closest('.fm-next-app').getBoundingClientRect();
              const brand=node.getBoundingClientRect();
              const mark=node.querySelector('.fm-next-brand-mark').getBoundingClientRect();
              const copy=node.querySelector('span:last-child').getBoundingClientRect();
              return {appTop:app.top,brandTop:brand.top,markTop:mark.top,copyTop:copy.top,copyBottom:copy.bottom,copyHeight:copy.height};
            });
            console.log('WELCOME_COPY_GEOMETRY='+JSON.stringify(geometry));
            expect(geometry.copyTop).toBeGreaterThanOrEqual(geometry.appTop);
          });
          EOF
          npx playwright test --project=chromium tests/e2e/_temp-welcome-copy-geometry.spec.cjs
