name: Sync Reviewed Home Density Main Baselines
on:
  push:
    branches: [fix/home-initial-viewport-density]
permissions:
  actions: read
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/home-initial-viewport-density
      - name: Download reviewed main QA evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/home-main-evidence
          mkdir -p /tmp/home-main-evidence
          gh run download 36002664413 -n v5.3-browser-e2e-36002664413 -D /tmp/home-main-evidence
      - name: Promote only reviewed affected Home actuals
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/home-main-evidence')
          mappings={
            'release-flow-ai-core-1440-actual.png':'tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-ai-core-1440-chromium-linux.png',
            'real-app-context-actions-320-actual.png':'tests/e2e/v5.1-visual-baseline.spec.cjs-snapshots/real-app-context-actions-320-chromium-linux.png',
            'real-app-ai-card-390-actual.png':'tests/e2e/v5.1-visual-baseline.spec.cjs-snapshots/real-app-ai-card-390-chromium-linux.png',
            'visual-system-home-1440-actual.png':'tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-home-1440-chromium-linux.png',
            'visual-system-ai-fallback-390-actual.png':'tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-ai-fallback-390-chromium-linux.png',
            'visual-system-ai-loading-390-actual.png':'tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-ai-loading-390-chromium-linux.png',
            'visual-system-home-390-full-actual.png':'tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-home-390-full-chromium-linux.png',
            'product-density-home-320-actual.png':'tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-320-chromium-linux.png',
            'product-density-home-375-actual.png':'tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-375-chromium-linux.png',
            'product-density-home-390-actual.png':'tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-390-chromium-linux.png',
            'product-density-home-430-actual.png':'tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-430-chromium-linux.png',
          }
          for name,target in mappings.items():
              matches=list(root.rglob(name))
              if len(matches)!=1:
                  raise SystemExit(f'{name}: expected one actual, found {len(matches)}')
              dest=Path(target)
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(matches[0].read_bytes())
          PY
      - name: Commit reviewed main baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/*-snapshots
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m "test: approve compact Home visual baselines"
          git push origin HEAD:fix/home-initial-viewport-density