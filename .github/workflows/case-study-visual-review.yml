name: Case Study Visual Review

on:
  push:
    branches:
      - portfolio/case-study-visual-96

permissions:
  contents: read

jobs:
  render-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install visual QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render changed Case Study against current baselines
        continue-on-error: true
        run: npx playwright test --project=chromium tests/e2e/v5.1-case-study-visual.spec.cjs
      - name: Upload visual review evidence
        uses: actions/upload-artifact@v6
        with:
          name: case-study-visual-review-rendered
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
