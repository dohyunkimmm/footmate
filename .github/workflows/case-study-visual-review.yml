name: Case Study Visual Review

on:
  push:
    branches:
      - portfolio/case-study-visual-96

permissions:
  contents: read

jobs:
  export-baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package all current 13-section baselines
        uses: actions/upload-artifact@v6
        with:
          name: case-study-visual-review-baselines
          path: |
            tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/case-study-13-*-1440-chromium-linux.png
            tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/case-study-13-*-390-chromium-linux.png
