name: Case Study Visual Review

on:
  push:
    branches:
      - portfolio/case-study-visual-96

permissions:
  contents: write

jobs:
  approve-visual-baseline:
    if: ${{ !contains(github.event.head_commit.message, '[visual-baseline]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Case Study QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Re-run Case Study content, wrap and accessibility regression
        run: npx playwright test --project=chromium tests/e2e/v5.1-case-study.spec.cjs tests/e2e/v5.1-case-study-content.spec.cjs tests/e2e/v5.1-case-study-wrap.spec.cjs tests/e2e/v5.1-case-study-accessibility.spec.cjs
      - name: Update approved Case Study visual baselines
        run: npx playwright test --project=chromium tests/e2e/v5.1-case-study-visual.spec.cjs --update-snapshots
      - name: Commit approved visual baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes"
          else
            git commit -m "test: approve case study visual hierarchy baselines [visual-baseline]"
            git push origin HEAD:portfolio/case-study-visual-96
          fi
