name: Case Study Visual Review

on:
  push:
    branches:
      - portfolio/case-study-visual-96

permissions:
  contents: read

jobs:
  case-study-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Case Study QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Case Study content, wrap and accessibility regression
        run: npx playwright test --project=chromium tests/e2e/v5.1-case-study.spec.cjs tests/e2e/v5.1-case-study-content.spec.cjs tests/e2e/v5.1-case-study-wrap.spec.cjs tests/e2e/v5.1-case-study-accessibility.spec.cjs
      - name: Capture current Case Study renders
        run: npx playwright test --project=chromium tests/e2e/case-study-visual-review.spec.cjs
      - name: Upload current render evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: case-study-current-render
          path: |
            visual-review-output/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
