name: Temporary Real App Welcome Fix
on:
  push:
    branches: [fix/real-app-welcome-copy-cta-final]
    paths: [.github/workflows/tmp-real-app-welcome-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/real-app-welcome-copy-cta-final
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Patch Real App welcome source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path=Path('src/v4/app.js')
          app=app_path.read_text()
          new_welcome=r'''function welcomeView(){
            if(mode==='real'){
              return `<section class="fm-next-screen fm-next-screen--intro" data-screen="welcome">
                <div class="fm-next-intro">
                  <div class="fm-next-topbar fm-next-topbar--dark">${brand({dark:true})}<span style="width:44px" aria-hidden="true"></span></div>
                  <div class="fm-next-intro-copy">
                    <h1>내 수준에 맞는 경기를<br>찾아보세요.</h1>
                    <p class="fm-next-intro-lead">지역과 플레이 스타일에 맞는 경기를 먼저 추천해드려요.</p>
                  </div>
                  <div class="fm-next-actions">
                    ${button(`내 경기 찾아보기 ${icon('arrow')}`,'start-setup','primary')}
                    ${state.setupComplete?button('저장된 설정으로 바로 추천 보기','continue-home','primary'):''}
                  </div>
                </div>
              </section>`;
            }
            return `<section class="fm-next-screen fm-next-screen--intro" data-screen="welcome">
              <div class="fm-next-intro">
                <div class="fm-next-topbar fm-next-topbar--dark">${brand({dark:true})}<span style="width:44px" aria-hidden="true"></span></div>
                <div class="fm-next-intro-copy">
                  <div class="fm-next-eyebrow"><span class="fm-next-eyebrow-dot"></span>오늘 뛸 경기를 더 쉽게</div>
                  <h1>내 수준에 맞는 경기부터,<br>경기 당일까지.</h1>
                  <p class="fm-next-intro-lead">지역과 플레이 스타일만 알려주세요. FootMate가 맞는 경기를 먼저 보여주고, 참가가 필요할 때 계정을 연결합니다.</p>
                </div>
                <div class="fm-next-intro-flow" aria-label="FootMate 핵심 흐름"><b>Find</b><span aria-hidden="true">→</span><b>Decide</b><span aria-hidden="true">→</span><b>Join</b><span aria-hidden="true">→</span><b>Play</b><span aria-hidden="true">→</span><b>Return</b></div>
                <div class="fm-next-actions">
                  ${button(`내 경기 찾아보기 ${icon('arrow')}`,'start-setup','lime')}
                  ${state.setupComplete?button('이전 설정으로 계속하기','continue-home','text'):''}
                </div>
                <p class="fm-next-intro-note">둘러보는 데 계정이 필요하지 않아요.</p>
              </div>
            </section>`;
          }
          '''
          app2,n=re.subn(r'function welcomeView\(\)\{.*?\n\}\n\n(?=const setupSteps=)',new_welcome,app,count=1,flags=re.S)
          if n!=1:
            raise SystemExit(f'welcomeView replacement count={n}')
          app_path.write_text(app2)

          css_path=Path('src/v4/discovery.css')
          css=css_path.read_text()
          css2,n=re.subn(r'\n\[data-mode=real\] \[data-screen=welcome\]\{.*\}\s*$', '\n[data-mode=real] [data-screen=welcome] .fm-next-topbar--dark{position:absolute!important}', css, count=1, flags=re.S)
          if n!=1:
            raise SystemExit(f'welcome CSS replacement count={n}')
          css_path.write_text(css2)
          PY
      - name: Verify performance budget before screenshots
        run: node scripts/check-v4.9-performance-budget.cjs
      - name: Install browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh only approved Real App welcome baselines
        run: npx playwright test --project=chromium tests/e2e/v5.1-release-flow-review.spec.cjs -g "welcome hero keeps readable contrast and an approved full-surface baseline" --update-snapshots
      - name: Commit source and welcome baselines
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/v4/app.js src/v4/discovery.css tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-390-chromium-linux.png tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-1440-chromium-linux.png
          git diff --cached --quiet && exit 0
          git commit -m "fix: apply final Real App welcome content and baselines"
          git push origin HEAD:fix/real-app-welcome-copy-cta-final
