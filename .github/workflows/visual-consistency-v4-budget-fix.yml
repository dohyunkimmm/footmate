name: Visual Consistency V4 Budget Fix
on:
  push:
    branches: [design/visual-consistency-v4-20260928]
    paths:
      - .github/workflows/visual-consistency-v4-budget-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/visual-consistency-v4-20260928
          fetch-depth: 0
      - name: Trim non-rendering app HTML bytes
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='app.html';
          let html=fs.readFileSync(path,'utf8');
          html=html.replace('/src/v4/visual-consistency-v4.css?v=1','/src/v4/visual-consistency-v4.css');
          html=html.replace('</style>\n<link rel="stylesheet" href="/src/v4/visual-consistency-v4.css">','</style><link rel="stylesheet" href="/src/v4/visual-consistency-v4.css">');
          html=html.replace('\n\n</head>','\n</head>');
          html=html.replace('</script>\n\n</body>','</script>\n</body>');
          fs.writeFileSync(path,html);
          if(Buffer.byteLength(html)>16000)throw new Error(`app.html remains over budget: ${Buffer.byteLength(html)}`);
          console.log(`app.html bytes: ${Buffer.byteLength(html)}`);
          NODE
          node scripts/check-v4.9-performance-budget.cjs
      - name: Commit budget-safe HTML and remove temporary workflow
        run: |
          rm .github/workflows/visual-consistency-v4-budget-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html .github/workflows/visual-consistency-v4-budget-fix.yml
          git commit -m "perf: keep real app HTML within budget"
          git push origin HEAD:design/visual-consistency-v4-20260928
