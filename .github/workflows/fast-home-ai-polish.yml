name: Fast Home AI Polish
on:
  push:
    branches: [polish/home-ai-density-20260926]
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/home-ai-density-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply requested Home polish and align tests
        run: |
          python - <<'PY'
          from pathlib import Path

          app=Path('src/v4/app.js'); text=app.read_text()
          old='${topbar({actionHtml:`<button type="button" class="fm-next-icon-button" data-action="nav-profile" aria-label="내 정보">${icon(\'user\')}</button>`})}'
          if old in text: text=text.replace(old,'${topbar({})}',1)
          app.write_text(text)

          ai=Path('src/v5/ai-match-assistant.js'); text=ai.read_text()
          text=text.replace("setText(title,'AI에게 원하는 경기를 말해보세요.');","setText(title,'AI에게 원하는 경기를 검색해보세요.');",1)
          old_home="  const greeting=screen.querySelector('.fm-next-greeting');\n  text(greeting?.querySelector('small'),'AI MATCH ASSISTANT');\n  text(greeting?.querySelector('h1'),'오늘, 어떤 경기에서 뛸까요?');"
          if old_home in text: text=text.replace(old_home,"  const greeting=screen.querySelector('.fm-next-greeting');\n  greeting?.remove();",1)
          ai.write_text(text)

          css=Path('src/v5/ai-match-assistant.css'); text=css.read_text(); marker='/* home-ai-density-20260926 */'
          if marker not in text:
              text += '\n'+marker+'\n.fm-next-page[data-mode="real"] [data-screen="home"] .fm-ai-conditions{display:flex;flex-wrap:nowrap;gap:4px;overflow:hidden}\n.fm-next-page[data-mode="real"] [data-screen="home"] .fm-ai-conditions span{flex:0 0 auto;white-space:nowrap;padding:5px 6px;font-size:9px;letter-spacing:-.02em}\n'
          css.write_text(text)

          for test in Path('tests/e2e').glob('*.cjs'):
              t=test.read_text()
              t=t.replace("await expect(screen.locator('.fm-next-greeting h1')).toHaveText('오늘, 어떤 경기에서 뛸까요?');","await expect(screen.locator('.fm-next-greeting')).toHaveCount(0);")
              t=t.replace("AI에게 원하는 경기를 말해보세요.","AI에게 원하는 경기를 검색해보세요.")
              test.write_text(t)
          PY
      - name: Install browser QA
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
          npx playwright install --with-deps chromium webkit
      - name: Refresh affected approved Home baselines
        run: |
          npx playwright test --project=chromium tests/e2e/product-completion.spec.cjs -g "Home" --update-snapshots || true
          npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs -g "Home|Welcome/Home/Discover" --update-snapshots || true
          npx playwright test --project=chromium tests/e2e/v5.1-visual-system-completion.spec.cjs -g "Home|home" --update-snapshots || true
          npx playwright test --project=chromium tests/e2e/v5.1-visual-baseline.spec.cjs -g "AI|ai" --update-snapshots || true
      - name: Commit source test and baseline updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v4/app.js src/v5/ai-match-assistant.js src/v5/ai-match-assistant.css tests/e2e/*.cjs tests/e2e/*-snapshots || true
          if ! git diff --cached --quiet; then
            git commit -m "test: align Home AI polish expectations"
            git push origin HEAD:polish/home-ai-density-20260926
          fi
      - name: Regression contracts
        run: |
          node scripts/check-release-version.cjs
          node scripts/check-qa-toolchain.cjs
          node scripts/check-v4.9-boundary.cjs
          node scripts/check-v5.1-boundary.cjs
          node tests/contracts/v5.1-ai-assistant.contract.cjs
          node tests/contracts/v5.2-product-completion.contract.mjs
      - name: Browser E2E + axe + visual comparison
        run: |
          npx playwright test --project=chromium tests/e2e/v5.1-core.spec.cjs
          npx playwright test --project=chromium tests/e2e/product-completion.spec.cjs -g "Home"
          npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs -g "Home|Welcome/Home/Discover"
          npx playwright test --project=chromium tests/e2e/v5.1-visual-system-completion.spec.cjs -g "Home|home"
          npx playwright test --project=chromium tests/e2e/v5.1-visual-baseline.spec.cjs -g "AI|ai"
      - name: Mobile Safari WebKit
        run: npx playwright test --project=webkit-mobile tests/e2e/v5.2-webkit-mobile.spec.cjs
