name: Refresh Welcome Baselines Temp
on:
  push:
    branches:
      - fix/welcome-position-source-of-truth-20260925
permissions:
  contents: write
jobs:
  refresh:
    if: "${{ github.event.head_commit.message == 'ci: refresh approved welcome baselines' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/welcome-position-source-of-truth-20260925
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate only approved welcome baselines
        run: |
          npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs --grep '390px Welcome|390px personalized Welcome' --update-snapshots
          npx playwright test --project=chromium tests/e2e/v5.1-release-flow-review.spec.cjs --grep 'welcome hero keeps readable contrast' --update-snapshots
      - name: Verify generated baselines by real comparison
        run: |
          npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs --grep '390px Welcome|390px personalized Welcome'
          npx playwright test --project=chromium tests/e2e/v5.1-release-flow-review.spec.cjs --grep 'welcome hero keeps readable contrast'
      - name: Guard changed files
        run: |
          git status --short
          python - <<'PY'
          import subprocess
          expected={
            'tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-welcome-390-chromium-linux.png',
            'tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-personalized-welcome-390-chromium-linux.png',
            'tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-390-chromium-linux.png',
            'tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-1440-chromium-linux.png',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          if changed != expected:
            raise SystemExit(f'Unexpected baseline change set: {sorted(changed)}')
          print('PASS exact approved baseline change set')
          PY
      - name: Commit generated baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-welcome-390-chromium-linux.png
          git add tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-personalized-welcome-390-chromium-linux.png
          git add tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-390-chromium-linux.png
          git add tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-1440-chromium-linux.png
          git commit -m 'test: refresh approved welcome baselines'
          git push origin HEAD:fix/welcome-position-source-of-truth-20260925
