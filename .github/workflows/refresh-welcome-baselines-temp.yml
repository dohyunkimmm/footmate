name: Refresh Welcome Baselines Temp

on:
  push:
    branches:
      - fix/welcome-brand-actual-offset-20260926

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'test: refresh welcome baselines') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/welcome-brand-actual-offset-20260926
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh affected Welcome baselines
        run: |
          npx playwright test tests/e2e/real-app-white-surface.spec.cjs --grep "Welcome" --update-snapshots
          npx playwright test tests/e2e/v5.1-release-flow-review.spec.cjs --grep "welcome hero" --update-snapshots
      - name: Verify refreshed baselines by real comparison
        run: |
          npx playwright test tests/e2e/real-app-white-surface.spec.cjs --grep "Welcome"
          npx playwright test tests/e2e/v5.1-release-flow-review.spec.cjs --grep "welcome hero"
      - name: Guard changed snapshot scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No baselines changed; expected a visible Welcome geometry change." >&2
            exit 1
          fi
          for file in "${changed[@]}"; do
            case "$file" in
              tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-welcome-390-chromium-linux.png|\
              tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-personalized-welcome-390-chromium-linux.png|\
              tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-390-chromium-linux.png|\
              tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-1440-chromium-linux.png)
                ;;
              *)
                echo "Unexpected baseline change: $file" >&2
                exit 1
                ;;
            esac
          done
          printf 'Approved changed baselines:\n%s\n' "${changed[*]}"
      - name: Commit refreshed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-welcome-390-chromium-linux.png \
            tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-personalized-welcome-390-chromium-linux.png \
            tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-390-chromium-linux.png \
            tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-1440-chromium-linux.png
          git commit -m "test: refresh welcome baselines"
          git push origin HEAD:fix/welcome-brand-actual-offset-20260926
