name: Real App Native Density Snapshot Refresh

on:
  push:
    branches:
      - fix/real-app-native-density

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/real-app-native-density
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")" css-tree@3.1.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh approved Real App visual baselines
        run: |
          npx playwright test tests/e2e/real-app-white-surface.spec.cjs tests/e2e/product-completion.spec.cjs tests/e2e/real-app-visual-finish.spec.cjs tests/e2e/v5.1-design-system-v2.spec.cjs tests/e2e/v5.1-release-flow-review.spec.cjs tests/e2e/v5.1-visual-baseline.spec.cjs tests/e2e/v5.1-visual-system-completion.spec.cjs --update-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e
          if ! git diff --cached --quiet; then
            git commit -m "test: refresh Real App native density baselines"
            git push origin HEAD:fix/real-app-native-density
          fi
