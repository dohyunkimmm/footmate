name: Temporary MY Baseline Regeneration
on:
  push:
    branches: [fix/my-one-line-copy-v3]
permissions:
  contents: write
jobs:
  regenerate:
    if: contains(github.event.head_commit.message, '[regen-my-baseline]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/my-one-line-copy-v3
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Regenerate only MY affected baselines
        run: |
          npx playwright test tests/e2e/my-fresh-profile-containment.spec.cjs --project=chromium -g "fresh MY guidance stays inside its card" --update-snapshots
          npx playwright test tests/e2e/v4-personalization.spec.cjs --project=chromium -g "fresh Real App MY|Real App MY aligns" --update-snapshots
          npx playwright test tests/e2e/v5.1-design-system-v2.spec.cjs --project=chromium -g "Profile personalization" --update-snapshots
          npx playwright test tests/e2e/v5.1-visual-system-completion.spec.cjs --project=chromium -g "Schedule empty and Profile" --update-snapshots
      - name: Commit regenerated MY baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/e2e/my-fresh-profile-containment.spec.cjs-snapshots/my-fresh-profile-390-chromium-linux.png \
            tests/e2e/v4-personalization.spec.cjs-snapshots/real-app-my-fresh-profile-390-chromium-linux.png \
            tests/e2e/v4-personalization.spec.cjs-snapshots/real-app-my-personalization-390-chromium-linux.png \
            tests/e2e/v5.1-design-system-v2.spec.cjs-snapshots/design-system-v2-personalization-1440-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-profile-1440-chromium-linux.png
          if git diff --cached --quiet; then
            echo "No baseline changes"
          else
            git commit -m "test: refresh MY visual baselines"
            git push origin HEAD:fix/my-one-line-copy-v3
          fi