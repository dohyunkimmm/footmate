name: Scope Real App setup patch
on:
  push:
    branches: [fix/real-app-unselected-setup]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/real-app-unselected-setup
      - name: Scope fresh unselected state to Real App
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/v4/app.js')
          text=path.read_text()
          old="if(action==='start-setup'){setState(state.setupComplete?{route:'setup',setupStep:0}:{route:'setup',setupStep:0,region:'',position:'',level:''});return;}"
          new="if(action==='start-setup'){const freshReal=mode==='real'&&!state.setupComplete;setState(freshReal?{route:'setup',setupStep:0,region:'',position:'',level:''}:{route:'setup',setupStep:0});return;}"
          if old not in text: raise SystemExit('start-setup target missing')
          path.write_text(text.replace(old,new,1))
          PY
          node --check src/v4/app.js
          git diff --check
      - name: Commit and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/scope-real-app-setup.yml
          git add src/v4/app.js
          git commit -m "fix: scope unselected setup to Real App"
          git push origin HEAD:fix/real-app-unselected-setup
