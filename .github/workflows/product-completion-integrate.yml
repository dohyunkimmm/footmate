name: Product Completion Asset Integration
on:
  push:
    branches: [ui/product-polish-100]
    paths:
      - .github/workflows/product-completion-integrate.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fold completion layer into existing v5 assets
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const cssSource='src/v5/product-completion.css';
          const jsSource='src/v5/product-completion.js';
          const cssTarget='src/v5/ai-match-assistant.css';
          const jsTarget='src/v5/ai-match-assistant.js';
          const cssMarker='/* FootMate Real App · product completion layer';
          const jsMarker="const root=document.getElementById('footmate-next');\nif(root){\n  let scheduled=false;\n  const setText=";
          const css=fs.readFileSync(cssSource,'utf8');
          const js=fs.readFileSync(jsSource,'utf8');
          let targetCss=fs.readFileSync(cssTarget,'utf8');
          let targetJs=fs.readFileSync(jsTarget,'utf8');
          if(!targetCss.includes(cssMarker))targetCss+=`\n\n${css}`;
          if(!targetJs.includes(jsMarker))targetJs+=`\n\n/* Product completion orchestration */\n${js}`;
          fs.writeFileSync(cssTarget,targetCss);
          fs.writeFileSync(jsTarget,targetJs);

          let html=fs.readFileSync('app.html','utf8');
          html=html.replace('<link rel="stylesheet" href="/src/v5/product-completion.css?v=1">','');
          html=html.replace('<script type="module" src="/src/v5/product-completion.js?v=1"></script>','');
          fs.writeFileSync('app.html',html);

          const qaPath='.github/workflows/real-app-white-surface-qa.yml';
          let qa=fs.readFileSync(qaPath,'utf8');
          qa=qa.replaceAll('      - src/v5/product-completion.css\n','      - src/v5/ai-match-assistant.css\n');
          qa=qa.replaceAll('      - src/v5/product-completion.js\n','      - src/v5/ai-match-assistant.js\n');
          qa=qa.replace("          csstree.parse(fs.readFileSync('src/v5/product-completion.css','utf8'));","          csstree.parse(fs.readFileSync('src/v5/ai-match-assistant.css','utf8'));" );
          qa=qa.replace('        run: node --check src/v5/product-completion.js','        run: node --check src/v5/ai-match-assistant.js');
          fs.writeFileSync(qaPath,qa);

          const refreshPath='.github/workflows/product-completion-baseline-refresh.yml';
          let refresh=fs.readFileSync(refreshPath,'utf8');
          refresh=refresh.replace('      - src/v5/product-completion.css\n','      - src/v5/ai-match-assistant.css\n');
          refresh=refresh.replace('      - src/v5/product-completion.js\n','      - src/v5/ai-match-assistant.js\n');
          refresh=refresh.replace('          node --check src/v5/product-completion.js','          node --check src/v5/ai-match-assistant.js');
          refresh=refresh.replace("          csstree.parse(fs.readFileSync('src/v5/product-completion.css','utf8'));","          csstree.parse(fs.readFileSync('src/v5/ai-match-assistant.css','utf8'));" );
          fs.writeFileSync(refreshPath,refresh);

          fs.rmSync(cssSource);
          fs.rmSync(jsSource);
          NODE
      - name: Verify asset request budget shape
        run: |
          node --check src/v5/ai-match-assistant.js
          node scripts/check-v4.9-performance-budget.cjs
      - name: Commit integrated assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: integrate product completion without new requests'
          git push origin HEAD:ui/product-polish-100
