name: Runtime Release Test Sync
on:
  push:
    branches: [chore/product-hardening-11-20]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/product-hardening-11-20
          fetch-depth: 0
      - name: Align current Product E2E runtime release assertions
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=[
            'tests/e2e/v5.1-product-integrity.spec.cjs',
            'tests/e2e/v5.1-decision-flow-polish.spec.cjs',
            'tests/e2e/v5.1-visual-baseline.spec.cjs',
            'tests/e2e/v5.1-visual-system-completion.spec.cjs',
            'tests/e2e/v5.1-design-system-v2.spec.cjs',
            'tests/e2e/v5.1-release-flow-review.spec.cjs',
            'tests/e2e/real-app-white-surface.spec.cjs'
          ];
          for(const file of files){
            if(!fs.existsSync(file))continue;
            let value=fs.readFileSync(file,'utf8');
            value=value.replaceAll('5.1.1','5.2.0');
            value=value.replaceAll('footmate:v5.2:ai','footmate:v5.1:ai');
            fs.writeFileSync(file,value);
          }
          NODE
          git diff --check
      - name: Commit Product E2E sync
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: align Product E2E runtime release"
          git push origin HEAD:chore/product-hardening-11-20
