name: Product Completion Baseline Refresh
on:
  push:
    branches: [ui/product-polish-100]
    paths:
      - app.html
      - src/v5/product-completion.css
      - src/v5/product-completion.js
      - tests/e2e/product-completion.spec.cjs
      - .github/workflows/product-completion-baseline-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: npm install --no-save @playwright/test@1.55.1 css-tree@3.1.0
      - name: Validate completion source syntax
        run: |
          node --check src/v5/product-completion.js
          node - <<'NODE'
          const fs=require('fs');
          const csstree=require('css-tree');
          csstree.parse(fs.readFileSync('src/v5/product-completion.css','utf8'));
          console.log('PASS product completion CSS syntax');
          NODE
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh affected Product visual baselines
        run: npx playwright test tests/e2e/real-app-white-surface.spec.cjs tests/e2e/product-completion.spec.cjs tests/e2e/v5.1-visual-system-completion.spec.cjs tests/e2e/v5.1-release-flow-review.spec.cjs --update-snapshots
      - name: Commit refreshed baselines
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/*-snapshots
          if git diff --cached --quiet; then
            echo 'No baseline changes to commit.'
          else
            git commit -m 'test: refresh product completion visual baselines'
            git push origin HEAD:ui/product-polish-100
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: product-completion-baseline-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
