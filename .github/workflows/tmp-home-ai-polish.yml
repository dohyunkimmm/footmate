name: Temporary Home AI Polish
on:
  push:
    branches: [polish/home-ai-search-density-20260926]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/home-ai-search-density-20260926
          fetch-depth: 0
      - name: Apply requested Home polish
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/v5/ai-match-assistant.js')
          s=p.read_text()
          s=s.replace("setText(title,'AI에게 원하는 경기를 말해보세요.');","setText(title,'AI에게 원하는 경기를 검색해보세요.');")
          old="""  const greeting=screen.querySelector('.fm-next-greeting');
  text(greeting?.querySelector('small'),'AI MATCH ASSISTANT');
  text(greeting?.querySelector('h1'),'오늘, 어떤 경기에서 뛸까요?');
  const assistant=screen.querySelector('.fm-ai-card[data-product-ai=\"home\"],.fm-ai-card[data-ai-assistant]');
"""
          new="""  const greeting=screen.querySelector('.fm-next-greeting');
  if(greeting){greeting.hidden=true;greeting.style.display='none'}
  const topProfileAction=screen.querySelector('.fm-next-topbar [data-action=\"nav-profile\"]');
  topProfileAction?.remove();
  const assistant=screen.querySelector('.fm-ai-card[data-product-ai=\"home\"],.fm-ai-card[data-ai-assistant]');
"""
          if old not in s:
              raise SystemExit('configureHome target not found')
          s=s.replace(old,new)
          old2="""    assistant.querySelector('.fm-ai-examples')?.setAttribute('aria-label','바로 실행할 AI 경기 검색 예시');
    observeHome(assistant);
"""
          new2="""    assistant.querySelector('.fm-ai-examples')?.setAttribute('aria-label','바로 실행할 AI 경기 검색 예시');
    const conditions=assistant.querySelector('[data-ai-conditions]');
    if(conditions){
      conditions.style.display='flex';
      conditions.style.flexWrap='nowrap';
      conditions.style.gap='4px';
      conditions.style.alignItems='center';
      conditions.style.overflow='hidden';
      conditions.style.whiteSpace='nowrap';
      conditions.querySelectorAll('span').forEach(chip=>{
        chip.style.flex='0 0 auto';
        chip.style.padding='5px 6px';
        chip.style.fontSize='10px';
        chip.style.letterSpacing='-.04em';
        chip.style.whiteSpace='nowrap';
      });
    }
    observeHome(assistant);
"""
          if old2 not in s:
              raise SystemExit('conditions target not found')
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
      - name: Remove temporary workflow from final branch state
        run: rm .github/workflows/tmp-home-ai-polish.yml
      - name: Commit requested UI change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/v5/ai-match-assistant.js .github/workflows/tmp-home-ai-polish.yml
          git commit -m "polish: simplify Home AI search hierarchy"
          git push origin HEAD:polish/home-ai-search-density-20260926
