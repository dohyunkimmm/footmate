name: Refresh AI Result Baseline Once

on:
  push:
    branches:
      - fix/ai-result-render-jank

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ai-result-render-jank
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION" css-tree@3.1.0
      - name: Refresh connected AI snapshot
        run: npx playwright test --project=chromium tests/e2e/v5.1-ai-assistant.spec.cjs -g "saved connected result normalizes legacy values" --update-snapshots
      - name: Commit snapshot and remove one-shot workflow
        run: |
          SNAPSHOT="tests/e2e/v5.1-ai-assistant.spec.cjs-snapshots/ai-connected-stable-390-chromium-linux.png"
          test -f "$SNAPSHOT"
          rm .github/workflows/refresh-ai-result-baseline-once.yml
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SNAPSHOT" .github/workflows/refresh-ai-result-baseline-once.yml
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "test: add stable connected AI visual baseline"
          git push origin HEAD:fix/ai-result-render-jank
