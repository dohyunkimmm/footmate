name: Generate Affected MY Fresh Baselines
on:
  push:
    branches: [fix/my-fresh-profile-containment-20260926]
permissions:
  contents: write
jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[my-existing-baselines]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/my-fresh-profile-containment-20260926
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Playwright
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Regenerate only affected fresh MY baselines
        run: |
          npx playwright test tests/e2e/v5.1-design-system-v2.spec.cjs --project=chromium --grep "1440px Profile personalization" --update-snapshots
          npx playwright test tests/e2e/v5.1-visual-system-completion.spec.cjs --project=chromium --grep "1440px Schedule empty and Profile" --update-snapshots
      - name: Commit only affected profile snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-design-system-v2.spec.cjs-snapshots/design-system-v2-personalization-1440-chromium-linux.png
          git add tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-profile-1440-chromium-linux.png
          if git diff --cached --quiet; then
            echo "No affected profile baseline changes"
            exit 0
          fi
          git commit -m "test: refresh affected MY fresh baselines [my-existing-baselines]"
          git push
