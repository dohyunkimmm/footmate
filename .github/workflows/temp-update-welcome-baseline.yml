name: Temp Update Welcome Baseline

on:
  push:
    branches:
      - fix/real-app-welcome-alignment-cta-height
    paths:
      - .github/workflows/temp-update-welcome-baseline.yml
      - src/v4/discovery.css

permissions:
  contents: write

jobs:
  update-welcome-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/real-app-welcome-alignment-cta-height
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install visual QA toolchain
        shell: bash
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
          npx playwright install --with-deps chromium
      - name: Update approved welcome snapshots
        shell: bash
        run: npx playwright test --project=chromium tests/e2e/v5.1-release-flow-review.spec.cjs --grep "welcome hero keeps readable contrast and an approved full-surface baseline" --update-snapshots
      - name: Verify updated welcome snapshots
        shell: bash
        run: npx playwright test --project=chromium tests/e2e/v5.1-release-flow-review.spec.cjs --grep "welcome hero keeps readable contrast and an approved full-surface baseline"
      - name: Commit approved baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-390-chromium-linux.png
          git add tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-1440-chromium-linux.png
          if git diff --cached --quiet; then
            echo "No baseline changes to commit"
            exit 0
          fi
          git commit -m "test: update welcome visual baseline"
          git push origin HEAD:fix/real-app-welcome-alignment-cta-height
