name: Fix Home Test Expectations
on:
  push:
    branches: [polish/home-ai-density-20260926]
permissions:
  contents: write
jobs:
  fix-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/home-ai-density-20260926
          fetch-depth: 0
      - name: Align tests with requested Home UI
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]
          for test in Path('tests/e2e').glob('*.cjs'):
              t=test.read_text()
              n=t.replace("await expect(screen.locator('.fm-next-greeting h1')).toHaveText('오늘, 어떤 경기에서 뛸까요?');","await expect(screen.locator('.fm-next-greeting')).toHaveCount(0);")
              n=n.replace("AI에게 원하는 경기를 말해보세요.","AI에게 원하는 경기를 검색해보세요.")
              if n!=t:
                  test.write_text(n); changed.append(str(test))
          print('\n'.join(changed))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/*.cjs
          if ! git diff --cached --quiet; then
            git commit -m "test: align Home polish expectations"
            git push origin HEAD:polish/home-ai-density-20260926
          fi
