name: FootMate QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/real-app-unselected-setup]
permissions:
  contents: write
  statuses: read
concurrency:
  group: footmate-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    name: Change Impact
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.impact.outputs.runtime }}
      production: ${{ steps.impact.outputs.production }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Determine runtime and production impact
        id: impact
        env:
          EVENT_NAME: "${{ github.event_name }}"
          PR_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          PR_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
          PUSH_BEFORE_SHA: "${{ github.event.before }}"
          PUSH_HEAD_SHA: "${{ github.sha }}"
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_HEAD_SHA"
          fi

          changed_files="$(git diff --name-only "$base" "$head")"
          runtime=false
          for file in $changed_files; do
            case "$file" in
              README.md|docs/*|.github/*|*.md) ;;
              *) runtime=true ;;
            esac
          done

          production=true
          if FOOTMATE_VERCEL_CHANGED_FILES="$changed_files" node scripts/vercel-ignore-build.cjs; then
            production=false
          fi

          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "production=$production" >> "$GITHUB_OUTPUT"

  docs_only:
    name: Docs-only QA
    needs: impact
    if: needs.impact.outputs.runtime == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Check docs diff integrity
        env:
          EVENT_NAME: "${{ github.event_name }}"
          PR_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          PR_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
          PUSH_BEFORE_SHA: "${{ github.event.before }}"
          PUSH_HEAD_SHA: "${{ github.sha }}"
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_HEAD_SHA"
          fi
          git diff --check "$base" "$head"
      - name: Run documentation-facing connected platform contract
        run: node tests/contracts/v5.1-connected-platform.contract.mjs

  regression:
    name: Regression 36
    needs: impact
    if: needs.impact.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Check global release identity
        run: node scripts/check-release-version.cjs
      - name: Check QA toolchain contract
        run: node scripts/check-qa-toolchain.cjs
      - name: Check v4.9 compatibility boundary
        run: node scripts/check-v4.9-boundary.cjs
      - name: Check v5.1.1 AI Match Assistant boundary
        run: node scripts/check-v5.1-boundary.cjs
      - name: Check current performance budget
        run: node scripts/check-v4.9-performance-budget.cjs
      - name: Run v4.8 platform regression contracts
        run: node tests/contracts/v4.8-platform.contract.mjs
      - name: Run v4.9 release candidate contracts
        run: node tests/contracts/v4.9-release-candidate.contract.mjs
      - name: Run v5.1.1 connected platform contracts
        run: node tests/contracts/v5.1-connected-platform.contract.mjs
      - name: Run beta backend foundation contracts
        run: node tests/contracts/beta-backend.contract.mjs
      - name: Run beta Must recovery contracts
        run: node tests/contracts/beta-must-recovery.contract.mjs
      - name: Run beta operation audit contracts
        run: node tests/contracts/beta-operation-audit.contract.mjs
      - name: Run beta Must privacy contracts
        run: node tests/contracts/beta-must-privacy.contract.mjs
      - name: Run beta Supabase hardening contracts
        run: node tests/contracts/beta-supabase-hardening.contract.mjs
      - name: Run beta operator console contracts
        run: node tests/contracts/beta-operator-console.contract.mjs
      - name: Run v5.1.1 AI assistant contracts
        run: node tests/contracts/v5.1-ai-assistant.contract.cjs
      - name: Run v5.2 real beta readiness contracts
        run: node tests/contracts/v5.2-real-beta-readiness.contract.mjs
      - name: Run v5.2 product completion contracts
        run: node tests/contracts/v5.2-product-completion.contract.mjs
      - name: Run beta transactional email contracts
        run: node tests/contracts/beta-transactional-email.contract.mjs
      - name: Run beta email reliability contracts
        run: node tests/contracts/beta-email-reliability.contract.mjs
      - name: Run beta free growth contracts
        run: node tests/contracts/beta-free-growth.contract.mjs
      - name: Run beta social auth and operator MFA contracts
        run: node tests/contracts/beta-auth-mfa.contract.mjs
      - name: Run beta web push and media contracts
        run: node tests/contracts/beta-push-media.contract.mjs

  browser_e2e:
    name: Browser E2E + axe
    needs: impact
    if: needs.impact.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Install browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION" css-tree@3.1.0
      - name: Verify pinned browser image
        run: node -e "if (require('./package.json').qaToolchain.playwright !== '1.55.1') throw new Error('Update the Playwright container with qaToolchain.playwright')"
      - name: Verify installed QA toolchain
        run: node scripts/check-qa-toolchain.cjs
      - name: Check Real App CSS ownership and syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const csstree=require('css-tree');
          const html=fs.readFileSync('app.html','utf8');
          const design=fs.readFileSync('src/v4/design-system-v2.css','utf8');
          if(html.includes('id="fm-real-app-white-tone"'))throw new Error('white-first CSS must not return to inline HTML ownership');
          if(!design.includes('White-first Real App surface ownership'))throw new Error('white-first design-system ownership marker missing');
          if(!design.includes('FootMate Real App Visual Finish · P0–P2'))throw new Error('Real App finish ownership marker missing');
          if(html.includes('/src/v4/real-app-visual-finish.css'))throw new Error('Real App finish must not add a standalone stylesheet request');
          if(!design.includes('Visual Consistency v4')||!design.includes('--fm-v4-consistency:1'))throw new Error('visual consistency ownership missing');
          csstree.parse(design);
          console.log('PASS Real App CSS syntax and consolidated ownership');
          NODE
      - name: Check product completion JS syntax
        run: node --check src/v5/ai-match-assistant.js && node --check src/v4/platform/presentation/real-app-card-polish.js && node --check src/v4/platform/presentation/p0-usability-trust.js && node --check src/v4/platform/presentation/p1-decision-clarity.js
      - name: Run browser, beta, AI, recovery, accessibility and visual gates
        run: npx playwright test --project=chromium tests/e2e/v5.1-core.spec.cjs tests/e2e/v5.1-product-integrity.spec.cjs tests/e2e/v5.1-decision-flow-polish.spec.cjs tests/e2e/v5.1-visual-baseline.spec.cjs tests/e2e/v5.1-visual-system-completion.spec.cjs tests/e2e/v5.1-design-system-v2.spec.cjs tests/e2e/v5.1-release-flow-review.spec.cjs tests/e2e/v5.1-beta.spec.cjs tests/e2e/v5.1-beta-operator.spec.cjs tests/e2e/v5.2-real-beta-readiness.spec.cjs tests/e2e/v5.2-beta-email-reliability.spec.cjs tests/e2e/v5.3-beta-free-growth.spec.cjs tests/e2e/v5.3-beta-auth-mfa.spec.cjs tests/e2e/v5.3-beta-push-media.spec.cjs tests/e2e/v5.1-ai-assistant.spec.cjs tests/e2e/v4-discovery.spec.cjs tests/e2e/priority-ux.spec.cjs tests/e2e/checkin-state.spec.cjs tests/e2e/v4-decision.spec.cjs tests/e2e/v4-participation.spec.cjs tests/e2e/v4-matchday.spec.cjs tests/e2e/v4-return.spec.cjs tests/e2e/v4-personalization.spec.cjs tests/e2e/v4-platform.spec.cjs tests/e2e/visual-p1-secondary-hierarchy.spec.cjs tests/e2e/real-app-white-surface.spec.cjs tests/e2e/visual-consistency-v4.spec.cjs tests/e2e/visual-p0-finish.spec.cjs tests/e2e/p0-usability-trust.spec.cjs tests/e2e/my-fresh-profile-containment.spec.cjs tests/e2e/welcome-position.spec.cjs tests/e2e/welcome-source-layout.spec.cjs tests/e2e/product-completion.spec.cjs tests/e2e/real-app-visual-finish.spec.cjs
      - name: Run Mobile Safari/WebKit product gate
        run: npx playwright test --project=webkit-mobile tests/e2e/v5.2-webkit-mobile.spec.cjs
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v5.3-browser-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  setup_baseline:
    name: Fresh Setup Baseline Validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/real-app-unselected-setup'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Install pinned browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Verify affected functional contracts
        run: npx playwright test --project=chromium tests/e2e/priority-ux.spec.cjs
      - name: Generate intended selected Setup baseline
        run: npx playwright test --project=chromium tests/e2e/visual-consistency-v4.spec.cjs --grep "Welcome and Setup" --update-snapshots
      - name: Compare selected Setup against updated baseline
        run: npx playwright test --project=chromium tests/e2e/visual-consistency-v4.spec.cjs --grep "Welcome and Setup"
      - name: Generate intended fresh Setup baseline
        run: npx playwright test --project=chromium tests/e2e/v5.1-visual-system-completion.spec.cjs --grep "390px Setup matches" --update-snapshots
      - name: Compare fresh Setup against updated baseline
        run: npx playwright test --project=chromium tests/e2e/v5.1-visual-system-completion.spec.cjs --grep "390px Setup matches"
      - name: Commit validated Setup baselines and restore QA workflow
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git show origin/main:.github/workflows/qa.yml > .github/workflows/qa.yml
          git add .github/workflows/qa.yml tests/e2e/visual-consistency-v4.spec.cjs-snapshots/visual-consistency-setup-390-chromium-linux.png tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-setup-390-chromium-linux.png
          git diff --cached --check
          git commit -m "test: approve explicit Real App setup baselines"
          git push origin HEAD:fix/real-app-unselected-setup

  production_smoke:
    name: Production Smoke
    needs: [impact, regression, browser_e2e]
    if: github.event_name == 'push' && needs.impact.outputs.production == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Wait for exact Vercel deployment
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          for attempt in $(seq 1 42); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" --jq '[.statuses[]|select(.context=="Vercel")][0].state // ""')"
            [ "$state" = success ] && exit 0
            if [ "$state" = failure ] || [ "$state" = error ]; then exit 1; fi
            sleep 10
          done
          exit 1
      - name: Run exact Production HTTP smoke
        env: {FOOTMATE_PRODUCTION_URL: https://footmate-black.vercel.app, FOOTMATE_STRICT_PRODUCTION: 'true'}
        run: node tests/production-v5.1-smoke.cjs
      - name: Run exact Production AI inference
        env: {FOOTMATE_PRODUCTION_URL: https://footmate-black.vercel.app, FOOTMATE_STRICT_PRODUCTION: 'true'}
        run: node tests/production-v5.1-ai.cjs
      - name: Install Production browser dependency
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run exact Production Chromium smoke
        env: {BASE_URL: https://footmate-black.vercel.app, PRODUCTION_SMOKE: '1', FOOTMATE_STRICT_PRODUCTION: 'true'}
        run: npx playwright test tests/e2e/v5.1-production.spec.cjs tests/e2e/v5.1-beta-production.spec.cjs tests/e2e/v5.2-beta-production.spec.cjs
      - name: Upload Production browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-browser-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
