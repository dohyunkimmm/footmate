name: FootMate QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  statuses: read
concurrency:
  group: footmate-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    name: Change Impact
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.impact.outputs.runtime }}
      production: ${{ steps.impact.outputs.production }}
      production_smoke: ${{ steps.impact.outputs.production_smoke }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v7
        with: {node-version: '24', package-manager-cache: false}
      - name: Determine runtime and production impact
        id: impact
        env:
          EVENT_NAME: "${{ github.event_name }}"
          PR_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          PR_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
          PUSH_BEFORE_SHA: "${{ github.event.before }}"
          PUSH_HEAD_SHA: "${{ github.sha }}"
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_HEAD_SHA"
          fi

          changed_files="$(git diff --name-only "$base" "$head")"
          FOOTMATE_CHANGED_FILES="$changed_files" node scripts/classify-cloudflare-impact.cjs >> "$GITHUB_OUTPUT"

  docs_only:
    name: Docs-only QA
    needs: impact
    if: needs.impact.outputs.runtime == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v7
        with: {node-version: '24', package-manager-cache: false}
      - name: Check docs diff integrity
        env:
          EVENT_NAME: "${{ github.event_name }}"
          PR_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          PR_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
          PUSH_BEFORE_SHA: "${{ github.event.before }}"
          PUSH_HEAD_SHA: "${{ github.sha }}"
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_HEAD_SHA"
          fi
          git diff --check "$base" "$head"
      - name: Run documentation-facing connected platform contract
        run: node tests/contracts/connected-platform.contract.mjs
      - name: Run release app contract for documentation integrity
        run: node tests/contracts/release-app.contract.mjs

  regression:
    name: Regression 36
    needs: impact
    if: needs.impact.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '24', package-manager-cache: false}
      - name: Validate npm lockfile against a clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check global release identity
        run: node scripts/check-release-version.cjs
      - name: Check QA toolchain contract
        run: node scripts/check-qa-toolchain.cjs
      - name: Check Cloudflare deploy impact classification
        run: node --test tests/contracts/cloudflare-deployment-impact.contract.cjs
      - name: Check Production smoke source contract
        run: node --test tests/contracts/production-smoke.contract.cjs
      - name: Check Case Study bundle and asset versions
        run: node scripts/sync-case-study-assets.cjs --check
      - name: Check app compatibility boundary
        run: node scripts/check-app-boundary.cjs
      - name: Check AI Match Assistant boundary
        run: node scripts/check-ai-boundary.cjs
      - name: Check current performance budget
        run: node scripts/check-app-performance-budget.cjs
      - name: Run platform regression contracts
        run: node tests/contracts/platform.contract.mjs
      - name: Check filtered discovery and non-repeating recommendations
        run: node tests/contracts/recommendation-discovery.contract.mjs
      - name: Check discovery personalization and consent isolation
        run: node tests/contracts/discovery-followup.contract.mjs
      - name: Check player-to-match suitability facts
        run: node tests/contracts/matching.contract.mjs
      - name: Run release candidate contracts
        run: node tests/contracts/release-candidate.contract.mjs
      - name: Run connected platform contracts
        run: node tests/contracts/connected-platform.contract.mjs
      - name: Run beta backend foundation contracts
        run: node tests/contracts/beta-backend.contract.mjs
      - name: Check preference sync and pilot-only KPI contract
        run: node tests/contracts/preference-sync-and-kpi.contract.mjs
      - name: Run beta Must recovery contracts
        run: node tests/contracts/beta-must-recovery.contract.mjs
      - name: Run beta operation audit contracts
        run: node tests/contracts/beta-operation-audit.contract.mjs
      - name: Run beta Must privacy contracts
        run: node tests/contracts/beta-must-privacy.contract.mjs
      - name: Run beta Supabase hardening contracts
        run: node tests/contracts/beta-supabase-hardening.contract.mjs
      - name: Run beta operator console contracts
        run: node tests/contracts/beta-operator-console.contract.mjs
      - name: Run AI assistant contracts
        run: node tests/contracts/ai-assistant.contract.cjs
      - name: Run beta readiness contracts
        run: node tests/contracts/beta-readiness.contract.mjs
      - name: Run product completion contracts
        run: node tests/contracts/product-completion.contract.mjs
      - name: Run release app contract
        run: node tests/contracts/release-app.contract.mjs
      - name: Run beta transactional email contracts
        run: node tests/contracts/beta-transactional-email.contract.mjs
      - name: Run beta email reliability contracts
        run: node tests/contracts/beta-email-reliability.contract.mjs
      - name: Run beta free growth contracts
        run: node tests/contracts/beta-free-growth.contract.mjs
      - name: Run beta social auth and operator MFA contracts
        run: node tests/contracts/beta-auth-mfa.contract.mjs
      - name: Run beta web push and media contracts
        run: node tests/contracts/beta-push-media.contract.mjs

  browser_e2e:
    name: Browser E2E + axe
    env:
      QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    needs: impact
    if: needs.impact.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '24', package-manager-cache: false}
      - name: Install browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION" css-tree@3.1.0
      - name: Verify pinned browser image
        run: node -e "if (require('./package.json').qaToolchain.playwright !== '1.55.1') throw new Error('Update the Playwright container with qaToolchain.playwright')"
      - name: Verify installed QA toolchain
        run: node scripts/check-qa-toolchain.cjs
      - name: Check Interactive Demo CSS ownership and syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const csstree=require('css-tree');
          const html=fs.readFileSync('app.html','utf8');
          const design=fs.readFileSync('src/app/design-system-v2.css','utf8');
          if(html.includes('id="fm-real-app-white-tone"'))throw new Error('white-first CSS must not return to inline HTML ownership');
          if(!design.includes('White-first Interactive Demo surface ownership'))throw new Error('white-first design-system ownership marker missing');
          if(!design.includes('FootMate Interactive Demo Visual Finish · P0–P2'))throw new Error('Interactive Demo finish ownership marker missing');
          if(html.includes('/src/app/real-app-visual-finish.css'))throw new Error('Interactive Demo finish must not add a standalone stylesheet request');
          if(!design.includes('Visual Consistency v4')||!design.includes('--fm-v4-consistency:1'))throw new Error('visual consistency ownership missing');
          csstree.parse(design);
          console.log('PASS Interactive Demo CSS syntax and consolidated ownership');
          NODE
      - name: Check product completion JS syntax
        run: node --check src/app/ai-match-assistant.js && node --check src/platform/presentation/real-app-card-polish.js && node --check src/platform/presentation/p0-usability-trust.js && node --check src/platform/presentation/p1-decision-clarity.js && node --check src/app/release-app.js
      - name: Check QA test paths, typography test syntax and report contract
        run: |
          node scripts/check-qa-test-paths.cjs
          node --check tests/e2e/helpers/typography-audit.cjs
          node --check tests/e2e/typography-real-app.spec.cjs
          node --check scripts/typography-qa-report.cjs
          node --test tests/contracts/typography-report.contract.cjs
          node --test tests/contracts/footmate-product-ux.contract.cjs
      - name: Verify changed choice-to-login journey before full screen QA
        run: npx playwright test --project=chromium tests/e2e/beta-core.spec.cjs --grep "choice-first recommendations keep|random discovery|quick filters|AI loading|refreshing recommendations|a refreshed full position|mobile match detail keeps selection|enhanced discovery|discovery followup|discovery hotfix|discovery qa"
      - name: Upload changed journey screen evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: choice-first-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Run Beta consent recovery on Mobile Safari
        run: npx playwright test --project=webkit-beta-consent --output=test-results/playwright-webkit-beta tests/e2e/beta-core.spec.cjs --grep "discovery followup sends real events|discovery hotfix preserves failed withdrawal|discovery qa"
      - name: Run 11-section Case Study navigation, responsive and accessibility gate
        run: npx playwright test --project=chromium tests/e2e/case-study-eleven-stages.spec.cjs
      - name: Preserve Case Study screen evidence before the next browser run
        if: always()
        run: |
          mkdir -p verification/case-study-qa
          if [ -d test-results ]; then cp -R test-results verification/case-study-qa/; fi
          if [ -d playwright-report ]; then cp -R playwright-report verification/case-study-qa/; fi
      - name: Run release browser, beta, AI, accessibility and visual gates
        run: npx playwright test --project=chromium tests/e2e/release-app.spec.cjs tests/e2e/beta-core.spec.cjs tests/e2e/beta-operator.spec.cjs tests/e2e/beta-readiness.spec.cjs tests/e2e/beta-email-reliability.spec.cjs tests/e2e/beta-free-growth.spec.cjs tests/e2e/beta-auth-mfa.spec.cjs tests/e2e/beta-push-media.spec.cjs tests/e2e/ai-assistant.spec.cjs tests/e2e/discovery.spec.cjs tests/e2e/decision.spec.cjs tests/e2e/platform.spec.cjs tests/e2e/visual-p1-secondary-hierarchy.spec.cjs tests/e2e/real-app-white-surface.spec.cjs tests/e2e/visual-p0-finish.spec.cjs tests/e2e/p0-usability-trust.spec.cjs tests/e2e/welcome-position.spec.cjs tests/e2e/welcome-source-layout.spec.cjs tests/e2e/desktop-auth-horizontal-lock.spec.cjs tests/e2e/typography-real-app.spec.cjs
      - name: Build typography QA JSON and Markdown evidence
        if: always()
        run: node scripts/typography-qa-report.cjs
      - name: Run Release App Mobile Safari/WebKit gate without clearing Chromium evidence
        run: npx playwright test --project=webkit-mobile --output=test-results/playwright-webkit tests/e2e/release-app.spec.cjs --grep "Release App mobile Detail, free Join and MY stay overflow-safe and accessible|Release App keeps Matchday operations inside MY|legacy Schedule state migrates into canonical MY ownership"
      - name: Recheck saved typography PNG integrity before artifact upload
        if: always()
        run: node scripts/typography-qa-report.cjs
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            verification/typography-qa-summary.json
            verification/typography-qa-summary.md
            verification/p1-desktop-qa/
            verification/case-study-qa/
          if-no-files-found: warn
          retention-days: 14


  deploy_cloudflare:
    name: Deploy Cloudflare
    needs: [impact, regression, browser_e2e, docs_only]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.impact.result == 'success' &&
      needs.impact.outputs.production == 'true' &&
      needs.regression.result == 'success' &&
      needs.browser_e2e.result == 'success' &&
      needs.docs_only.result == 'skipped'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Cloudflare assets
        run: npm run build:cloudflare

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
  production_smoke:
    name: Production Smoke
    needs: [impact, regression, browser_e2e, docs_only, deploy_cloudflare]
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.impact.outputs.production == 'false')) &&
      needs.impact.result == 'success' &&
      needs.impact.outputs.production_smoke == 'true' &&
      (needs.regression.result == 'success' ||
       needs.regression.result == 'skipped') &&
      (needs.browser_e2e.result == 'success' ||
       needs.browser_e2e.result == 'skipped') &&
      (needs.docs_only.result == 'success' ||
       needs.docs_only.result == 'skipped') &&
      (github.event_name != 'push' ||
       needs.impact.outputs.production != 'true' ||
       needs.deploy_cloudflare.result == 'success')

    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host

    env:
      FOOTMATE_PRODUCTION_URL: ${{ vars.FOOTMATE_CLOUDFLARE_URL }}
      BASE_URL: ${{ vars.FOOTMATE_CLOUDFLARE_URL }}
      FOOTMATE_STRICT_PRODUCTION: 'true'
      PRODUCTION_SMOKE: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check Cloudflare URL
        run: |
          if [ -z "$FOOTMATE_PRODUCTION_URL" ]; then
            echo "Missing FOOTMATE_CLOUDFLARE_URL"
            exit 1
          fi

      - name: Run Production HTTP smoke
        run: node tests/production-smoke.cjs

      - name: Run Production AI inference
        run: node tests/production-ai.cjs

      - name: Install Production browser dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"

      - name: Verify Production browser image
        run: |
          node -e "if (require('./package.json').qaToolchain.playwright !== '1.55.1') throw new Error('Update the Production Playwright image with qaToolchain.playwright')"
          node scripts/check-qa-toolchain.cjs

      - name: Run Production Chromium smoke
        run: |
          npx playwright test tests/e2e/production-app.spec.cjs tests/e2e/beta-production-core.spec.cjs tests/e2e/beta-production-readiness.spec.cjs

      - name: Run Production release journeys
        run: |
          npx playwright test --project=chromium tests/e2e/release-app.spec.cjs --grep "Release App free Join failure is recoverable without leaving a stuck button|Home lifecycle closes Return and hands the next action back to Discover|Release App mobile Detail, free Join and MY stay overflow-safe and accessible|Release App keeps Matchday operations inside MY|legacy Schedule state migrates into canonical MY ownership"

      - name: Upload Production browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-browser-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
