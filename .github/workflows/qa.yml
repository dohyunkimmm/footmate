name: FootMate QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  statuses: read

concurrency:
  group: footmate-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression 36
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run regression suite
        run: node --test tests/*.test.cjs

  browser-e2e:
    name: Browser E2E + axe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser QA dependencies
        run: npm install --no-save @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E, accessibility and responsive gates
        run: npx playwright test tests/e2e/footmate.spec.cjs tests/e2e/domain-engine.spec.cjs tests/e2e/case-study.spec.cjs tests/e2e/responsive.spec.cjs tests/e2e/visual-regression.spec.cjs
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  production-smoke:
    name: Production Smoke
    if: github.event_name == 'push'
    needs: [regression, browser-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Determine production impact
        id: impact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed_files="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.files[].filename')"
          echo "Changed files:"
          echo "$changed_files"
          if printf '%s\n' "$changed_files" | grep -Ev '^(tests/|docs/|README\.md$|\.github/|playwright\.config\.cjs$)' >/dev/null; then
            echo "deployment_required=true" >> "$GITHUB_OUTPUT"
            echo "Production-impacting files changed; exact-SHA deployment is required."
          else
            echo "deployment_required=false" >> "$GITHUB_OUTPUT"
            echo "QA/docs-only change; validate the current Production deployment."
          fi
      - name: Wait for Vercel deployment of this commit
        id: deployment
        if: steps.impact.outputs.deployment_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 36); do
            status_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")"
            state="$(printf '%s' "$status_json" | jq -r '[.statuses[] | select(.context=="Vercel")][0].state // ""')"
            description="$(printf '%s' "$status_json" | jq -r '[.statuses[] | select(.context=="Vercel")][0].description // ""')"
            echo "Vercel status: ${state:-pending} ${description}"
            if [ "$state" = "success" ]; then
              echo "deployment_pending=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              if printf '%s' "$description" | grep -qi 'rate limited'; then
                echo "deployment_pending=true" >> "$GITHUB_OUTPUT"
                echo "::warning::Vercel deployment is rate-limited; validating the last verified Production deployment in compatibility mode."
                exit 0
              fi
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for the Vercel status for ${GITHUB_SHA}."
          exit 1
      - name: Run production HTTP smoke
        env:
          FOOTMATE_PRODUCTION_URL: https://footmate-black.vercel.app
          FOOTMATE_STRICT_PRODUCTION: ${{ steps.impact.outputs.deployment_required == 'true' && steps.deployment.outputs.deployment_pending != 'true' }}
        run: node tests/production-smoke.cjs
      - name: Install production browser dependency
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production browser render smoke
        env:
          BASE_URL: https://footmate-black.vercel.app
          PRODUCTION_SMOKE: '1'
          FOOTMATE_STRICT_PRODUCTION: ${{ steps.impact.outputs.deployment_required == 'true' && steps.deployment.outputs.deployment_pending != 'true' }}
        run: npx playwright test tests/e2e/production.spec.cjs
      - name: Upload production QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-smoke-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
