name: Fix MY profile overflow

on:
  push:
    branches:
      - fix/my-profile-overflow-current-20260926

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[patch-my-overflow]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/my-profile-overflow-current-20260926
          fetch-depth: 0
      - name: Patch profile summary sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/v4/personalization.js')
          s=p.read_text()
          old='display:inline-flex;width:max-content;max-width:100%;min-height:32px'
          new='display:inline-flex;width:max-content;max-width:100%;box-sizing:border-box;min-height:32px'
          if old not in s:
              raise SystemExit('target style not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v4/personalization.js
          git commit -m "fix: contain MY profile summary pill"
          git push origin HEAD:fix/my-profile-overflow-current-20260926
