name: Temporary v6 completion baseline refresh
on:
  push:
    branches:
      - fix/v6-completion-polish
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'capture v6 visual refresh failure') && !contains(github.event.head_commit.message, 'refresh v6 completion visual baselines') }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check Release App contracts
        run: |
          node --check src/v6/release-app.js
          node tests/contracts/v6-release-app.contract.mjs
      - name: Install pinned browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Generate v6 Chromium baselines from the changed surfaces
        id: visual
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx playwright test --project=chromium tests/e2e/v6-release-app.spec.cjs --update-snapshots 2>&1 | tee v6-playwright-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Commit failure diagnostics
        if: steps.visual.outcome == 'failure'
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v6-playwright-output.txt
          git commit -m "chore: capture v6 visual refresh failure"
          git push origin HEAD:fix/v6-completion-polish
      - name: Commit generated baselines
        if: steps.visual.outcome == 'success'
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v6-release-app.spec.cjs-snapshots
          if git diff --cached --quiet; then
            echo "No baseline changes"
            exit 0
          fi
          git commit -m "test: refresh v6 completion visual baselines"
          git push origin HEAD:fix/v6-completion-polish
      - name: Fail when visual generation failed
        if: steps.visual.outcome == 'failure'
        run: exit 1
