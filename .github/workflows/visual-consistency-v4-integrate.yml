name: Visual Consistency V4 Integrate
on:
  push:
    branches: [design/visual-consistency-v4-20260928]
    paths:
      - .github/workflows/visual-consistency-v4-integrate.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/visual-consistency-v4-20260928
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Integrate runtime consistency rules
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const layer='src/v4/visual-consistency-v4.css';
          const design='src/v4/design-system-v2.css';
          let designCss=fs.readFileSync(design,'utf8');
          const layerCss=fs.readFileSync(layer,'utf8').trim();
          if(!designCss.includes('Visual Consistency v4'))designCss=`${designCss.trimEnd()}\n\n${layerCss}\n`;
          if(!designCss.includes('--fm-v4-consistency:1'))designCss=`${designCss.trimEnd()}\n.fm-next-page[data-mode="real"]{--fm-v4-consistency:1}\n`;
          fs.writeFileSync(design,designCss);

          let html=fs.readFileSync('app.html','utf8');
          html=html.replace(/<link rel="stylesheet" href="\/src\/v4\/visual-consistency-v4\.css(?:\?v=1)?">/g,'');
          fs.writeFileSync('app.html',html);

          let bootstrap=fs.readFileSync('src/v4/platform/presentation/bootstrap.js','utf8');
          bootstrap=bootstrap.replace("const compatibilityStyle=document.createElement('link');\ncompatibilityStyle.rel='stylesheet';\ncompatibilityStyle.href='/src/v4/visual-consistency-v4-compat.css?v=1';\ncompatibilityStyle.dataset.visualConsistencyV4Compat='true';\ndocument.head.appendChild(compatibilityStyle);\n\n",'');
          if(bootstrap.includes('visual-consistency-v4-compat'))throw new Error('compatibility loader remains');
          fs.writeFileSync('src/v4/platform/presentation/bootstrap.js',bootstrap);

          let spec=fs.readFileSync('tests/e2e/visual-consistency-v4.spec.cjs','utf8');
          spec=spec.replace("  await expect.poll(()=>page.evaluate(()=>[...document.styleSheets].some(sheet=>String(sheet.href||'').includes('/src/v4/visual-consistency-v4.css')))).toBe(true);", "  await expect.poll(()=>page.evaluate(()=>getComputedStyle(document.querySelector('.fm-next-page')).getPropertyValue('--fm-v4-consistency').trim())).toBe('1');");
          fs.writeFileSync('tests/e2e/visual-consistency-v4.spec.cjs',spec);
          NODE
          rm -f src/v4/visual-consistency-v4.css src/v4/visual-consistency-v4-compat.css
          npm install --no-save --ignore-scripts css-tree@3.1.0
          node - <<'NODE'
          const fs=require('fs'),csstree=require('css-tree');
          const css=fs.readFileSync('src/v4/design-system-v2.css','utf8');
          if(!css.includes('Visual Consistency v4')||!css.includes('--fm-v4-consistency:1'))throw new Error('integrated ownership missing');
          csstree.parse(css);
          console.log('PASS integrated design CSS syntax');
          NODE
          node scripts/check-v4.9-performance-budget.cjs
      - name: Commit runtime integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html src/v4/design-system-v2.css src/v4/platform/presentation/bootstrap.js tests/e2e/visual-consistency-v4.spec.cjs
          git add -u src/v4/visual-consistency-v4.css src/v4/visual-consistency-v4-compat.css
          git commit -m "perf: integrate visual consistency into existing design system"
          git push origin HEAD:design/visual-consistency-v4-20260928
