name: One-off FootMate Pretendard preview sync
on:
  push:
    branches:
      - fix/case-study-pretendard-tossface-20261108
    paths:
      - .github/workflows/oneoff-case-study-fonts.yml

permissions:
  contents: write

jobs:
  normalize-fonts:
    if: github.repository == 'dohyunkimmm/footmate'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace mixed-font names in main PPTX without touching its slide content
        run: |
          python3 - <<'PY'
          import io,re
          from pathlib import Path
          from zipfile import ZipFile
          path=Path('src/case-study/downloads/footmate_report.pptx')
          a=re.compile(rb'<a:t>(.*?)</a:t>',re.S)
          previous={}
          changes={}
          new=io.BytesIO()
          with ZipFile(path) as before, ZipFile(new,'w') as after:
              for info in before.infolist():
                  data=before.read(info.filename)
                  if info.filename.startswith('ppt/') and info.filename.endswith('.xml'):
                      previous[info.filename]=a.findall(data)
                      for old in (b'Do Hyeon',b'Aptos Display',b'Aptos'):
                          key=b'typeface="'+old+b'"'
                          count=data.count(key)
                          if count:
                              data=data.replace(key,b'typeface="Pretendard"')
                              changes[old.decode('utf-8')]=changes.get(old.decode('utf-8'),0)+count
                      assert a.findall(data)==previous[info.filename],info.filename
                  after.writestr(info,data)
          assert changes.get('Do Hyeon',0)>=100,changes
          path.write_bytes(new.getvalue())
          with ZipFile(path) as z:
              assert z.testzip() is None
              parts=[n for n in z.namelist() if re.fullmatch(r'ppt/slides/slide[0-9]+\.xml',n)]
              assert len(parts)==9,parts
              for n in parts:
                  xml=z.read(n)
                  assert b'typeface="Do Hyeon"' not in xml,n
                  assert b'typeface="Aptos"' not in xml,n
          print('PASS main PPTX 9 slides; edited only font-family attributes:',changes)
          PY
      - name: Install Pretendard for accurate slide image rendering
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/fonts/pretendard"
          for weight in Regular Medium SemiBold Bold ExtraBold; do
            curl -fLSs --retry 3 --retry-delay 2 "https://raw.githubusercontent.com/orioncactus/pretendard/main/packages/pretendard/dist/public/static/Pretendard-${weight}.otf" \
              -o "$HOME/.local/share/fonts/pretendard/Pretendard-${weight}.otf"
          done
          fc-cache -f "$HOME/.local/share/fonts/pretendard"
          fc-match Pretendard | grep -q 'Pretendard'
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-noto-cjk fonts-nanum
      - name: Render all 9 previews from the corrected PPTX
        run: |
          set -euo pipefail
          mkdir -p /tmp/footmate-main-fonts
          libreoffice -env:UserInstallation=file:///tmp/footmate-main-fonts-lo --headless --convert-to pdf --outdir /tmp/footmate-main-fonts src/case-study/downloads/footmate_report.pptx
          pdfinfo /tmp/footmate-main-fonts/footmate_report.pdf | grep -q '^Pages: *9'
          pdftoppm -png -f 1 -l 9 -scale-to-x 1281 -scale-to-y 720 /tmp/footmate-main-fonts/footmate_report.pdf /tmp/footmate-main-fonts/slide
          python3 - <<'PY'
          from pathlib import Path
          import base64,json,struct
          file=Path('src/case-study/report-previews.js')
          content=file.read_text(encoding='utf-8').strip()
          prefix='window.REPORT_SLIDES='
          assert content.startswith(prefix) and content.endswith(';')
          slides=json.loads(content[len(prefix):-1])
          assert len(slides)==9
          for i,slide in enumerate(slides,1):
              png=Path(f'/tmp/footmate-main-fonts/slide-{i}.png').read_bytes()
              assert png.startswith(bytes.fromhex('89504e470d0a1a0a')) and len(png)>10000,i
              assert struct.unpack('>II',png[16:24])==(1281,720),i
              slide['src']='data:image/png;base64,'+base64.b64encode(png).decode('ascii')
          file.write_text(prefix+json.dumps(slides,ensure_ascii=False,separators=(',',':'))+';\n',encoding='utf-8')
          print('PASS: updated all 9 main previews with Pretendard-rendered PPTX images')
          PY
      - name: Commit matched source deck and preview image bundle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/case-study/downloads/footmate_report.pptx src/case-study/report-previews.js
          git diff --cached --quiet && { echo 'No font changes found'; exit 1; }
          git commit -m "style: unify main presentation on Pretendard and sync all nine previews"
          git push origin HEAD:refs/heads/fix/case-study-pretendard-tossface-20261108
