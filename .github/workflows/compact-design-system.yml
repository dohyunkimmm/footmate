name: Compact Final Design System

on:
  push:
    branches:
      - design/visual-hierarchy-v3-20260927
    paths:
      - .github/workflows/compact-design-system.yml

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/visual-hierarchy-v3-20260927
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prune superseded rules and compact only what the existing budget requires
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          npm install --no-save --ignore-scripts csso@5.0.5 css-tree@3.1.0
          node <<'NODE'
          const fs=require('fs');
          const csso=require('csso');
          const csstree=require('css-tree');

          const polishPath='src/v4/visual-polish.css';
          let polish=fs.readFileSync(polishPath,'utf8');
          const contextStart=polish.indexOf('.fm-next-page[data-mode="real"] .fm-next-context-card{');
          const aiStart=polish.indexOf('.fm-next-page[data-mode="real"] .fm-ai-card{',contextStart);
          if(contextStart<0||aiStart<0) throw new Error('Expected legacy Home visual block not found');
          const preserveUpcoming='.fm-next-page[data-mode="real"] .fm-next-upcoming-actions .fm-next-button--secondary:hover{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.29)}\n\n';
          polish=polish.slice(0,contextStart)+preserveUpcoming+polish.slice(aiStart);
          fs.writeFileSync(polishPath,polish);

          const dsPath='src/v4/design-system-v2.css';
          let ds=fs.readFileSync(dsPath,'utf8');
          const preserveMarker='/* Preserve inherited values after removing superseded visual-polish Home rules. */';
          if(!ds.includes(preserveMarker)){
            ds += `\n${preserveMarker}\n`+
              '.fm-next-page[data-mode="real"] .fm-next-app:not([data-embed="true"]) [data-screen="home"] .fm-next-context-kicker{margin-bottom:10px}\n'+
              '.fm-next-page[data-mode="real"] .fm-next-app:not([data-embed="true"]) [data-screen="home"] .fm-next-context-card h2{line-height:1.3}\n'+
              '.fm-next-page[data-mode="real"] .fm-next-app:not([data-embed="true"]) :is([data-screen="home"],[data-screen="discover"]) .fm-next-match-card-media:before{background-size:38px 38px}\n'+
              '.fm-next-page[data-mode="real"] .fm-next-app:not([data-embed="true"]) .fm-next-fit-badge{padding:7px 10px}\n';
          }
          fs.writeFileSync(dsPath,ds);

          const app=fs.readFileSync('app.html','utf8');
          const cssPaths=[...new Set([...app.matchAll(/href="(\/src\/(?:v4|v5)\/[^"?]+\.css)\?v=\d+"/g)].map(m=>m[1]))];
          const budget=180000;
          const rows=cssPaths.map(webPath=>{
            const path='.'+webPath;
            const source=fs.readFileSync(path,'utf8');
            csstree.parse(source);
            const compact=csso.minify(source,{restructure:true}).css+'\n';
            csstree.parse(compact);
            return {webPath,path,source,compact,before:Buffer.byteLength(source),after:Buffer.byteLength(compact),saving:Buffer.byteLength(source)-Buffer.byteLength(compact)};
          });
          const originalTotal=rows.reduce((sum,row)=>sum+row.before,0);
          let total=originalTotal;
          const selected=[];
          for(const row of rows.filter(r=>r.saving>0).sort((a,b)=>b.saving-a.saving)){
            if(total<=budget) break;
            selected.push(row);
            total-=row.saving;
          }
          console.log(JSON.stringify({originalTotal,budget,selected:selected.map(r=>({path:r.webPath,before:r.before,after:r.after,saving:r.saving})),finalTotal:total}));
          if(total>budget) throw new Error(`CSS compaction remains over budget: ${total} > ${budget}`);
          for(const row of selected) fs.writeFileSync(row.path,row.compact);
          NODE
          node scripts/check-v4.9-performance-budget.cjs
          rm .github/workflows/compact-design-system.yml
          git add -A
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'perf: prune superseded visual rules within budget'
          git push origin HEAD:design/visual-hierarchy-v3-20260927
