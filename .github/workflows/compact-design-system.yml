name: Compact Final Design System

on:
  push:
    branches:
      - design/visual-hierarchy-v3-20260927
    paths:
      - .github/workflows/compact-design-system.yml

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/visual-hierarchy-v3-20260927
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compact only the loaded CSS needed to meet the existing budget
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          npm install --no-save --ignore-scripts csso@5.0.5 css-tree@3.1.0
          node <<'NODE'
          const fs=require('fs');
          const csso=require('csso');
          const csstree=require('css-tree');
          const app=fs.readFileSync('app.html','utf8');
          const cssPaths=[...new Set([...app.matchAll(/href="(\/src\/(?:v4|v5)\/[^"?]+\.css)\?v=\d+"/g)].map(m=>m[1]))];
          const budget=180000;
          const rows=cssPaths.map(webPath=>{
            const path='.'+webPath;
            const source=fs.readFileSync(path,'utf8');
            csstree.parse(source);
            const compact=csso.minify(source,{restructure:false}).css+'\n';
            csstree.parse(compact);
            return {webPath,path,source,compact,before:Buffer.byteLength(source),after:Buffer.byteLength(compact),saving:Buffer.byteLength(source)-Buffer.byteLength(compact)};
          });
          const originalTotal=rows.reduce((sum,row)=>sum+row.before,0);
          let total=originalTotal;
          const selected=[];
          // The changed hierarchy layers are compacted first. Additional loaded files are chosen only as needed by measured saving.
          for(const preferred of ['/src/v4/design-system-v2.css','/src/v4/visual-polish.css']){
            const row=rows.find(r=>r.webPath===preferred);
            if(row && row.saving>0){selected.push(row);total-=row.saving;}
          }
          const remaining=rows.filter(r=>!selected.includes(r)).sort((a,b)=>b.saving-a.saving);
          for(const row of remaining){
            if(total<=budget) break;
            if(row.saving<=0) continue;
            selected.push(row);
            total-=row.saving;
          }
          console.log(JSON.stringify({originalTotal,budget,selected:selected.map(r=>({path:r.webPath,before:r.before,after:r.after,saving:r.saving})),finalTotal:total}));
          if(total>budget) throw new Error(`Safe CSS compaction remains over budget: ${total} > ${budget}`);
          for(const row of selected) fs.writeFileSync(row.path,row.compact);
          NODE
          node scripts/check-v4.9-performance-budget.cjs
          rm .github/workflows/compact-design-system.yml
          git add -A
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'perf: compact loaded CSS within existing budget'
          git push origin HEAD:design/visual-hierarchy-v3-20260927
