name: Compact Final Design System

on:
  push:
    branches:
      - design/visual-hierarchy-v3-20260927
    paths:
      - .github/workflows/compact-design-system.yml

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/visual-hierarchy-v3-20260927
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Select the smallest restructured CSS set that meets the existing budget
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          npm install --no-save --ignore-scripts csso@5.0.5 css-tree@3.1.0
          node <<'NODE'
          const fs=require('fs');
          const csso=require('csso');
          const csstree=require('css-tree');
          const app=fs.readFileSync('app.html','utf8');
          const cssPaths=[...new Set([...app.matchAll(/href="(\/src\/(?:v4|v5)\/[^"?]+\.css)\?v=\d+"/g)].map(m=>m[1]))];
          const budget=180000;
          const rows=cssPaths.map(webPath=>{
            const path='.'+webPath;
            const source=fs.readFileSync(path,'utf8');
            csstree.parse(source);
            const compact=csso.minify(source,{restructure:true}).css+'\n';
            csstree.parse(compact);
            return {webPath,path,source,compact,before:Buffer.byteLength(source),after:Buffer.byteLength(compact),saving:Buffer.byteLength(source)-Buffer.byteLength(compact)};
          });
          const originalTotal=rows.reduce((sum,row)=>sum+row.before,0);
          let total=originalTotal;
          const selected=[];
          const ranked=rows.filter(r=>r.saving>0).sort((a,b)=>b.saving-a.saving);
          for(const row of ranked){
            if(total<=budget) break;
            selected.push(row);
            total-=row.saving;
          }
          console.log(JSON.stringify({originalTotal,budget,ranked:ranked.map(r=>({path:r.webPath,saving:r.saving,after:r.after})),selected:selected.map(r=>r.webPath),finalTotal:total}));
          if(total>budget) throw new Error(`CSS compaction remains over budget: ${total} > ${budget}`);
          for(const row of selected) fs.writeFileSync(row.path,row.compact);
          NODE
          node scripts/check-v4.9-performance-budget.cjs
          rm .github/workflows/compact-design-system.yml
          git add -A
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'perf: compact minimal loaded CSS set within budget'
          git push origin HEAD:design/visual-hierarchy-v3-20260927
