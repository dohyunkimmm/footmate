name: Case Study Reader Baseline Refresh
on:
  push:
    branches: [portfolio/case-study-reader-cleanup]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: portfolio/case-study-reader-cleanup
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Update Case Study reader contracts
        run: |
          node <<'NODE'
          const fs=require('node:fs');

          const contentPath='tests/e2e/v5.1-case-study-content.spec.cjs';
          let content=fs.readFileSync(contentPath,'utf8');
          content=content.replace(
            "document.documentElement.dataset.footmateCaseStudySectionLabelLanguage==='en'\n  );",
            "document.documentElement.dataset.footmateCaseStudySectionLabelLanguage==='en'&&\n    document.documentElement.dataset.footmateCaseStudyReaderPolish==='1'\n  );"
          );
          content=content.replace(
            "test('story sections stay vertically centered and fit the 1440x900 review surface',async({page})=>{",
            "test('story sections use compact top-aligned density and fit the 1440x900 review surface',async({page})=>{"
          );
          content=content.replace(
            "        centerDelta:slide?Math.abs((rect.top+rect.bottom)/2-(slide.top+slide.bottom)/2):999,\n        overflow:story.scrollHeight-story.clientHeight",
            "        slideTop:slide?.top||0,\n        overflow:story.scrollHeight-story.clientHeight"
          );
          content=content.replace(
            "    expect(geometry.top).toBeGreaterThanOrEqual(140);\n    expect(geometry.bottom).toBeLessThanOrEqual(760);\n    expect(geometry.centerDelta).toBeLessThanOrEqual(20);",
            "    expect(geometry.top-geometry.slideTop).toBeGreaterThanOrEqual(34);\n    expect(geometry.top-geometry.slideTop).toBeLessThanOrEqual(50);\n    expect(geometry.bottom).toBeLessThanOrEqual(835);"
          );
          content=content.replace(
            "  expect(await slideText(page,10)).toContain('실제 다인 협업 성과');",
            "  expect(await slideText(page,10)).toContain('실제 연결');\n  expect(await slideText(page,10)).toContain('정의한 기준');"
          );
          const insertBefore="test('mobile static preview caption stays below the frame without clipping'";
          if(!content.includes('reader-facing cleanup removes internal jargon')){
            const block=`test('reader-facing cleanup removes internal jargon and legacy review exits',async({page})=>{\n  await openCaseStudy(page);\n  const slides=await visibleSlides(page);\n  const allText=(await slides.allInnerTexts()).join('\\n');\n  expect(allText).not.toContain('PBL');\n  expect(allText).toContain('같은 교육과정을 수강한 교육생 6명');\n  await expect(slides.nth(7).locator('.fm-next-cs-state-line')).toHaveCount(0);\n  await expect(slides.nth(7)).toContainText('상태 보존');\n  await expect(slides.nth(8).locator('.fm-next-cs-link')).toHaveCount(0);\n  expect(await slides.nth(11).innerText()).not.toMatch(/분자|분모/);\n  await expect(slides.nth(11)).toContainText('계산 기준 · 상세 진입 세션 ÷ 결과 노출 세션');\n});\n\n`;
            content=content.replace(insertBefore,block+insertBefore);
          }
          fs.writeFileSync(contentPath,content);

          const visualPath='tests/e2e/v5.1-case-study-visual.spec.cjs';
          let visual=fs.readFileSync(visualPath,'utf8');
          visual=visual.replace(
            "document.documentElement.dataset.footmateCaseStudyRelease==='5.1.1'&&document.documentElement.dataset.footmateCaseStudySections==='13'&&document.querySelectorAll('.slide:not([hidden])').length===13",
            "document.documentElement.dataset.footmateCaseStudyRelease==='5.1.1'&&document.documentElement.dataset.footmateCaseStudySections==='13'&&document.documentElement.dataset.footmateCaseStudyReaderPolish==='1'&&document.querySelectorAll('.slide:not([hidden])').length===13"
          );
          visual=visual.replace(
            "      centerDelta:slide?Math.abs((rect.top+rect.bottom)/2-(slide.top+slide.bottom)/2):999,\n      overflow:story.scrollHeight-story.clientHeight",
            "      slideTop:slide?.top||0,\n      overflow:story.scrollHeight-story.clientHeight"
          );
          visual=visual.replace(
            "  expect(geometry.top).toBeGreaterThanOrEqual(140);\n  expect(geometry.bottom).toBeLessThanOrEqual(760);\n  expect(geometry.centerDelta).toBeLessThanOrEqual(20);",
            "  expect(geometry.top-geometry.slideTop).toBeGreaterThanOrEqual(34);\n  expect(geometry.top-geometry.slideTop).toBeLessThanOrEqual(50);\n  expect(geometry.bottom).toBeLessThanOrEqual(835);"
          );
          fs.writeFileSync(visualPath,visual);
          NODE
      - name: Install browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh strict Case Study baselines
        run: npx playwright test --project=chromium tests/e2e/v5.1-case-study-content.spec.cjs tests/e2e/v5.1-case-study-reader-polish.spec.cjs tests/e2e/v5.1-case-study-visual.spec.cjs --update-snapshots
      - name: Commit reviewed contracts and baselines
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/v5.1-case-study-content.spec.cjs tests/e2e/v5.1-case-study-reader-polish.spec.cjs tests/e2e/v5.1-case-study-visual.spec.cjs tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh Case Study reader baselines'
          git push origin HEAD:portfolio/case-study-reader-cleanup
