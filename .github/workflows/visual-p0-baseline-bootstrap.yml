name: Visual P0 Baseline Bootstrap
on:
  push:
    branches:
      - design/visual-p0-finish-20260928
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
      - name: Generate intended P0 snapshots
        run: npx playwright test --project=chromium tests/e2e/visual-p0-finish.spec.cjs --update-snapshots
      - name: Compare generated P0 snapshots
        run: npx playwright test --project=chromium tests/e2e/visual-p0-finish.spec.cjs
      - name: Upload P0 baseline candidates
        uses: actions/upload-artifact@v6
        with:
          name: visual-p0-baselines-${{ github.run_id }}
          path: tests/e2e/visual-p0-finish.spec.cjs-snapshots/
          if-no-files-found: error
          retention-days: 7
