name: Case Study planning baseline review
on:
  push:
    branches: [codex/service-planning-case-study]
    paths:
      - index.html
      - src/v5/case-study-connected.js
      - src/v5/case-study-heading-polish.js
      - tests/e2e/v5.1-case-study-content.spec.cjs
      - .github/workflows/case-study-planning-baseline.yml
permissions:
  contents: write
concurrency:
  group: case-study-planning-baseline
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/service-planning-case-study
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Install existing QA dependencies
        run: npm install --no-save @playwright/test@1.55.1 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate changed Case Study baselines
        run: npx playwright test tests/e2e/v5.1-case-study-visual.spec.cjs --update-snapshots
      - name: Compare snapshots and validate content, layout, accessibility
        run: npx playwright test tests/e2e/v5.1-case-study-visual.spec.cjs tests/e2e/v5.1-case-study-content.spec.cjs tests/e2e/v5.1-case-study-wrap.spec.cjs tests/e2e/v5.1-case-study-accessibility.spec.cjs tests/e2e/v5.1-case-study.spec.cjs
      - name: Commit reviewed-scope baselines for the regular PR gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m 'test: refresh service-planning Case Study visual baselines'
            git push origin HEAD:codex/service-planning-case-study
          fi
      - name: Upload visual review evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: case-study-planning-review
          path: |
            tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/
            playwright-report/
            test-results/
          retention-days: 7
