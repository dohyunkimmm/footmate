name: Product Polish Baseline Refresh
on:
  push:
    branches: [ui/product-polish-100]
    paths:
      - .github/workflows/product-polish-baseline-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: npm install --no-save @playwright/test@1.55.1 css-tree@3.1.0 @axe-core/playwright@4.10.2
      - name: Validate source and performance budget
        run: |
          node --check src/v5/ai-match-assistant.js
          node scripts/check-v4.9-performance-budget.cjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh affected Product baselines
        run: >-
          npx playwright test
          tests/e2e/product-completion.spec.cjs
          tests/e2e/real-app-white-surface.spec.cjs
          tests/e2e/v5.1-design-system-v2.spec.cjs
          tests/e2e/v5.1-visual-baseline.spec.cjs
          tests/e2e/v5.1-visual-system-completion.spec.cjs
          tests/e2e/v5.1-release-flow-review.spec.cjs
          --update-snapshots
      - name: Commit snapshots only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'tests/e2e/*-snapshots/*.png'
          if git diff --cached --quiet; then
            echo 'No snapshot changes.'
          else
            git commit -m 'test: approve final product polish baselines'
            git push origin HEAD:ui/product-polish-100
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: product-polish-baseline-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
