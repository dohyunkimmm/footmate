name: Case Study Content Baseline Sync
on:
  push:
    branches: [content/case-study-deduplicate]
permissions:
  contents: write
concurrency:
  group: case-study-content-baseline-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser QA dependencies
        run: npm install --no-save @playwright/test@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Regenerate changed Case Study screenshots
        run: npx playwright test tests/e2e/v5.1-case-study-visual.spec.cjs --update-snapshots
      - name: Commit generated baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/
          if git diff --cached --quiet; then
            echo 'No baseline changes.'
            exit 0
          fi
          git commit -m 'test: refresh Case Study content baselines'
          git push origin HEAD:${GITHUB_REF_NAME}
