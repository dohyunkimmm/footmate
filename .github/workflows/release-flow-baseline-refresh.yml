name: Release Flow Baseline Refresh

on:
  push:
    branches:
      - fix/release-flow-qa-20260923

permissions:
  contents: write

concurrency:
  group: release-flow-baseline-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser QA dependencies
        run: npm install --no-save @playwright/test@1.55.1 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh affected release-flow baselines
        run: >-
          npx playwright test
          tests/e2e/v5.1-release-flow-qa.spec.cjs
          tests/e2e/v5.1-visual-baseline.spec.cjs
          tests/e2e/v5.1-visual-system-completion.spec.cjs
          tests/e2e/v5.1-case-study-visual.spec.cjs
          --update-snapshots
      - name: Commit refreshed baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/*-snapshots/*.png
          if git diff --cached --quiet; then
            echo 'No baseline changes.'
          else
            git commit -m 'test: sync release flow visual baselines'
            git push
          fi
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-flow-baselines-${{ github.run_id }}
          path: |
            tests/e2e/*-snapshots/*.png
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
