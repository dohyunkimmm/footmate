name: One-time FootMate PPT cleanup
on:
  push:
    branches: [fix/case-study-remove-defensive-copy-ppt-20261031]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'dohyunkimmm/footmate' && github.ref == 'refs/heads/fix/case-study-remove-defensive-copy-ppt-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress fonts-noto-cjk
          python -m pip install --quiet python-pptx pymupdf
      - name: Update PPT and preview
        run: python scripts/clean-case-study-presentation.py
      - name: Commit updated presentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/case-study/downloads/footmate_report.pptx src/case-study/report-previews.js
          git diff --cached --quiet && { echo 'No changed PPT assets'; exit 1; }
          git commit -m 'style(case-study): update PPT and preview after editorial cleanup'
          git push origin HEAD:fix/case-study-remove-defensive-copy-ppt-20261031
