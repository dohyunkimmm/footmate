name: Audit all Git branch patches (read only)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/audit-branch-patches.yml
      - tests/tools/branch-hygiene.cjs
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-branch-patches.yml
      - tests/tools/branch-hygiene.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'dohyunkimmm/footmate' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Fetch and verify the current remote branch inventory
        shell: bash
        run: |
          set -euo pipefail
          d=verification/git-branch-audit
          mkdir -p "$d"
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git rev-parse --verify refs/remotes/origin/main
          git ls-remote --heads origin |
            awk '{sub(/^refs\/heads\//,"",$2); print $1 "\t" $2}' |
            LC_ALL=C sort > "$d/remote-heads.tsv"
          git for-each-ref --format='%(objectname)%09%(refname:lstrip=3)' refs/remotes/origin |
            awk -F '\t' '$2 != "HEAD"' |
            LC_ALL=C sort > "$d/fetched-heads.tsv"
          test -s "$d/remote-heads.tsv"
          if ! diff -u "$d/remote-heads.tsv" "$d/fetched-heads.tsv"; then
            echo "::error::Fetched branch refs differ from remote. Retry the read-only audit."
            exit 1
          fi
          count="$(wc -l < "$d/remote-heads.tsv" | tr -d '[:space:]')"
          echo "Read-only branch audit: $count current remote refs verified (including main)."

      - name: Audit patches and exact tree equality
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification/git-branch-audit
          node tests/tools/branch-hygiene.cjs > verification/git-branch-audit/patches.tsv
          expected_refs="$(($(wc -l < verification/git-branch-audit/remote-heads.tsv) - 1))"
          compared_refs="$(($(wc -l < verification/git-branch-audit/patches.tsv) - 1))"
          if [ "$compared_refs" -ne "$expected_refs" ]; then
            echo "::error::Branch audit covered $compared_refs refs, expected $expected_refs."
            exit 1
          fi
          printf 'branch\thead_sha\tidentical_tree\n' > verification/git-branch-audit/tree-equality.tsv
          while IFS= read -r branch; do
            if [ "$branch" = 'origin/main' ] || [ "$branch" = 'origin/HEAD' ]; then continue; fi
            sha="$(git rev-parse "$branch")"
            if git diff --quiet origin/main "$branch"; then
              equal='true'
            else
              equal='false'
            fi
            printf '%s\t%s\t%s\n' "$branch" "$sha" "$equal" >> verification/git-branch-audit/tree-equality.tsv
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep -E '^origin/' | sort)

          echo '### Non-destructive Git branch audit' >> "$GITHUB_STEP_SUMMARY"
          awk -F '\t' 'NR>1{total++; if($6=="patch-equivalent-review")patch++; if($6=="ancestry-contained-review")ancestor++; if($6=="unique-patches-preserve")unique++} END{printf "Compared %d refs; ancestry-contained %d, patch-equivalent review %d, unique patches %d.\n",total,ancestor,patch,unique}' verification/git-branch-audit/patches.tsv | tee -a "$GITHUB_STEP_SUMMARY"
          awk -F '\t' 'NR>1&&$3=="true"{print $1" "$2; count++} END{printf "Identical working trees: %d\n",count+0}' verification/git-branch-audit/tree-equality.tsv | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'Exact-tree matches (if any) require PR, external-ref and object-retention review before deletion.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Patch-equivalent review candidates (never an automatic deletion permit):'
          awk -F '\t' 'NR>1&&$6=="patch-equivalent-review"{print $0; if(++n==40)exit}' verification/git-branch-audit/patches.tsv
          echo 'Exact-tree matches:'
          awk -F '\t' 'NR>1&&$3=="true"{print $0}' verification/git-branch-audit/tree-equality.tsv
          git count-objects -v

      - name: Upload audit reports
        uses: actions/upload-artifact@v6
        with:
          name: full-git-branch-patch-audit
          path: verification/git-branch-audit/*.tsv
          retention-days: 30
