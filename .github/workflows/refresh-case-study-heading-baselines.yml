name: Refresh Case Study Heading Baselines
on:
  push:
    branches:
      - fix/case-study-english-headings-toc-wrap
    paths:
      - .github/workflows/refresh-case-study-heading-baselines.yml
permissions:
  contents: write
  actions: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/case-study-english-headings-toc-wrap
          fetch-depth: 0
      - name: Download verified Browser QA evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10744860906/zip" \
            -o evidence.zip
          mkdir evidence
          unzip -q evidence.zip -d evidence
      - name: Verify deterministic retries and refresh 26 baselines
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil

          root=Path('evidence/test-results/playwright')
          files=list(root.rglob('case-study-*-actual.png'))
          groups={}
          for path in files:
              groups.setdefault(path.name,[]).append(path)
          assert len(groups)==26, f'expected 26 changed snapshots, got {len(groups)}'
          assert len(files)==52, f'expected actual+retry pairs (52 files), got {len(files)}'

          target=Path('tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots')
          for name, paths in sorted(groups.items()):
              assert len(paths)==2, f'{name}: expected 2 deterministic captures, got {len(paths)}'
              hashes={hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
              assert len(hashes)==1, f'{name}: actual/retry mismatch'
              baseline=name.replace('-actual.png','-chromium-linux.png')
              destination=target / baseline
              assert destination.exists(), f'missing existing baseline: {destination}'
              shutil.copy2(paths[0], destination)
              print(f'{name} -> {baseline} {next(iter(hashes))[:12]}')
          PY
      - name: Commit approved baselines
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots
          git diff --cached --quiet && { echo "No baseline changes"; exit 1; }
          git commit -m "test: approve English heading and TOC wrap baselines"
          git push origin HEAD:fix/case-study-english-headings-toc-wrap
