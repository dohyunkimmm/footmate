name: Render FootMate strategy preview assets with Korean fonts
on:
  push:
    branches:
      - add-5year-strategy-preview-20261108
permissions:
  contents: write
jobs:
  render:
    if: "!contains(github.event.head_commit.message, '[preview render]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-5year-strategy-preview-20261108
          persist-credentials: true
      - name: Install slide render tools and Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-nanum fonts-noto-cjk
          fc-cache -f
          fc-match ':lang=ko'
      - name: Render six original PPTX slides
        run: |
          set -eu
          mkdir -p /tmp/footmate-strategy-preview src/case-study/previews/strategy
          libreoffice -env:UserInstallation=file:///tmp/lo-footmate-strategy --headless --convert-to pdf --outdir /tmp/footmate-strategy-preview src/case-study/downloads/footmate_5year_strategy.pptx
          pdftoppm -f 1 -l 6 -r 105 -jpeg -jpegopt quality=88,optimize=y,progressive=y /tmp/footmate-strategy-preview/footmate_5year_strategy.pdf src/case-study/previews/strategy/slide
          count=$(find src/case-study/previews/strategy -maxdepth 1 -name 'slide-*.jpg' | wc -l)
          test "$count" -eq 6
          ls -lh src/case-study/previews/strategy
      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/case-study/previews/strategy/slide-*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "asset: render Korean strategy slide previews [preview render]"
            git push origin HEAD:add-5year-strategy-preview-20261108
          fi
