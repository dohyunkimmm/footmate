name: P13 Baseline Sync

on:
  push:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install browser QA dependencies
        run: npm install --no-save @playwright/test@1.55.1 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate corrected Case Study baselines
        run: npx playwright test tests/e2e/v5.1-case-study-visual.spec.cjs --update-snapshots
      - name: Commit changed baselines
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: approve P13 hard-stop visual baseline"
          git push
