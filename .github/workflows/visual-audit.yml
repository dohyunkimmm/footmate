name: Real App Visual Audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: footmate-visual-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    name: Capture Real App states
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Install browser audit dependencies
        run: npm install --no-save @playwright/test@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture Real App visual states
        run: npx playwright test tests/e2e/real-app-visual-polish-audit.spec.cjs
      - name: Upload visual audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-app-visual-audit-${{ github.run_id }}
          path: |
            test-results/visual-polish-audit/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
