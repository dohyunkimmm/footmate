name: Diagnose Welcome Geometry Temp
on:
  push:
    branches:
      - fix/welcome-visible-offset-20260926
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Playwright
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Measure current production Welcome geometry
        run: |
          node - <<'NODE'
          const { chromium } = require('@playwright/test');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('https://footmate-black.vercel.app/demo',{waitUntil:'networkidle'});
            await page.waitForSelector('[data-screen="welcome"] .fm-next-intro-copy');
            const result=await page.evaluate(()=>{
              const rect=s=>{const el=document.querySelector(s);if(!el)return null;const r=el.getBoundingClientRect();const c=getComputedStyle(el);return {top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height,transform:c.transform,position:c.position,marginTop:c.marginTop,marginBottom:c.marginBottom}};
              return {
                topbar:rect('[data-screen="welcome"] .fm-next-topbar--dark'),
                brand:rect('[data-screen="welcome"] .fm-next-brand'),
                copy:rect('[data-screen="welcome"] .fm-next-intro-copy'),
                headline:rect('[data-screen="welcome"] .fm-next-intro-copy h1'),
                support:rect('[data-screen="welcome"] [data-welcome-ai-copy]'),
                actions:rect('[data-screen="welcome"] .fm-next-actions'),
                intro:rect('[data-screen="welcome"] .fm-next-intro'),
                text:document.querySelector('[data-screen="welcome"]')?.innerText
              };
            });
            console.log('WELCOME_GEOMETRY',JSON.stringify(result));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
