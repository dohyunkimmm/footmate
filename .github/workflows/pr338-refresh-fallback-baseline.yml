name: PR338 Refresh Fallback Baseline
on:
  push:
    branches:
      - fix/home-ai-compact-header-20260926
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Refresh intended fallback baseline
        run: npx playwright test --project=chromium tests/e2e/product-completion.spec.cjs -g "AI fallback exposes an explicit retry action on Home without duplicating results there" --update-snapshots
      - name: Prove fallback baseline
        run: npx playwright test --project=chromium tests/e2e/product-completion.spec.cjs -g "AI fallback exposes an explicit retry action on Home without duplicating results there"
      - name: Commit fallback baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/product-completion.spec.cjs-snapshots/product-completion-ai-fallback-ia-390-chromium-linux.png
          git commit -m 'test: refresh Home fallback visual baseline'
          git push origin "HEAD:${GITHUB_REF_NAME}"
