name: Refresh Case Study Layout Baselines

on:
  push:
    branches:
      - style/case-study-layout-density

permissions:
  contents: write

env:
  ARTIFACT_ID: '10736234998'

jobs:
  refresh:
    if: contains(github.event.head_commit.message, 'one-time Case Study baseline refresh')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: style/case-study-layout-density
          fetch-depth: 0
      - name: Download verified Browser E2E artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fm-artifact
          curl -fsSL -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/fm-artifact.zip
          unzip -q /tmp/fm-artifact.zip -d /tmp/fm-artifact
      - name: Verify deterministic actuals and refresh 24 baselines
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil

          root = Path('/tmp/fm-artifact/test-results/playwright')
          snapshot_dir = Path('tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots')
          actuals = list(root.rglob('case-study-13-*-actual.png'))
          groups = {}
          for path in actuals:
              groups.setdefault(path.name, []).append(path)

          expected = {name: paths for name, paths in groups.items()
                      if name.endswith('-1440-actual.png') or name.endswith('-390-actual.png')}
          if len(expected) != 24:
              raise SystemExit(f'Expected 24 changed section screenshots, found {len(expected)}')

          for name, paths in sorted(expected.items()):
              if len(paths) != 2:
                  raise SystemExit(f'{name}: expected original + retry, found {len(paths)}')
              hashes = {hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
              if len(hashes) != 1:
                  raise SystemExit(f'{name}: retry mismatch')
              target = snapshot_dir / name.replace('-actual.png', '-chromium-linux.png')
              if not target.exists():
                  raise SystemExit(f'Missing baseline target: {target}')
              shutil.copy2(paths[0], target)
              print(f'refreshed {target}')
          PY
      - name: Commit approved baseline refresh
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/*.png
          git diff --cached --quiet && { echo 'No baseline changes'; exit 1; }
          git commit -m "test: refresh Case Study layout visual baselines"
          git push origin HEAD:style/case-study-layout-density
