name: Case Study Visual Baseline Approval
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/v5.1-case-study-visual.spec.cjs'
      - '.github/workflows/case-study-visual-baseline-capture.yml'
permissions:
  contents: write
jobs:
  approve:
    name: Approve Production visual baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate approved baselines from exact Production
        env:
          BASE_URL: https://footmate-black.vercel.app
        run: npx playwright test tests/e2e/v5.1-case-study-visual.spec.cjs --update-snapshots
      - name: Verify screenshot comparison against approved baselines
        env:
          BASE_URL: https://footmate-black.vercel.app
        run: npx playwright test tests/e2e/v5.1-case-study-visual.spec.cjs
      - name: Commit approved baseline PNGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/*.png
          git diff --cached --quiet && exit 0
          git commit -m 'test: approve Case Study visual baselines'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload approved baseline evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: case-study-approved-baseline-${{ github.run_id }}
          path: |
            tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
