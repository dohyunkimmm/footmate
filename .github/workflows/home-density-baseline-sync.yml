name: Sync Home Density Baselines
on:
  push:
    branches: [fix/home-initial-viewport-density]
permissions:
  actions: read
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/home-initial-viewport-density
      - name: Tighten Home density contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/product-completion.spec.cjs')
          s=p.read_text()
          s=s.replace('expect(metrics.firstCardTop).toBeLessThanOrEqual(690);','expect(metrics.firstCardTop).toBeLessThanOrEqual(600);')
          s=s.replace('expect(metrics.navTop-metrics.firstCardTop).toBeGreaterThanOrEqual(56);','expect(metrics.navTop-metrics.firstCardTop).toBeGreaterThanOrEqual(120);')
          anchor="""test('Discover is exploration-first with AI search plus filters',async({page})=>{"""
          extra="""test('601px viewport keeps the fixed 560px Home shell compact instead of re-expanding desktop spacing',async({page})=>{\n  const errs=await openCleanApp(page,{width:601,height:984});\n  await setupToHome(page);\n  const density=await page.locator('[data-screen=\"home\"]').evaluate(element=>{\n    const app=element.closest('.fm-next-app');\n    const contextCopy=element.querySelector('.fm-next-context-card p');\n    const sectionCopy=element.querySelector(':scope > .fm-next-section-head p');\n    const first=element.querySelector('.fm-next-match-card').getBoundingClientRect();\n    const nav=element.querySelector('.fm-next-nav').getBoundingClientRect();\n    return {\n      appWidth:app.getBoundingClientRect().width,\n      contextCopyDisplay:getComputedStyle(contextCopy).display,\n      sectionCopyDisplay:getComputedStyle(sectionCopy).display,\n      firstCardTop:first.top,\n      navTop:nav.top\n    };\n  });\n  expect(density.appWidth).toBeLessThanOrEqual(560);\n  expect(density.contextCopyDisplay).toBe('none');\n  expect(density.sectionCopyDisplay).toBe('none');\n  expect(density.firstCardTop).toBeLessThanOrEqual(620);\n  expect(density.navTop-density.firstCardTop).toBeGreaterThanOrEqual(180);\n  await expectNoOverflow(page);\n  expect(errs).toEqual([]);\n});\n\n"""
          if extra.strip() not in s:
              if anchor not in s: raise SystemExit('Discover anchor missing')
              s=s.replace(anchor,extra+anchor,1)
          p.write_text(s)
          PY
      - name: Download reviewed failed-run evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/home-density-evidence
          mkdir -p /tmp/home-density-evidence
          gh run download 36002047002 -n real-app-white-surface-36002047002 -D /tmp/home-density-evidence
          fallback="$(find /tmp/home-density-evidence -name 'product-completion-ai-fallback-390-actual.png' -print -quit)"
          white_home="$(find /tmp/home-density-evidence -name 'real-app-white-home-390-actual.png' -print -quit)"
          test -n "$fallback" && test -n "$white_home"
          cp "$fallback" tests/e2e/product-completion.spec.cjs-snapshots/product-completion-ai-fallback-390-chromium-linux.png
          cp "$white_home" tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-home-390-chromium-linux.png
      - name: Commit reviewed baselines and contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/product-completion.spec.cjs tests/e2e/product-completion.spec.cjs-snapshots/product-completion-ai-fallback-390-chromium-linux.png tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-home-390-chromium-linux.png
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m "test: approve Home density visual baselines"
          git push origin HEAD:fix/home-initial-viewport-density