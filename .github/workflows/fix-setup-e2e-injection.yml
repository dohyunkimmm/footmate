name: Repair setup E2E helper injection
on:
  push:
    branches: [fix/real-app-unselected-setup]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/real-app-unselected-setup
      - name: Re-inject helper calls at exact setup action sites
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          helper_call=re.compile(r"\s*await chooseSetupDefaultIfNeeded\(([A-Za-z_$][\w$]*)\);")
          next_call=re.compile(r"await ([A-Za-z_$][\w$]*)\.getByRole\('button',\{name:'다음'\}\)\.click\(\);")
          finish_call=re.compile(r"await ([A-Za-z_$][\w$]*)\.getByRole\('button',\{name:/추천 경기 보기/\}\)\.click\(\);")

          changed=[]
          for path in sorted(Path('tests/e2e').glob('*.cjs')):
            text=path.read_text()
            if 'async function chooseSetupDefaultIfNeeded' not in text:
              continue
            cleaned=helper_call.sub(lambda m:'',text)
            cleaned=next_call.sub(lambda m:f"await chooseSetupDefaultIfNeeded({m.group(1)});await {m.group(1)}.getByRole('button',{{name:'다음'}}).click();",cleaned)
            cleaned=finish_call.sub(lambda m:f"await chooseSetupDefaultIfNeeded({m.group(1)});await {m.group(1)}.getByRole('button',{{name:/추천 경기 보기/}}).click();",cleaned)
            if cleaned!=text:
              path.write_text(cleaned)
              changed.append(str(path))
          print('\n'.join(changed))
          if not changed:
            raise SystemExit('No helper injection changes made')
          PY
          for f in tests/e2e/*.cjs; do node --check "$f"; done
          git diff --check
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-setup-e2e-injection.yml
          git add tests/e2e
          git commit -m "test: repair explicit setup helper calls"
          git push origin HEAD:fix/real-app-unselected-setup
