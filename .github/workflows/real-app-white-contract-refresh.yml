name: Refresh Real App White Contracts
on:
  push:
    branches: [ui/real-app-white-surface-completion]
    paths:
      - .github/workflows/real-app-white-contract-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Align release-flow contrast contract with white-first Welcome
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/e2e/v5.1-release-flow-review.spec.cjs')
          text=path.read_text()
          text=text.replace("expect(color,`welcome headline color at ${viewport.name}px`).toBe('rgb(255, 255, 255)');","expect(color,`welcome headline color at ${viewport.name}px`).toBe('rgb(19, 32, 25)');")
          text=text.replace("const background=await topbar.evaluate(element=>getComputedStyle(element).backgroundImage);\n    expect(background).toContain('linear-gradient');","const background=await topbar.evaluate(element=>getComputedStyle(element).backgroundColor);\n    expect(background).toBe('rgba(255, 255, 255, 0.86)');")
          path.write_text(text)
          PY
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh affected release-flow snapshots
        run: npx playwright test tests/e2e/v5.1-release-flow-review.spec.cjs --update-snapshots
      - name: Verify Case Study remains on its approved embedded visual
        run: npx playwright test tests/e2e/v5.1-case-study-visual.spec.cjs
      - name: Upload Case Study evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: case-study-regression-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Commit contract and snapshot updates
        if: success()
        run: |
          git status --short
          git add tests/e2e/v5.1-release-flow-review.spec.cjs tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/*.png
          if git diff --cached --quiet; then
            echo "No contract changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: align release-flow visuals with white-first app"
          git push
