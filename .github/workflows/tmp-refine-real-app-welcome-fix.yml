name: Temporary Refine Real App Welcome Fix
on:
  push:
    branches: [fix/real-app-welcome-final-correction]
    paths: [.github/workflows/tmp-refine-real-app-welcome-fix.yml]
permissions:
  contents: write
jobs:
  refine:
    if: "${{ github.event.head_commit.message == 'ci: refine welcome correction implementation' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/real-app-welcome-final-correction
          fetch-depth: 0
      - name: Keep visual correction without increasing CSS budget
        run: |
          python - <<'PY'
          from pathlib import Path
          style='style="height:54px;min-height:54px;padding:0 20px;border-radius:16px"'

          css=Path('src/v4/discovery.css')
          text=css.read_text()
          old='''[data-mode=real] [data-screen=welcome] .fm-next-topbar--dark{position:absolute!important;transform:translateY(-12px)!important}\n[data-mode=real] [data-screen=welcome] :is(.fm-next-button,.fm-personalization-quick){height:54px!important;min-height:54px!important;padding:0 20px!important;border-radius:16px!important}'''
          new='[data-mode=real] [data-screen=welcome] .fm-next-topbar--dark{position:absolute!important}'
          if text.count(old)!=1: raise SystemExit(f'css target count {text.count(old)}')
          css.write_text(text.replace(old,new,1))

          app=Path('src/v4/app.js')
          text=app.read_text()
          old='<div class="fm-next-topbar fm-next-topbar--dark">${brand({dark:true})}<span style="width:44px" aria-hidden="true"></span></div>'
          new='<div class="fm-next-topbar fm-next-topbar--dark" style="transform:translateY(-12px)">${brand({dark:true})}<span style="width:44px" aria-hidden="true"></span></div>'
          if text.count(old)<2: raise SystemExit(f'topbar target count {text.count(old)}')
          text=text.replace(old,new,1)
          old="${button(`내 경기 찾아보기 ${icon('arrow')}`,'start-setup','primary')}"
          new="${button(`내 경기 찾아보기 ${icon('arrow')}`,'start-setup','primary',`%s`)}" % style
          if text.count(old)!=1: raise SystemExit(f'primary target count {text.count(old)}')
          text=text.replace(old,new,1)
          old="${state.setupComplete?button('저장된 설정으로 바로 추천 보기','continue-home','primary'):''}"
          new="${state.setupComplete?button('저장된 설정으로 바로 추천 보기','continue-home','primary',`%s`):''}" % style
          if text.count(old)!=1: raise SystemExit(f'continue target count {text.count(old)}')
          app.write_text(text.replace(old,new,1))

          p=Path('src/v4/personalization.js')
          text=p.read_text()
          old='class="fm-personalization-quick" data-personalization-action="apply-profile"'
          new='class="fm-personalization-quick" %s data-personalization-action="apply-profile"' % style
          if text.count(old)!=1: raise SystemExit(f'quick target count {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Commit refinement and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-refine-real-app-welcome-fix.yml
          git add src/v4/app.js src/v4/discovery.css src/v4/personalization.js
          git commit -m "fix: keep welcome correction within CSS budget"
          git push origin HEAD:fix/real-app-welcome-final-correction
