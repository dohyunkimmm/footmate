name: Audit Rolling Forecast strings before removal release
on:
  push:
    branches: [remove-rolling-forecast-content-20261108]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Search remaining content in tracked source files
        run: |
          set +e
          echo '--- SOURCE TEXT HITS (exclude test assertions and temporary workflows) ---'
          git grep -n -i -E 'Rolling[[:space:]-]*Forecast|수정[[:space:]]*전망|재예측|분기[[:space:]]*전망' -- ':!tests/**' ':!.github/**' ':!src/case-study/report-previews.js' ':!src/case-study/downloads/**' ':!src/case-study/previews/**'
          code=$?
          if [ "$code" -eq 1 ]; then echo 'NO SOURCE TEXT HITS'; elif [ "$code" -ne 0 ]; then exit "$code"; fi
          echo '--- PPTX and XLSX embedded text hits ---'
          python - <<'PY'
          import re,zipfile
          pats=re.compile(r'Rolling\s*Forecast|수정\s?전망|재예측|분기\s?전망',re.I)
          for file in ('src/case-study/downloads/footmate_report.pptx','src/case-study/downloads/footmate_5year_strategy.pptx','src/case-study/downloads/footmate_model.xlsx'):
              with zipfile.ZipFile(file) as z:
                  hits=[]
                  for name in z.namelist():
                      if not name.endswith('.xml'):continue
                      txt=z.read(name).decode('utf-8','replace')
                      for m in pats.finditer(txt):
                          hits.append((name,m.group(0),txt[max(0,m.start()-90):m.end()+90]))
                  print(file,'matches',len(hits))
                  for hit in hits[:25]:print('HIT',hit)
          PY
          echo '--- WORKBOOK STRUCTURE FOR TARGETED CLEANUP ---'
          python - <<'PY'
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          p='src/case-study/downloads/footmate_model.xlsx'
          NS={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
          with ZipFile(p) as z:
              root=ET.fromstring(z.read('xl/workbook.xml'))
              print('Sheets:',[(x.attrib.get('name'),x.attrib.get('sheetId')) for x in root.findall('.//m:sheet',NS)])
              for name in ('xl/worksheets/sheet1.xml','xl/worksheets/sheet3.xml','xl/worksheets/sheet9.xml'):
                  root=ET.fromstring(z.read(name))
                  print('FILE',name)
                  for row in root.findall('.//m:sheetData/m:row',NS)[:24]:
                      rowvals=[]
                      for c in row.findall('m:c',NS)[:8]:
                          v=c.find('m:v',NS)
                          f=c.find('m:f',NS)
                          t=c.find('m:is/m:t',NS)
                          value=(t.text if t is not None else v.text if v is not None else '') or ''
                          if f is not None:value+=' [formula='+str(f.text)+']'
                          if value:rowvals.append(c.attrib.get('r','')+'='+value[:95])
                      if rowvals:print(' '.join(rowvals)[:700])
              for n in z.namelist():
                  if n.startswith('xl/drawings/charts/chart') and n.endswith('.xml'):
                      print('CHART',n)
                      root=ET.fromstring(z.read(n))
                      for ser in root.findall('.//{http://schemas.openxmlformats.org/drawingml/2006/chart}ser'):
                          print('SERIES',' '.join(x.text or '' for x in ser.iter() if x.tag.endswith(('v','f')))[:750])
          PY
