name: Desktop Auth QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/v4/platform/presentation/auth-height-fix.js'
      - 'src/v4/experience.css'
      - 'tests/e2e/desktop-auth-horizontal-lock.spec.cjs'
      - '.github/workflows/desktop-auth-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/v4/platform/presentation/auth-height-fix.js'
      - 'src/v4/experience.css'
      - 'tests/e2e/desktop-auth-horizontal-lock.spec.cjs'
      - '.github/workflows/desktop-auth-qa.yml'
permissions:
  contents: write
concurrency:
  group: desktop-auth-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop_auth_local:
    name: 1440px Desktop Auth
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Install pinned Playwright
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
      - name: Verify PC Auth horizontal lock
        run: npx playwright test --project=chromium tests/e2e/desktop-auth-horizontal-lock.spec.cjs
      - name: Generate candidate Auth 1440 baseline
        run: npx playwright test --project=chromium tests/e2e/v5.1-visual-system-completion.spec.cjs --grep "1440px Auth" --update-snapshots
      - name: Persist candidate Auth baseline
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-auth-1440-chromium-linux.png';
          const repo=process.env.GITHUB_REPOSITORY;
          const branch=process.env.HEAD_REF;
          const token=process.env.GH_TOKEN;
          const headers={
            'Accept':'application/vnd.github+json',
            'Authorization':`Bearer ${token}`,
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'footmate-desktop-auth-baseline'
          };
          const api=`https://api.github.com/repos/${repo}/contents/${path}`;
          (async()=>{
            const currentResponse=await fetch(`${api}?ref=${encodeURIComponent(branch)}`,{headers});
            if(!currentResponse.ok)throw new Error(`baseline lookup failed: ${currentResponse.status} ${await currentResponse.text()}`);
            const current=await currentResponse.json();
            const content=fs.readFileSync(path).toString('base64');
            const update=await fetch(api,{
              method:'PUT',
              headers:{...headers,'Content-Type':'application/json'},
              body:JSON.stringify({message:'test: update desktop auth visual baseline',content,branch,sha:current.sha})
            });
            if(!update.ok)throw new Error(`baseline update failed: ${update.status} ${await update.text()}`);
            const result=await update.json();
            console.log(`baseline commit ${result.commit.sha}`);
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Upload desktop evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-auth-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  desktop_auth_production:
    name: Production 1440px Desktop Auth
    needs: desktop_auth_local
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Install pinned Playwright
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Production PC Auth horizontal lock
        env:
          BASE_URL: https://footmate-black.vercel.app
        run: npx playwright test --project=chromium tests/e2e/desktop-auth-horizontal-lock.spec.cjs
      - name: Upload Production desktop evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-desktop-auth-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
