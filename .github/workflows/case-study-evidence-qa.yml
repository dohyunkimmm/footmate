name: Case Study Evidence QA
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  capture:
    name: Desktop + Mobile Evidence Capture
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Install browser QA dependency
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
      - name: Capture Case Study evidence sections
        run: npx playwright test --project=chromium tests/e2e/case-study-product-evidence.spec.cjs tests/e2e/case-study-card-rhythm.spec.cjs tests/e2e/case-study-p1-real-preview.spec.cjs tests/e2e/case-study-evidence-framing.spec.cjs tests/e2e/case-study-p12-copy-spacing.spec.cjs
      - name: Upload Case Study evidence captures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: case-study-evidence-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
