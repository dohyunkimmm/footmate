name: P0 Touch Baseline Refresh
on:
  push:
    branches:
      - fix/p0-touch-target-ai-trust-20260928
    paths:
      - .github/workflows/p0-touch-baseline-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/p0-touch-target-ai-trust-20260928
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Refresh only Discover touch-target snapshot
        run: npx playwright test --project=chromium tests/e2e/priority-ux.spec.cjs --grep 'AI and manual filters' --update-snapshots
      - name: Commit touch-target baseline
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/priority-ux.spec.cjs-snapshots/priority-ai-filter-390-chromium-linux.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: refresh P0 touch target baseline'
          git push origin HEAD:fix/p0-touch-target-ai-trust-20260928
