name: Product audit baseline candidates
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  candidates:
    if: github.head_ref == 'fix/product-audit-main-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - run: npm install --no-save @playwright/test@1.55.1 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps chromium
      - name: Generate review candidates with behavioral contracts active
        run: npx playwright test tests/e2e/v5.1-visual-baseline.spec.cjs tests/e2e/v5.1-visual-system-completion.spec.cjs tests/e2e/v5.1-design-system-v2.spec.cjs tests/e2e/v5.1-release-flow-review.spec.cjs tests/e2e/v5.1-case-study-visual.spec.cjs --update-snapshots
      - name: Compare candidates in a separate run
        run: npx playwright test tests/e2e/v5.1-visual-baseline.spec.cjs tests/e2e/v5.1-visual-system-completion.spec.cjs tests/e2e/v5.1-design-system-v2.spec.cjs tests/e2e/v5.1-release-flow-review.spec.cjs tests/e2e/v5.1-case-study-visual.spec.cjs
      - name: Collect changed candidates without committing or approving them
        if: always()
        run: |
          python - <<'PY'
          import subprocess,pathlib,shutil,json
          root=pathlib.Path('baseline-candidates');root.mkdir(exist_ok=True)
          paths=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          paths.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard','tests/e2e'],text=True).splitlines())
          paths=sorted(p for p in paths if p.endswith('.png') and '-snapshots/' in p)
          for p in paths:
            out=root/p;out.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,out)
          (root/'manifest.json').write_text(json.dumps({'checkout':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'paths':paths,'approval':'requires image review and committed-baseline normal PR comparison'},indent=2))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: product-audit-candidates-${{ github.run_id }}
          path: |
            baseline-candidates/
            playwright-report/
            test-results/
          retention-days: 7
