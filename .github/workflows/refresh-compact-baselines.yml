name: Refresh compact visual baselines
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
  pull-requests: read
jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'fix/compact-empty-setup-spacing'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install visual QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
      - name: Refresh only compact-screen visual baselines
        run: >-
          npx playwright test --project=chromium
          tests/e2e/v5.1-visual-system-completion.spec.cjs
          tests/e2e/visual-consistency-v4.spec.cjs
          --grep "390px Setup matches|390px AI loading and Discovery empty states|390px Welcome and Setup share|390px Schedule empty state"
          --update-snapshots
      - name: Commit approved compact baselines and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-setup-390-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-discovery-empty-390-chromium-linux.png \
            tests/e2e/visual-consistency-v4.spec.cjs-snapshots/visual-consistency-setup-390-chromium-linux.png \
            tests/e2e/visual-consistency-v4.spec.cjs-snapshots/visual-consistency-schedule-empty-390-chromium-linux.png
          git rm .github/workflows/refresh-compact-baselines.yml
          git commit -m "test: refresh compact visual baselines"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
