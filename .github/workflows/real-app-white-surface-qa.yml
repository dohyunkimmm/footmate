name: Real App White Surface QA
on:
  pull_request:
    branches: [main]
    paths:
      - app.html
      - src/v4/design-system-v2.css
      - src/v4/personalization.css
      - src/v5/ai-match-assistant.js
      - src/v4/app.js
      - src/v4/discovery.js
      - src/v4/matchday.js
      - src/v4/personalization.js
      - src/v4/decision.js
      - src/v4/recommendation.js
      - src/v4/platform/domain/recommendation.js
      - tests/e2e/real-app-white-surface.spec.cjs
      - tests/e2e/real-app-white-surface.spec.cjs-snapshots/**
      - tests/e2e/my-fresh-profile-containment.spec.cjs
      - tests/e2e/my-fresh-profile-containment.spec.cjs-snapshots/**
      - tests/e2e/welcome-position.spec.cjs
      - tests/e2e/welcome-source-layout.spec.cjs
      - tests/e2e/real-app-visual-finish.spec.cjs
      - tests/e2e/product-completion.spec.cjs
      - tests/e2e/product-completion.spec.cjs-snapshots/**
      - tests/e2e/v4-matchday.spec.cjs
      - tests/e2e/v4-matchday.spec.cjs-snapshots/**
      - tests/e2e/v4-personalization.spec.cjs
      - tests/e2e/v4-personalization.spec.cjs-snapshots/**
      - .github/workflows/real-app-white-surface-qa.yml
  push:
    branches: [main]
    paths:
      - app.html
      - src/v4/design-system-v2.css
      - src/v4/personalization.css
      - src/v5/ai-match-assistant.js
      - src/v4/app.js
      - src/v4/discovery.js
      - src/v4/matchday.js
      - src/v4/personalization.js
      - src/v4/decision.js
      - src/v4/recommendation.js
      - src/v4/platform/domain/recommendation.js
      - tests/e2e/real-app-white-surface.spec.cjs
      - tests/e2e/real-app-white-surface.spec.cjs-snapshots/**
      - tests/e2e/my-fresh-profile-containment.spec.cjs
      - tests/e2e/my-fresh-profile-containment.spec.cjs-snapshots/**
      - tests/e2e/welcome-position.spec.cjs
      - tests/e2e/welcome-source-layout.spec.cjs
      - tests/e2e/real-app-visual-finish.spec.cjs
      - tests/e2e/product-completion.spec.cjs
      - tests/e2e/product-completion.spec.cjs-snapshots/**
      - tests/e2e/v4-matchday.spec.cjs
      - tests/e2e/v4-matchday.spec.cjs-snapshots/**
      - tests/e2e/v4-personalization.spec.cjs
      - tests/e2e/v4-personalization.spec.cjs-snapshots/**
      - .github/workflows/real-app-white-surface-qa.yml
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION" css-tree@3.1.0
      - name: Check Real App CSS syntax and performance budget
        run: |
          node scripts/check-v4.9-performance-budget.cjs
          node - <<'NODE'
          const fs=require('fs');
          const csstree=require('css-tree');
          const html=fs.readFileSync('app.html','utf8');
          const design=fs.readFileSync('src/v4/design-system-v2.css','utf8');
          if(html.includes('id="fm-real-app-white-tone"'))throw new Error('white-first CSS must not return to inline HTML ownership');
          if(!design.includes('White-first Real App surface ownership'))throw new Error('white-first design-system ownership marker missing');
          if(!design.includes('FootMate Real App Visual Finish · P0–P2'))throw new Error('Real App finish ownership marker missing');
          if(html.includes('/src/v4/real-app-visual-finish.css'))throw new Error('Real App finish must not add a standalone stylesheet request');
          csstree.parse(design);
          console.log('PASS Real App CSS syntax and consolidated ownership');
          NODE
      - name: Check product completion JS syntax
        run: node --check src/v5/ai-match-assistant.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Compare Real App visual baselines and completion contracts
        id: compare
        continue-on-error: true
        run: npx playwright test tests/e2e/real-app-white-surface.spec.cjs tests/e2e/my-fresh-profile-containment.spec.cjs tests/e2e/welcome-position.spec.cjs tests/e2e/welcome-source-layout.spec.cjs tests/e2e/product-completion.spec.cjs tests/e2e/real-app-visual-finish.spec.cjs tests/e2e/v4-matchday.spec.cjs tests/e2e/v4-personalization.spec.cjs
      - name: Refresh intended MY match hub visual baselines
        if: steps.compare.outcome == 'failure' && github.event_name == 'pull_request' && github.head_ref == 'feat/my-match-hub-final-20260926'
        run: |
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout -B "${GITHUB_HEAD_REF}" "origin/${GITHUB_HEAD_REF}"
          npx playwright test tests/e2e/my-fresh-profile-containment.spec.cjs -g "fresh MY guidance stays inside its card" --update-snapshots
          npx playwright test tests/e2e/product-completion.spec.cjs -g "Home is the AI Match Assistant entry" --update-snapshots
          npx playwright test tests/e2e/product-completion.spec.cjs -g "Discover owns filters" --update-snapshots
          npx playwright test tests/e2e/real-app-white-surface.spec.cjs -g "390px Home uses neutral" --update-snapshots
          npx playwright test tests/e2e/real-app-white-surface.spec.cjs -g "390px Discover uses the same" --update-snapshots
          npx playwright test tests/e2e/v4-personalization.spec.cjs -g "Real App MY aligns the saved profile" --update-snapshots
          npx playwright test tests/e2e/v4-matchday.spec.cjs -g "joined match and matchday operations continue inside MY" --update-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/*-snapshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "test: refresh MY match hub visual baselines"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Fail if comparison did not pass
        if: steps.compare.outcome == 'failure'
        run: exit 1
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-app-white-surface-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
