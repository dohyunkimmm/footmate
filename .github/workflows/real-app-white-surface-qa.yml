  pull_request:
    branches: [main]
    paths:
      - app.html
      - playwright.config.cjs
      - src/v4/design-system-v2.css
      - src/v4/personalization.css
      - src/v5/ai-match-assistant.js
      - src/v4/app.js
      - src/v4/discovery.js
      - src/v4/discovery.css
      - src/v4/experience.js
      - src/v4/matchday.js
      - src/v4/platform/application/checkin.js
      - src/v4/platform/presentation/bootstrap.js
      - tests/e2e/checkin-state.spec.cjs
      - tests/e2e/helpers/checkin.cjs
      - tests/e2e/v4-matchday.spec.cjs*
      - tests/e2e/v4-matchday.spec.cjs-snapshots/**
      - tests/e2e/v5.1-release-flow-review.spec.cjs*
      - tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/**
      - tests/e2e/v5.1-visual-system-completion.spec.cjs*
      - tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/**
      - src/v4/personalization.js
      - src/v4/decision.js
      - src/v4/recommendation.js
      - src/v4/platform/domain/recommendation.js
      - src/v4/platform/presentation/bootstrap.js
      - src/v4/platform/presentation/real-app-card-polish.js
      - tests/e2e/real-app-white-surface.spec.cjs
      - tests/e2e/real-app-white-surface.spec.cjs-snapshots/**
      - tests/e2e/visual-consistency-v4.spec.cjs
      - tests/e2e/visual-consistency-v4.spec.cjs-snapshots/**
      - tests/e2e/my-fresh-profile-containment.spec.cjs
      - tests/e2e/my-fresh-profile-containment.spec.cjs-snapshots/**
      - tests/e2e/welcome-position.spec.cjs
      - tests/e2e/welcome-source-layout.spec.cjs
      - tests/e2e/real-app-visual-finish.spec.cjs
      - tests/e2e/product-completion.spec.cjs
      - tests/e2e/priority-ux.spec.cjs
      - tests/e2e/helpers/priority-ux.cjs
      - tests/e2e/priority-ux.spec.cjs-snapshots/**
      - tests/e2e/product-completion.spec.cjs-snapshots/**
      - .github/workflows/real-app-white-surface-qa.yml
  push:
    branches: [main]
    paths:
      - app.html
      - playwright.config.cjs
      - src/v4/design-system-v2.css
      - src/v4/personalization.css
      - src/v5/ai-match-assistant.js
      - src/v4/app.js
      - src/v4/discovery.js
      - src/v4/discovery.css
      - src/v4/experience.js
      - src/v4/matchday.js
      - src/v4/platform/application/checkin.js
      - src/v4/platform/presentation/bootstrap.js
      - tests/e2e/checkin-state.spec.cjs
      - tests/e2e/helpers/checkin.cjs
      - tests/e2e/v4-matchday.spec.cjs*
      - tests/e2e/v4-matchday.spec.cjs-snapshots/**
      - tests/e2e/v5.1-release-flow-review.spec.cjs*
      - tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/**
      - tests/e2e/v5.1-visual-system-completion.spec.cjs*
      - tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/**
      - src/v4/personalization.js
      - src/v4/decision.js
      - src/v4/recommendation.js
      - src/v4/platform/domain/recommendation.js
      - src/v4/platform/presentation/bootstrap.js
      - src/v4/platform/presentation/real-app-card-polish.js
      - tests/e2e/real-app-white-surface.spec.cjs
      - tests/e2e/real-app-white-surface.spec.cjs-snapshots/**
      - tests/e2e/visual-consistency-v4.spec.cjs
      - tests/e2e/visual-consistency-v4.spec.cjs-snapshots/**
      - tests/e2e/my-fresh-profile-containment.spec.cjs
      - tests/e2e/my-fresh-profile-containment.spec.cjs-snapshots/**
      - tests/e2e/welcome-position.spec.cjs
      - tests/e2e/welcome-source-layout.spec.cjs
      - tests/e2e/real-app-visual-finish.spec.cjs
      - tests/e2e/product-completion.spec.cjs
      - tests/e2e/priority-ux.spec.cjs
      - tests/e2e/helpers/priority-ux.cjs
      - tests/e2e/priority-ux.spec.cjs-snapshots/**
      - tests/e2e/product-completion.spec.cjs-snapshots/**
      - .github/workflows/real-app-white-surface-qa.yml
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION" css-tree@3.1.0
      - name: Check Real App CSS syntax and performance budget
        run: |
          node scripts/check-v4.9-performance-budget.cjs
          node - <<'NODE'
          const fs=require('fs');
          const csstree=require('css-tree');
          const html=fs.readFileSync('app.html','utf8');
          const design=fs.readFileSync('src/v4/design-system-v2.css','utf8');
          if(html.includes('id="fm-real-app-white-tone"'))throw new Error('white-first CSS must not return to inline HTML ownership');
          if(!design.includes('White-first Real App surface ownership'))throw new Error('white-first design-system ownership marker missing');
          if(!design.includes('FootMate Real App Visual Finish · P0–P2'))throw new Error('Real App finish ownership marker missing');
          if(html.includes('/src/v4/real-app-visual-finish.css'))throw new Error('Real App finish must not add a standalone stylesheet request');
          if(!design.includes('Visual Consistency v4')||!design.includes('--fm-v4-consistency:1'))throw new Error('visual consistency ownership missing');
          csstree.parse(design);
          console.log('PASS Real App CSS syntax and consolidated ownership');
          NODE
      - name: Check product completion JS syntax
        run: node --check src/v5/ai-match-assistant.js
      - name: Verify pinned browser image
        run: node -e "if (require('./package.json').qaToolchain.playwright !== '1.55.1') throw new Error('Update the Playwright container with qaToolchain.playwright')"
      - name: Compare Real App visual baselines and completion contracts
        run: npx playwright test tests/e2e/real-app-white-surface.spec.cjs tests/e2e/visual-consistency-v4.spec.cjs tests/e2e/priority-ux.spec.cjs tests/e2e/my-fresh-profile-containment.spec.cjs tests/e2e/welcome-position.spec.cjs tests/e2e/welcome-source-layout.spec.cjs tests/e2e/product-completion.spec.cjs tests/e2e/real-app-visual-finish.spec.cjs
      - name: Compare check-in states and layout
        run: npx playwright test --project=chromium tests/e2e/checkin-state.spec.cjs tests/e2e/v4-matchday.spec.cjs tests/e2e/v5.1-release-flow-review.spec.cjs tests/e2e/v5.1-visual-system-completion.spec.cjs --grep 'check-in|MY match hub visual regression|checked-in continuation action|1440px Matchday panel|1440px joined Schedule'
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-app-white-surface-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
