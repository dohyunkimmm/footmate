name: Real App White Surface QA
on:
  pull_request:
    branches: [main]
    paths:
      - app.html
      - src/v4/design-system-v2.css
      - src/v5/ai-match-assistant.js
      - src/v4/app.js
      - src/v4/decision.js
      - src/v4/recommendation.js
      - src/v4/platform/domain/recommendation.js
      - tests/e2e/real-app-white-surface.spec.cjs
      - tests/e2e/real-app-white-surface.spec.cjs-snapshots/**
      - tests/e2e/real-app-visual-finish.spec.cjs
      - tests/e2e/product-completion.spec.cjs
      - tests/e2e/product-completion.spec.cjs-snapshots/**
      - .github/workflows/real-app-white-surface-qa.yml
  push:
    branches: [main]
    paths:
      - app.html
      - src/v4/design-system-v2.css
      - src/v5/ai-match-assistant.js
      - src/v4/app.js
      - src/v4/decision.js
      - src/v4/recommendation.js
      - src/v4/platform/domain/recommendation.js
      - tests/e2e/real-app-white-surface.spec.cjs
      - tests/e2e/real-app-white-surface.spec.cjs-snapshots/**
      - tests/e2e/real-app-visual-finish.spec.cjs
      - tests/e2e/product-completion.spec.cjs
      - tests/e2e/product-completion.spec.cjs-snapshots/**
      - .github/workflows/real-app-white-surface-qa.yml
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" css-tree@3.1.0
      - name: Check Real App CSS syntax and performance budget
        run: |
          node scripts/check-v4.9-performance-budget.cjs
          node - <<'NODE'
          const fs=require('fs');
          const csstree=require('css-tree');
          const html=fs.readFileSync('app.html','utf8');
          const design=fs.readFileSync('src/v4/design-system-v2.css','utf8');
          if(html.includes('id="fm-real-app-white-tone"'))throw new Error('white-first CSS must not return to inline HTML ownership');
          if(!design.includes('White-first Real App surface ownership'))throw new Error('white-first design-system ownership marker missing');
          if(!design.includes('FootMate Real App Visual Finish · P0–P2'))throw new Error('Real App finish ownership marker missing');
          if(html.includes('/src/v4/real-app-visual-finish.css'))throw new Error('Real App finish must not add a standalone stylesheet request');
          csstree.parse(design);
          console.log('PASS Real App CSS syntax and consolidated ownership');
          NODE
      - name: Check product completion JS syntax
        run: node --check src/v5/ai-match-assistant.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Compare Real App visual baselines and completion contracts
        continue-on-error: ${{ hashFiles('.qa/approve-real-app-ia-baselines') != '' }}
        run: npx playwright test tests/e2e/real-app-white-surface.spec.cjs tests/e2e/product-completion.spec.cjs tests/e2e/real-app-visual-finish.spec.cjs
      - name: Commit inspected Real App IA baselines
        if: ${{ hashFiles('.qa/approve-real-app-ia-baselines') != '' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          copy_actual() {
            local name="$1" dest="$2" src
            src="$(find test-results -type f -name "$name" -print -quit)"
            test -n "$src"
            cp "$src" "$tmp/$name"
            printf '%s|%s\n' "$name" "$dest" >> "$tmp/map"
          }
          copy_actual product-completion-home-ia-390-actual.png tests/e2e/product-completion.spec.cjs-snapshots/product-completion-home-ia-390-chromium-linux.png
          copy_actual product-completion-discover-ia-390-actual.png tests/e2e/product-completion.spec.cjs-snapshots/product-completion-discover-ia-390-chromium-linux.png
          copy_actual product-completion-ai-fallback-ia-390-actual.png tests/e2e/product-completion.spec.cjs-snapshots/product-completion-ai-fallback-ia-390-chromium-linux.png
          copy_actual real-app-white-home-390-actual.png tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-home-390-chromium-linux.png
          copy_actual real-app-white-discover-390-actual.png tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-discover-390-chromium-linux.png
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" FETCH_HEAD
          while IFS='|' read -r name dest; do
            mkdir -p "$(dirname "$dest")"
            cp "$tmp/$name" "$dest"
          done < "$tmp/map"
          git checkout origin/main -- .github/workflows/real-app-white-surface-qa.yml
          rm -f .qa/approve-real-app-ia-baselines
          rmdir .qa 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/product-completion.spec.cjs-snapshots tests/e2e/real-app-white-surface.spec.cjs-snapshots .github/workflows/real-app-white-surface-qa.yml .qa || true
          git commit -m "test: approve Real App IA visual baselines"
          git push origin HEAD:"$HEAD_REF"
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-app-white-surface-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
