name: Real App White Surface QA
on:
  pull_request:
    branches: [main]
    paths:
      - app.html
      - src/v4/design-system-v2.css
      - src/v5/ai-match-assistant.js
      - src/v4/app.js
      - src/v4/personalization.js
      - src/v4/decision.js
      - src/v4/recommendation.js
      - src/v4/platform/domain/recommendation.js
      - tests/e2e/real-app-white-surface.spec.cjs
      - tests/e2e/real-app-white-surface.spec.cjs-snapshots/**
      - tests/e2e/real-app-visual-finish.spec.cjs
      - tests/e2e/product-completion.spec.cjs
      - tests/e2e/product-completion.spec.cjs-snapshots/**
      - tests/e2e/v4-personalization.spec.cjs-snapshots/**
      - .github/workflows/real-app-white-surface-qa.yml
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Check performance budget and syntax
        run: |
          node scripts/check-v4.9-performance-budget.cjs
          node --check src/v4/app.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh affected MY baseline and restore workflow
        shell: bash
        run: |
          npx playwright test --project=chromium --update-snapshots=all tests/e2e/v4-personalization.spec.cjs --grep "Real App MY aligns"
          git add tests/e2e/v4-personalization.spec.cjs-snapshots/real-app-my-personalization-390-chromium-linux.png
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/real-app-white-surface-qa.yml
          git add .github/workflows/real-app-white-surface-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: refresh Real App MY baseline [snapshot-generated]'
          git push origin HEAD:${{ github.head_ref }}