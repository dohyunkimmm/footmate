name: Real App White Surface QA
on:
  pull_request:
    branches: [main]
    paths:
      - app.html
      - src/v4/design-system-v2.css
      - src/v5/ai-match-assistant.js
      - src/v4/app.js
      - src/v4/personalization.js
      - src/v4/decision.js
      - src/v4/recommendation.js
      - src/v4/platform/domain/recommendation.js
      - tests/e2e/real-app-white-surface.spec.cjs
      - tests/e2e/real-app-white-surface.spec.cjs-snapshots/**
      - tests/e2e/real-app-visual-finish.spec.cjs
      - tests/e2e/product-completion.spec.cjs
      - tests/e2e/product-completion.spec.cjs-snapshots/**
      - scripts/rebase-real-app-shell-polish-once.cjs
      - .github/workflows/real-app-white-surface-qa.yml
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply current-main Real App shell polish
        run: node scripts/rebase-real-app-shell-polish-once.cjs
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" css-tree@3.1.0
      - name: Check Real App CSS and JS
        run: |
          node scripts/check-v4.9-performance-budget.cjs
          node --check src/v4/app.js
          node --check src/v5/ai-match-assistant.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate affected Ubuntu Chromium baselines once
        shell: bash
        run: |
          set +e
          npx playwright test --project=chromium --update-snapshots=all \
            tests/e2e/real-app-white-surface.spec.cjs \
            tests/e2e/product-completion.spec.cjs \
            tests/e2e/real-app-visual-finish.spec.cjs \
            tests/e2e/v5.1-decision-flow-polish.spec.cjs \
            tests/e2e/v5.1-visual-baseline.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs \
            tests/e2e/v5.1-design-system-v2.spec.cjs \
            tests/e2e/v5.1-release-flow-review.spec.cjs
          test_status=$?
          set -e
          git add -A
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/real-app-white-surface-qa.yml
          git rm -f scripts/rebase-real-app-shell-polish-once.cjs
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: rebase Real App shell polish onto current main [snapshots-generated]'
            git push origin HEAD:${{ github.head_ref }}
          fi
          exit "$test_status"
      - name: Compare Real App visual baselines and completion contracts
        run: npx playwright test tests/e2e/real-app-white-surface.spec.cjs tests/e2e/product-completion.spec.cjs tests/e2e/real-app-visual-finish.spec.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-app-white-surface-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14