name: Visual Consistency V4 Budget Contract Fix
on:
  push:
    branches: [design/visual-consistency-v4-20260928]
    paths:
      - .github/workflows/visual-consistency-v4-budget-contract-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/visual-consistency-v4-20260928
          fetch-depth: 0
      - name: Preserve versioned stylesheet within HTML budget
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='app.html';
          let html=fs.readFileSync(path,'utf8');
          html=html.replace('/src/v4/visual-consistency-v4.css"','/src/v4/visual-consistency-v4.css?v=1"');
          const marker='</head>';
          const index=html.indexOf(marker);
          if(index<0)throw new Error('head marker missing');
          const head=html.slice(0,index).replace(/>\n</g,'><');
          html=head+html.slice(index);
          fs.writeFileSync(path,html);
          const bytes=Buffer.byteLength(html);
          if(bytes>16000)throw new Error(`app.html remains over budget: ${bytes}`);
          if(!html.includes('/src/v4/visual-consistency-v4.css?v=1'))throw new Error('versioned visual consistency stylesheet missing');
          console.log(`app.html bytes: ${bytes}`);
          NODE
          node scripts/check-v4.9-performance-budget.cjs
      - name: Commit budget-safe versioned HTML and remove temporary workflow
        run: |
          rm .github/workflows/visual-consistency-v4-budget-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html .github/workflows/visual-consistency-v4-budget-contract-fix.yml
          git commit -m "perf: preserve versioned visual consistency asset within budget"
          git push origin HEAD:design/visual-consistency-v4-20260928
