name: Case study final cross-copy and worksheet QA
on:
  push:
    branches: [remove-rolling-forecast-content-20261108]
    paths:
      - '.github/workflows/validate-crosscopy-temp.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-rolling-forecast-content-20261108
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Validate edited case study on mobile and desktop
        run: npx playwright test --project=chromium tests/e2e/case-study-eleven-stages.spec.cjs
      - name: Confirm original workbook integrity and copy
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          from pathlib import Path
          import re
          path=Path('src/case-study/downloads/footmate_model.xlsx')
          N='{http://schemas.openxmlformats.org/spreadsheetml/2006/main}'
          C='{http://schemas.openxmlformats.org/drawingml/2006/chart}'
          with ZipFile(path) as x:
              assert x.testzip() is None
              workbook=ET.fromstring(x.read('xl/workbook.xml'))
              assert len(workbook.findall('.//'+N+'sheet'))==10
              summary=ET.fromstring(x.read('xl/worksheets/sheet1.xml'))
              kpis=ET.fromstring(x.read('xl/worksheets/sheet9.xml'))
              chart=ET.fromstring(x.read('xl/drawings/charts/chart1.xml'))
              assert len(chart.findall('.//'+C+'ser'))==2
              def cell(root,ref):
                  found=[c for c in root.iter(N+'c') if c.attrib.get('r')==ref]
                  assert len(found)==1,(ref,len(found))
                  return found[0]
              expected=[(summary,'C6','18681100'),(summary,'C7','-4840730'),(kpis,'B6','18681100'),(kpis,'B7','448300'),(kpis,'B8','-2806690')]
              for root,ref,want in expected:
                  value=cell(root,ref).find(N+'v')
                  assert value is not None and value.text==want,(ref,value.text if value is not None else None)
              for sheet in (summary,kpis):
                  assert not any(c.attrib.get('t')=='e' for c in sheet.iter(N+'c'))
              forbidden=re.compile(r'Rolling\s*Forecast|수정\s*전망|재예측',re.I)
              for name in x.namelist():
                  if name.endswith('.xml'):
                      assert not forbidden.search(x.read(name).decode('utf-8','replace')),name
          print('PASS: 10 workbook sheets, two chart series, linked scenario formulas, zero stale terms')
          PY
      - name: Recheck body-to-deck financial values
        run: python3 qa/crosscheck-case-study-presentations.py
