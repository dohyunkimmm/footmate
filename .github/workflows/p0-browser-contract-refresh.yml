name: P0 Browser Contract Refresh
on:
  push:
    branches: [design/visual-p0-finish-20260928]
    paths:
      - .github/workflows/p0-browser-contract-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned Playwright
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
      - name: Update P0 geometry contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements={
            'tests/e2e/v5.1-decision-flow-polish.spec.cjs':[
              ("  expect(app.width).toBeGreaterThanOrEqual(400);\n  expect(app.width).toBeLessThanOrEqual(404);","  expect(app.width).toBe(430);"),
              ("  expect(sticky.width).toBeGreaterThanOrEqual(376);\n  expect(sticky.width).toBeLessThanOrEqual(380);","  expect(sticky.width).toBeGreaterThanOrEqual(404);\n  expect(sticky.width).toBeLessThanOrEqual(408);"),
              ("  expect(submit.width).toBeGreaterThanOrEqual(358);\n  expect(submit.width).toBeLessThanOrEqual(362);","  expect(submit.width).toBeGreaterThanOrEqual(386);\n  expect(submit.width).toBeLessThanOrEqual(390);")
            ],
            'tests/e2e/v5.1-design-system-v2.spec.cjs':[
              ("  expect(geometry.width).toBeGreaterThanOrEqual(400);\n  expect(geometry.width).toBeLessThanOrEqual(404);","  expect(geometry.width).toBe(430);"),
              ("  expect(cardStyle.shadow).not.toBe('none');","  expect(cardStyle.shadow).toBe('none');"),
              ("  expect(navGeometry.width).toBeGreaterThanOrEqual(376);\n  expect(navGeometry.width).toBeLessThanOrEqual(380);","  expect(navGeometry.width).toBeGreaterThanOrEqual(404);\n  expect(navGeometry.width).toBeLessThanOrEqual(408);")
            ],
            'tests/e2e/v5.1-visual-system-completion.spec.cjs':[
              ("  expect(homeGeometry.appWidth).toBe(402);","  expect(homeGeometry.appWidth).toBe(430);")
            ]
          }
          for filename,pairs in replacements.items():
            path=Path(filename)
            text=path.read_text()
            for old,new in pairs:
              if old not in text:
                raise SystemExit(f'missing expected contract in {filename}: {old!r}')
              text=text.replace(old,new,1)
            path.write_text(text)
          PY
      - name: Generate intended P0 browser baselines
        run: |
          npx playwright test --project=chromium \
            tests/e2e/v5.1-decision-flow-polish.spec.cjs \
            tests/e2e/v5.1-design-system-v2.spec.cjs \
            tests/e2e/v5.1-release-flow-review.spec.cjs \
            tests/e2e/v5.1-visual-baseline.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs \
            --update-snapshots=all
      - name: Compare P0 browser baselines
        run: |
          npx playwright test --project=chromium \
            tests/e2e/v5.1-decision-flow-polish.spec.cjs \
            tests/e2e/v5.1-design-system-v2.spec.cjs \
            tests/e2e/v5.1-release-flow-review.spec.cjs \
            tests/e2e/v5.1-visual-baseline.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs
      - name: Commit P0 contract and baseline updates
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/e2e/v5.1-decision-flow-polish.spec.cjs \
            tests/e2e/v5.1-design-system-v2.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs \
            tests/e2e/v5.1-design-system-v2.spec.cjs-snapshots \
            tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots \
            tests/e2e/v5.1-visual-baseline.spec.cjs-snapshots \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'test: align browser baselines with P0 visual finish'
          git restore --worktree .
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
# one-shot generator; remove after the comparison-only pass and commit succeed
