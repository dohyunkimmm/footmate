name: Case Study Integrity Sync
on:
  push:
    branches: [chore/product-hardening-11-20]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/product-hardening-11-20
          fetch-depth: 0
      - name: Align Case Study integrity contract with current 13-section baseline
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='tests/e2e/v5.1-product-integrity.spec.cjs';
          let value=fs.readFileSync(file,'utf8');
          const before="await page.waitForFunction(()=>document.documentElement.dataset.footmateCaseStudyRelease==='5.2.0'&&document.querySelectorAll('.slide').length===16);\n  for(let index=1;index<16;index+=1){";
          const after="await page.waitForFunction(()=>document.documentElement.dataset.footmateCaseStudyRelease==='5.1.1'&&document.querySelectorAll('.slide').length===13);\n  for(let index=1;index<13;index+=1){";
          if(!value.includes(before))throw new Error('stale Case Study integrity contract not found');
          value=value.replace(before,after);
          fs.writeFileSync(file,value);
          NODE
          git diff --check
      - name: Commit Case Study integrity sync
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/v5.1-product-integrity.spec.cjs
          git commit -m "test: restore current Case Study integrity baseline"
          git push origin HEAD:chore/product-hardening-11-20
