name: Refresh PR226 Case Study Baselines

on:
  push:
    branches:
      - fix/case-study-section-labels-en
    paths:
      - .github/workflows/refresh-pr226-case-study-baselines.yml

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/case-study-section-labels-en
          fetch-depth: 0

      - name: Download approved failed-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35851707867 -n v5.3-browser-e2e-35851707867 -D /tmp/qa226

      - name: Verify deterministic actuals and refresh 24 baselines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil, sys

          root=Path('/tmp/qa226/test-results/playwright')
          target=Path('tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots')
          first={}
          retry={}
          for d in root.iterdir():
              if not d.is_dir():
                  continue
              bucket=retry if '-retry1' in d.name else first
              for p in d.glob('case-study-*-actual.png'):
                  bucket[p.name]=p

          if len(first)!=24 or len(retry)!=24 or set(first)!=set(retry):
              raise SystemExit(f'expected 24 deterministic pairs, got first={len(first)} retry={len(retry)}')

          for name in sorted(first):
              digest=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
              if digest(first[name]) != digest(retry[name]):
                  raise SystemExit(f'non-deterministic screenshot: {name}')
              snapshot=name.replace('-actual.png','-chromium-linux.png')
              dest=target/snapshot
              if not dest.exists():
                  raise SystemExit(f'missing approved snapshot path: {dest}')
              shutil.copy2(first[name],dest)
              print(snapshot)
          PY

      - name: Commit baselines and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-pr226-case-study-baselines.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots .github/workflows/refresh-pr226-case-study-baselines.yml
          test "$(git diff --cached --name-only | grep -c '^tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/.*\.png$')" -eq 24
          git commit -m "test: refresh section label visual baselines"
          git push origin HEAD:fix/case-study-section-labels-en
