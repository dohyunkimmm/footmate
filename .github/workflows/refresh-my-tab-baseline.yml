name: Refresh MY Tab Baseline
on:
  push:
    branches: [fix/my-tab-layout-20260926]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/my-tab-layout-20260926
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" @axe-core/playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh MY screenshot baseline
        run: npx playwright test tests/e2e/my-tab-layout-regression.spec.cjs --update-snapshots
      - name: Commit refreshed baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/my-tab-layout-regression.spec.cjs-snapshots
          if git diff --cached --quiet; then
            echo "No baseline changes"
          else
            git commit -m "test: add MY tab visual baseline"
            git push origin HEAD:fix/my-tab-layout-20260926
          fi
