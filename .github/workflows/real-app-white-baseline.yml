name: Generate Real App White Surface Baselines
on:
  push:
    branches: [ui/real-app-white-surface-completion]
    paths:
      - app.html
      - tests/e2e/real-app-white-surface.spec.cjs
      - .github/workflows/real-app-white-baseline.yml
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate affected Product baselines
        run: npx playwright test tests/e2e/v5.1-visual-baseline.spec.cjs tests/e2e/v5.1-visual-system-completion.spec.cjs tests/e2e/real-app-white-surface.spec.cjs --update-snapshots
      - name: Commit changed baselines
        run: |
          git status --short
          git add tests/e2e/*-snapshots/*.png
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: update white-first Product visual baselines"
          git push
