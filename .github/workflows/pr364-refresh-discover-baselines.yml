name: PR 364 Discover Baseline Refresh

on:
  push:
    branches:
      - polish/discover-filter-icon-20260927
    paths:
      - .github/workflows/pr364-refresh-discover-baselines.yml

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[baseline-updated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/discover-filter-icon-20260927
          fetch-depth: 1
      - name: Download verified Chromium evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 36284486044 -n v5.3-browser-e2e-36284486044 -D /tmp/pr364-evidence
      - name: Refresh only intentionally changed Discover baselines
        run: |
          set -euo pipefail
          SNAP=tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots
          cp "$(find /tmp/pr364-evidence -name 'visual-system-discover-1440-actual.png' -print -quit)" "$SNAP/visual-system-discover-1440-chromium-linux.png"
          cp "$(find /tmp/pr364-evidence -name 'visual-system-discover-390-actual.png' -print -quit)" "$SNAP/visual-system-discover-390-chromium-linux.png"
          for width in 320 375 390 430; do
            cp "$(find /tmp/pr364-evidence -name "product-density-discover-${width}-actual.png" -print -quit)" "$SNAP/product-density-discover-${width}-chromium-linux.png"
          done
          git add "$SNAP"
          git diff --cached --stat
      - name: Commit refreshed baselines
        run: |
          if git diff --cached --quiet; then
            echo 'No baseline changes to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'test: refresh discover filter visual baselines [baseline-updated]'
          git push origin HEAD:polish/discover-filter-icon-20260927
