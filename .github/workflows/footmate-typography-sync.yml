name: FootMate one-time typography and preview sync
on:
  push:
    branches:
      - polish/footmate-copy-decks-20261109
    paths:
      - qa/polish-footmate-presentations-20261109.py
      - .github/workflows/footmate-typography-sync.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'dohyunkimmm/footmate'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install slide editing and rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-noto-cjk fonts-nanum
          python -m pip install --disable-pip-version-check python-pptx==1.0.2
      - name: Refresh deck copy, typography and corresponding previews
        run: python qa/polish-footmate-presentations-20261109.py
      - name: Verify body and all 15 editable slides
        run: python qa/crosscheck-case-study-presentations.py
      - name: Commit matching slide decks and preview images to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/case-study/downloads/footmate_report.pptx \
            src/case-study/downloads/footmate_5year_strategy.pptx \
            src/case-study/report-previews.js src/case-study/previews/strategy/
          if ! git diff --cached --quiet; then
            git commit -m "assets: sync presentation branding and rendered previews"
            git push origin "HEAD:polish/footmate-copy-decks-20261109"
          fi
