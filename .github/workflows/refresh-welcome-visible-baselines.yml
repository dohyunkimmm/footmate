name: Refresh Welcome Visible Baselines
on:
  push:
    branches: [fix/welcome-visible-shift-20260926]
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[welcome-baseline]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/welcome-visible-shift-20260926
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Refresh Welcome screenshots
        run: npx playwright test tests/e2e/real-app-white-surface.spec.cjs --update-snapshots
      - name: Commit refreshed Welcome baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-welcome-390-chromium-linux.png tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-personalized-welcome-390-chromium-linux.png
          if git diff --cached --quiet; then
            echo "No baseline changes"
            exit 0
          fi
          git commit -m "test: refresh Welcome visible baselines [welcome-baseline]"
          git push origin HEAD:fix/welcome-visible-shift-20260926
