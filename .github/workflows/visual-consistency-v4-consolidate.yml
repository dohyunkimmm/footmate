name: Visual Consistency V4 Consolidate
on:
  push:
    branches: [design/visual-consistency-v4-20260928]
    paths:
      - .github/workflows/visual-consistency-v4-consolidate.yml
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/visual-consistency-v4-20260928
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Consolidate real app consistency assets
        run: |
          node - <<'NODE'
          const fs=require('fs');
          let html=fs.readFileSync('app.html','utf8');
          html=html.replace('/src/v4/visual-consistency-v4.css"','/src/v4/visual-consistency-v4.css?v=1"');
          const marker='</head>',index=html.indexOf(marker);
          if(index<0)throw new Error('head marker missing');
          html=html.slice(0,index).replace(/>\n</g,'><')+html.slice(index);
          fs.writeFileSync('app.html',html);
          let bootstrap=fs.readFileSync('src/v4/platform/presentation/bootstrap.js','utf8');
          bootstrap=bootstrap.replace(/const compatibilityStyle=document\.createElement\('link'\);\ncompatibilityStyle\.rel='stylesheet';\ncompatibilityStyle\.href='\/src\/v4\/visual-consistency-v4-compat\.css\?v=1';\ncompatibilityStyle\.dataset\.visualConsistencyV4Compat='true';\ndocument\.head\.appendChild\(compatibilityStyle\);\n\n/,'');
          if(bootstrap.includes('visual-consistency-v4-compat'))throw new Error('compat loader still present');
          fs.writeFileSync('src/v4/platform/presentation/bootstrap.js',bootstrap);
          const bytes=Buffer.byteLength(html);
          if(bytes>16000)throw new Error(`app.html over budget: ${bytes}`);
          if(!html.includes('/src/v4/visual-consistency-v4.css?v=1'))throw new Error('versioned stylesheet missing');
          console.log(`app.html bytes: ${bytes}`);
          NODE
          rm src/v4/visual-consistency-v4-compat.css
          rm .github/workflows/visual-consistency-v4-budget-contract-fix.yml
          npm install --no-save --ignore-scripts css-tree@3.1.0
          node - <<'NODE'
          const fs=require('fs'),csstree=require('css-tree');
          const css=fs.readFileSync('src/v4/visual-consistency-v4.css','utf8');
          if(!css.includes('Visual Consistency v4'))throw new Error('ownership marker missing');
          csstree.parse(css);
          console.log('PASS consolidated visual consistency CSS syntax',Buffer.byteLength(css));
          NODE
          node scripts/check-v4.9-performance-budget.cjs
      - name: Commit consolidated implementation
        run: |
          rm .github/workflows/visual-consistency-v4-consolidate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: consolidate visual consistency overrides within budget"
          git push origin HEAD:design/visual-consistency-v4-20260928
