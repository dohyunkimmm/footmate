name: P1 Checkout Baseline Refresh
on:
  push:
    branches: [polish/p1-decision-clarity-20260928]
    paths:
      - .github/workflows/p1-checkout-baseline-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/p1-decision-clarity-20260928
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Refresh Checkout 1440 baseline only
        run: npx playwright test --project=chromium tests/e2e/v5.1-visual-baseline.spec.cjs --grep '1440px Checkout matches the approved desktop visual baseline' --update-snapshots
      - name: Commit refreshed baseline
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/v5.1-visual-baseline.spec.cjs-snapshots/real-app-checkout-1440-chromium-linux.png
          git diff --cached --quiet && exit 0
          git commit -m 'test: refresh P1 Checkout visual baseline'
          git push origin HEAD:polish/p1-decision-clarity-20260928
