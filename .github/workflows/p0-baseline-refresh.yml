name: P0 Baseline Refresh
on:
  push:
    branches: [design/visual-p0-finish-20260928]
    paths:
      - .github/workflows/p0-baseline-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Generate intended P0 baselines in pinned Chromium
        run: |
          npx playwright test --project=chromium \
            tests/e2e/real-app-white-surface.spec.cjs \
            tests/e2e/visual-consistency-v4.spec.cjs \
            tests/e2e/visual-p0-finish.spec.cjs \
            tests/e2e/product-completion.spec.cjs \
            tests/e2e/real-app-visual-finish.spec.cjs \
            tests/e2e/priority-ux.spec.cjs \
            tests/e2e/my-fresh-profile-containment.spec.cjs \
            tests/e2e/welcome-position.spec.cjs \
            tests/e2e/welcome-source-layout.spec.cjs \
            --update-snapshots=all
          git status --short
          UNEXPECTED="$(git status --porcelain | grep -vE '^( M|M |A |\?\?) tests/e2e/.*-snapshots/.*\.png$' || true)"
          test -z "$UNEXPECTED"
      - name: Commit generated P0 baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/*-snapshots/*.png
          git diff --cached --quiet && { echo 'No baseline changes generated'; exit 1; }
          git commit -m 'test: refresh P0 visual baselines'
          git push origin HEAD:${{ github.ref_name }}
# one-shot generator; removed before merge
