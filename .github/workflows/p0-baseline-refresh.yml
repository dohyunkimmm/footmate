name: P0 Baseline Refresh
on:
  push:
    branches: [design/visual-p0-finish-20260928]
    paths:
      - .github/workflows/p0-baseline-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Generate intended P0 baselines in pinned Chromium
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          npx playwright test --project=chromium \
            tests/e2e/real-app-white-surface.spec.cjs \
            tests/e2e/visual-consistency-v4.spec.cjs \
            tests/e2e/visual-p0-finish.spec.cjs \
            tests/e2e/product-completion.spec.cjs \
            tests/e2e/real-app-visual-finish.spec.cjs \
            tests/e2e/priority-ux.spec.cjs \
            tests/e2e/my-fresh-profile-containment.spec.cjs \
            tests/e2e/welcome-position.spec.cjs \
            tests/e2e/welcome-source-layout.spec.cjs \
            --update-snapshots=all
          git restore --source=HEAD -- \
            tests/e2e/priority-ux.spec.cjs-snapshots/priority-ai-filter-390-chromium-linux.png \
            tests/e2e/product-completion.spec.cjs-snapshots/product-completion-discover-ia-390-chromium-linux.png \
            tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-discover-390-chromium-linux.png \
            tests/e2e/visual-consistency-v4.spec.cjs-snapshots/visual-consistency-success-390-chromium-linux.png \
            tests/e2e/visual-consistency-v4.spec.cjs-snapshots/visual-consistency-participation-failure-390-chromium-linux.png
          git status --short --untracked-files=all
      - name: Commit approved P0 baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/e2e/product-completion.spec.cjs-snapshots/product-completion-home-ia-390-chromium-linux.png \
            tests/e2e/product-completion.spec.cjs-snapshots/product-completion-ai-fallback-ia-390-chromium-linux.png \
            tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-home-390-chromium-linux.png \
            tests/e2e/visual-consistency-v4.spec.cjs-snapshots/visual-consistency-checkout-390-chromium-linux.png \
            tests/e2e/visual-p0-finish.spec.cjs-snapshots/visual-p0-shell-699-chromium-linux.png \
            tests/e2e/visual-p0-finish.spec.cjs-snapshots/visual-p0-shell-700-chromium-linux.png
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git commit -m 'test: refresh P0 visual baselines'
          git push origin HEAD:${{ github.ref_name }}
# one-shot generator; commit only P0-affected baselines, then remove before merge
