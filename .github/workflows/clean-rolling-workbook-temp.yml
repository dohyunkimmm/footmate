name: Clean Rolling Forecast workbook scenario
on:
  push:
    branches: [remove-rolling-forecast-content-20261108]
permissions:
  contents: write
jobs:
  clean:
    if: "!contains(github.event.head_commit.message, '[workbook-clean]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-rolling-forecast-content-20261108
          persist-credentials: true
      - name: Remove obsolete rolling scenario and keep plan vs synthetic comparison
        run: |
          python - <<'PY'
          import os, re, tempfile, copy, zipfile
          from xml.etree import ElementTree as ET
          path='src/case-study/downloads/footmate_model.xlsx'
          m='{http://schemas.openxmlformats.org/spreadsheetml/2006/main}'
          c='{http://schemas.openxmlformats.org/drawingml/2006/chart}'
          with zipfile.ZipFile(path) as source:
              parts={x.filename:source.read(x.filename) for x in source.infolist()}
              infos=source.infolist()
          names=['xl/worksheets/sheet1.xml','xl/worksheets/sheet3.xml','xl/worksheets/sheet9.xml','xl/drawings/charts/chart1.xml']
          roots={name:ET.fromstring(parts[name]) for name in names}
          def cells(root):
              return {node.attrib['r']:node for node in root.iter(m+'c')}
          def val(cell):
              node=cell.find(m+'v')
              return node.text if node is not None else None
          def cell_str(cell,text):
              if cell.get('t')=='inlineStr':
                  t=cell.find(m+'is/'+m+'t')
                  assert t is not None
                  t.text=text
              else:
                  v=cell.find(m+'v')
                  assert v is not None
                  v.text=text
                  cell.set('t','str')
          def calc(cell,formula,value):
              f=cell.find(m+'f')
              v=cell.find(m+'v')
              assert f is not None and v is not None,cell.attrib.get('r')
              f.text=formula
              v.text=str(value)
          def remove_cell(root,ref):
              for row in root.iter(m+'row'):
                  for node in row:
                      if node.tag==m+'c' and node.attrib.get('r')==ref:
                          row.remove(node)
                          return
          monthly=roots['xl/worksheets/sheet3.xml']
          monthly_cells=cells(monthly)
          values={}
          for row in range(6,18):
              values[row]=(val(monthly_cells[f'P{row}']),val(monthly_cells[f'Q{row}']))
              assert all(x is not None for x in values[row])
          for row in range(5,18):
              for dest,src in [('N','P'),('O','Q')]:
                  dst=monthly_cells[f'{dest}{row}']
                  origin=monthly_cells[f'{src}{row}']
                  style=dst.get('s')
                  dst.attrib.clear()
                  dst.attrib.update(origin.attrib)
                  dst.set('r',f'{dest}{row}')
                  if style is not None:dst.set('s',style)
                  dst[:]=[copy.deepcopy(child) for child in origin]
                  remove_cell(monthly,f'{src}{row}')
          monthly_cells=cells(monthly)
          cell_str(monthly_cells['A2'],'월별 계획·가상 실적·손익 차이 분석')
          cell_str(monthly_cells['N5'],'연중 가상매출')
          cell_str(monthly_cells['O5'],'연중 가상손익')
          dim=monthly.find(m+'dimension')
          if dim is not None and dim.get('ref','').endswith('Q17'):
              dim.set('ref',dim.get('ref').replace('Q17','O17'))
          for col in monthly.findall('.//'+m+'cols/'+m+'col'):
              if int(col.get('min','0'))>=16:
                  parent=monthly.find(m+'cols')
                  parent.remove(col)
          management=roots['xl/worksheets/sheet1.xml']
          management_cells=cells(management)
          cell_str(management_cells['C5'],'연중 가상 비용 추세')
          cell_str(management_cells['C15'],'가상 수수료')
          calc(management_cells['C6'],"SUM('월별손익'!N6:N17)",18681100)
          calc(management_cells['C7'],"SUM('월별손익'!O6:O17)",-4840730)
          calc(management_cells['C8'],"C7-12*'가정'!B14",-28840730)
          for row in range(16,28):
              value=values[row-10][0]
              assert value is not None
              calc(management_cells[f'C{row}'],f"'월별손익'!N{row-10}",value)
          for ref in list(management_cells):
              if re.fullmatch(r'D[0-9]+',ref):remove_cell(management,ref)
          dim=management.find(m+'dimension')
          if dim is not None and dim.get('ref','').endswith('D27'):
              dim.set('ref',dim.get('ref').replace('D27','C27'))
          for col in management.findall('.//'+m+'cols/'+m+'col'):
              if int(col.get('min','0'))>=4:
                  management.find(m+'cols').remove(col)
          strategy=roots['xl/worksheets/sheet9.xml']
          strategy_cells=cells(strategy)
          replacements={
              'A2':'연간 계획·가상 거래·중장기 전략 목표를 구분해 관리',
              'A6':'2027년 가상 수수료 매출(원)',
              'A7':'2027년 가상 매출 계획 대비 차이(원)',
              'A8':'2027년 가상 운영손익 차이(원)',
              'D7':'연중 가상 거래와 계획 비교'
          }
          for address,text in replacements.items():
              cell_str(strategy_cells[address],text)
          for address,value in [('B6',18681100),('B7',448300),('B8',-2806690)]:
              v=strategy_cells[address].find(m+'v')
              assert v is not None,address
              v.text=str(value)
          chart=roots['xl/drawings/charts/chart1.xml']
          ser=chart.findall('.//'+c+'ser')
          assert len(ser)==2,len(ser)
          legend=ser[1].find(c+'tx/'+c+'v')
          assert legend is not None
          legend.text='가상 수수료'
          cache=ser[1].find(c+'val/'+c+'numRef/'+c+'numCache')
          assert cache is not None,'series value cache missing'
          pts=cache.findall(c+'pt')
          assert len(pts)==12,len(pts)
          for pt in pts:
              idx=int(pt.attrib['idx'])
              pt.find(c+'v').text=str(values[idx+6][0])
          for name,root in roots.items():
              parts[name]=ET.tostring(root,encoding='utf-8',xml_declaration=True)
          forbidden=re.compile(r'Rolling\s*Forecast|수정\s?전망|재예측|분기\s?전망',re.I)
          for name,data in parts.items():
              if name.endswith('.xml'):
                  txt=data.decode('utf-8','replace')
                  assert not forbidden.search(txt),(name,'obsolete forecast label')
          for name,data in parts.items():
              if not name.startswith('xl/worksheets/sheet') or not name.endswith('.xml'):continue
              root=ET.fromstring(data)
              errors=[c.attrib['r'] for c in root.iter(m+'c') if c.get('t')=='e']
              assert not errors,(name,errors[:10])
          with tempfile.NamedTemporaryFile(dir=os.path.dirname(path),suffix='.xlsx',delete=False) as tmp:
              output=tmp.name
          with zipfile.ZipFile(output,'w') as dest:
              for info in infos:
                  dest.writestr(info,parts[info.filename])
          with zipfile.ZipFile(output) as workbook:
              assert workbook.testzip() is None
          os.replace(output,path)
          print('PASS: workbook cleaned; original 10 sheets preserved, all-year synthetic scenario moved into C and N/O, chart cache updated, zero obsolete labels')
          PY
      - name: Commit updated workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/case-study/downloads/footmate_model.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "asset: remove rolling scenario from original workbook and chart [workbook-clean]"
            git push origin HEAD:remove-rolling-forecast-content-20261108
          fi
