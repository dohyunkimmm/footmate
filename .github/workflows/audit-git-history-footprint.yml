name: Audit Git history footprint (read only)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/audit-git-history-footprint.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-git-history-footprint.yml
  workflow_dispatch:
    inputs:
      make_temporary_bundle:
        description: 'Create a 7-day Git bundle artifact for off-GitHub download (no ref deletion)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  profile:
    if: github.repository == 'dohyunkimmm/footmate' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and verify the current remote branch inventory
        shell: bash
        run: |
          set -euo pipefail
          d=verification/git-history-footprint
          mkdir -p "$d"
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git rev-parse --verify refs/remotes/origin/main
          git ls-remote --heads origin |
            awk '{sub(/^refs\/heads\//,"",$2); print $1 "\t" $2}' |
            LC_ALL=C sort > "$d/remote-heads.tsv"
          git for-each-ref --format='%(objectname)%09%(refname:lstrip=3)' refs/remotes/origin |
            awk -F '\t' '$2 != "HEAD"' |
            LC_ALL=C sort > "$d/fetched-heads.tsv"
          test -s "$d/remote-heads.tsv"
          if ! diff -u "$d/remote-heads.tsv" "$d/fetched-heads.tsv"; then
            echo "::error::Fetched branch refs differ from remote. Retry the read-only audit."
            exit 1
          fi
          echo "Verified $(wc -l < "$d/remote-heads.tsv") current remote refs."

      - name: Profile reachable history without garbage collection
        shell: bash
        run: |
          set -euo pipefail
          d=verification/git-history-footprint
          mkdir -p "$d"
          git count-objects -v > "$d/count-objects.txt"
          git rev-list --objects --all | awk '{print $1}' | sort -u > "$d/all-object-ids.txt"
          git rev-list --objects refs/remotes/origin/main | awk '{print $1}' | sort -u > "$d/main-object-ids.txt"
          comm -23 "$d/all-object-ids.txt" "$d/main-object-ids.txt" > "$d/outside-main-object-ids.txt"

          git rev-list --objects --all |
            git cat-file --batch-check='%(objectname) %(objecttype) %(objectsize) %(objectsize:disk) %(rest)' |
            awk '$2=="blob" {sha=$1; raw=$3; disk=$4; $1=$2=$3=$4=""; sub(/^ +/,""); gsub(/\t/," "); printf "%s\t%s\t%s\t%s\n",sha,raw,disk,$0}' |
            sort -t "$(printf '\t')" -k2,2nr > "$d/blobs-by-size-all.tsv"
          {
            printf 'sha\tuncompressed_bytes\tpack_entry_bytes\tpossible_historical_path\n'
            sed -n '1,100p' "$d/blobs-by-size-all.tsv"
          } > "$d/top-100-historical-blobs.tsv"

          git cat-file --batch-check='%(objecttype) %(objectsize)' < "$d/outside-main-object-ids.txt" |
            awk '{total++; if($1=="blob"){blobs++; raw+=$2}} END{printf "outside_main_reachable_objects=%d\noutside_main_blobs=%d\noutside_main_blobs_uncompressed_bytes=%.0f\n",total,blobs,raw}' > "$d/outside-main-summary.txt"
          printf 'all_reachable_objects=%s\n' "$(wc -l < "$d/all-object-ids.txt")" > "$d/reachability-counts.txt"
          printf 'main_reachable_objects=%s\n' "$(wc -l < "$d/main-object-ids.txt")" >> "$d/reachability-counts.txt"
          cat "$d/outside-main-summary.txt" >> "$d/reachability-counts.txt"

          echo '### Read-only history footprint (NOT reclaimable bytes)' >> "$GITHUB_STEP_SUMMARY"
          cat "$d/reachability-counts.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Pack sizes and historical blob sizes are not an estimate of GitHub storage that deletion would reclaim. No refs, Git objects or main history were modified.' >> "$GITHUB_STEP_SUMMARY"

      - name: Snapshot and verify current remote branch tip SHAs
        shell: bash
        run: |
          set -euo pipefail
          d=verification/git-history-footprint
          f="$d/branch-refs.tsv"
          printf 'branch\texpected_sha\tactual_sha\tunchanged\n' > "$f"
          while IFS=$'\t' read -r expected branch; do
            actual="$(git rev-parse --verify "refs/remotes/origin/$branch^{commit}")"
            status=false
            if [ "$actual" = "$expected" ]; then status=true; fi
            printf '%s\t%s\t%s\t%s\n' "$branch" "$expected" "$actual" "$status" >> "$f"
            if [ "$status" != true ]; then
              echo "::error::Remote branch changed during audit: $branch"; exit 1
            fi
          done < "$d/remote-heads.tsv"
          echo "Recorded $(($(wc -l < "$f")-1)) remote tips for reproducible review."

      - name: Upload reproducible read-only audit
        uses: actions/upload-artifact@v6
        with:
          name: git-history-footprint
          path: |
            verification/git-history-footprint/count-objects.txt
            verification/git-history-footprint/reachability-counts.txt
            verification/git-history-footprint/top-100-historical-blobs.tsv
            verification/git-history-footprint/branch-refs.tsv
            verification/git-history-footprint/remote-heads.tsv
            verification/git-history-footprint/fetched-heads.tsv
          retention-days: 30

      - name: Create self-contained temporary Git bundle when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.make_temporary_bundle == true
        shell: bash
        run: |
          set -euo pipefail
          d=verification/git-history-footprint
          git bundle create "$d/footmate-all-refs.bundle" --all
          git bundle verify "$d/footmate-all-refs.bundle" > "$d/bundle-verification.txt" 2>&1
          git bundle list-heads "$d/footmate-all-refs.bundle" > "$d/bundle-heads.txt"
          while IFS=
          echo 'Temporary bundle verified. Download and retain it outside GitHub before considering any ref deletion.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload temporary bundle (not an off-repository backup)
        if: github.event_name == 'workflow_dispatch' && inputs.make_temporary_bundle == true
        uses: actions/upload-artifact@v6
        with:
          name: git-history-bundle-download-off-github
          path: |
            verification/git-history-footprint/footmate-all-refs.bundle
            verification/git-history-footprint/bundle-verification.txt
            verification/git-history-footprint/bundle-heads.txt
          if-no-files-found: error
          retention-days: 7
\t' read -r branch expected actual unchanged; do
            if ! awk -v sha="$expected" -v ref="refs/remotes/origin/$branch" \
              '$1 == sha && $2 == ref { found=1; exit } END { exit !found }' "$d/bundle-heads.txt"; then
              echo "::error::Missing remote branch tip from bundle: $branch ($expected)"; exit 1
            fi
          done < <(tail -n +2 "$d/branch-refs.tsv")
          echo 'Temporary bundle verified. Download and retain it outside GitHub before considering any ref deletion.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload temporary bundle (not an off-repository backup)
        if: github.event_name == 'workflow_dispatch' && inputs.make_temporary_bundle == true
        uses: actions/upload-artifact@v6
        with:
          name: git-history-bundle-download-off-github
          path: |
            verification/git-history-footprint/footmate-all-refs.bundle
            verification/git-history-footprint/bundle-verification.txt
            verification/git-history-footprint/bundle-heads.txt
          if-no-files-found: error
          retention-days: 7
