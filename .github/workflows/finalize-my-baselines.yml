name: Finalize MY visual baselines

on:
  push:
    branches:
      - fix/my-profile-shell-overflow-20260926

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[finalize-my-baselines]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/my-profile-shell-overflow-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Chromium QA
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
          npx playwright install --with-deps chromium
      - name: Refresh final MY baselines
        run: |
          npx playwright test --project=chromium tests/e2e/v5.1-design-system-v2.spec.cjs --grep "1440px Profile personalization" --update-snapshots
          npx playwright test --project=chromium tests/e2e/v5.1-visual-system-completion.spec.cjs --grep "1440px Schedule empty and Profile" --update-snapshots
      - name: Compare final MY baselines
        run: |
          npx playwright test --project=chromium tests/e2e/v5.1-design-system-v2.spec.cjs --grep "1440px Profile personalization"
          npx playwright test --project=chromium tests/e2e/v5.1-visual-system-completion.spec.cjs --grep "1440px Schedule empty and Profile"
      - name: Commit approved final baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-design-system-v2.spec.cjs-snapshots/design-system-v2-personalization-1440-chromium-linux.png
          git add tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-profile-1440-chromium-linux.png
          git rm .github/workflows/finalize-my-baselines.yml
          git commit -m "test: approve contained MY visual baselines"
          git push origin HEAD:fix/my-profile-shell-overflow-20260926
