name: Update MY visual baselines

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-my-snapshots:
    if: github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.head.sha, '0000000')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Update only MY-related screenshot baselines
        run: |
          npx playwright test \
            tests/e2e/my-fresh-profile-containment.spec.cjs \
            tests/e2e/v4-personalization.spec.cjs \
            tests/e2e/v5.1-design-system-v2.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs \
            --grep "fresh MY guidance stays inside|fresh Real App MY keeps requested|Real App MY aligns|1440px Profile personalization|1440px Schedule empty and Profile" \
            --update-snapshots
      - name: Commit changed MY baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/*-snapshots/*.png
          if git diff --cached --quiet; then
            echo "No baseline changes"
            exit 0
          fi
          git commit -m "test: update MY visual regression baselines"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
