name: Temporary Home Visual System Baseline Refresh
on:
  push:
    branches: [fix/home-card-match-discover-20260927]
    paths:
      - .github/workflows/tmp-refresh-home-visual-system-baselines.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh intentional Home visual-system baselines
        run: >-
          npx playwright test --project=chromium
          tests/e2e/v5.1-visual-system-completion.spec.cjs
          --grep "1440px Home and Discover match the completed visual hierarchy|390px Home keeps the decision flow compact before the match list|320px home keeps matches scrollable above shell navigation and retains readable controls|375px home keeps matches scrollable above shell navigation and retains readable controls|390px home keeps matches scrollable above shell navigation and retains readable controls|430px home keeps matches scrollable above shell navigation and retains readable controls|430px discover keeps matches scrollable above shell navigation and retains readable controls"
          --update-snapshots
      - name: Commit refreshed Ubuntu Chromium baselines and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tmp-refresh-home-visual-system-baselines.yml
          git add -A \
            .github/workflows/tmp-refresh-home-visual-system-baselines.yml \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-home-1440-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-home-390-full-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-320-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-375-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-390-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-430-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-discover-430-chromium-linux.png
          git commit -m "test: refresh unified Home visual-system baselines"
          git push origin HEAD:fix/home-card-match-discover-20260927
