name: Product Visual Audit Patch

on:
  push:
    branches:
      - fix/product-visual-audit-20260923

permissions:
  contents: write

jobs:
  patch-and-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply audited Product corrections and coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ds_path = Path('src/v4/design-system-v2.css')
          ds = ds_path.read_text(encoding='utf-8')
          old = '''.fm-next-page[data-mode="real"] .fm-next-screen{
            color:var(--fm-ds-text-strong);
            font-size:var(--fm-ds-type-body);
            line-height:var(--fm-ds-leading-body);
          }
          '''
          new = old + '''.fm-next-page[data-mode="real"] .fm-next-screen--intro{
            color:#fff;
          }
          .fm-next-page[data-mode="real"] .fm-next-screen--intro .fm-next-intro h1{
            color:#fff;
          }
          '''
          if old not in ds:
              raise SystemExit('design-system intro anchor not found')
          ds = ds.replace(old, new, 1)
          replacements = {
              'width:min(calc(100% - 72px),1040px);': 'width:min(100%,560px);',
              '.fm-next-page[data-mode="real"] .fm-next-screen{padding-inline:32px}': '.fm-next-page[data-mode="real"] .fm-next-screen{padding-inline:20px}',
              '.fm-next-page[data-mode="real"] .fm-next-topbar{margin-inline:-32px;padding-inline:32px}': '.fm-next-page[data-mode="real"] .fm-next-topbar{margin-inline:-20px;padding-inline:20px}',
              'width:min(100%,var(--fm-ds-content-max));\n    margin-inline:auto;': 'width:auto;\n    margin-inline:0;',
              'grid-template-columns:repeat(2,minmax(0,1fr));\n    gap:18px;': 'grid-template-columns:minmax(0,1fr);\n    gap:12px;'
          }
          for source, target in replacements.items():
              if source not in ds:
                  raise SystemExit(f'design-system desktop anchor not found: {source}')
              ds = ds.replace(source, target, 1)
          density = '''
          /* Product visual audit: keep Home decision density compact without removing AI capability. */
          .fm-next-page[data-mode="real"] [data-screen="home"] .fm-next-greeting{
            padding:20px 0 6px;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"] .fm-next-greeting h1{
            font-size:29px;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"] .fm-next-context-card{
            margin:12px 0 16px;
            padding:18px;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"] .fm-next-context-card h2{
            margin-bottom:6px;
            font-size:21px;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"] .fm-next-context-card p{
            font-size:12px;
            line-height:1.55;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"] .fm-next-context-actions{
            margin-top:13px;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"] .fm-next-context-actions .fm-next-button{
            min-height:44px;
            padding-inline:14px;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"]>.fm-ai-card.fm-ai-card--core{
            margin:12px 0 16px;
            padding:16px;
            border-width:1px;
            box-shadow:0 12px 30px rgba(9,46,33,.10);
          }
          .fm-next-page[data-mode="real"] [data-screen="home"]>.fm-ai-card--core .fm-ai-core-label{
            margin:0 0 10px;
            padding:6px 8px;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"]>.fm-ai-card--core .fm-ai-head>div{
            margin-bottom:6px;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"]>.fm-ai-card--core .fm-ai-head strong{
            margin-top:4px;
            margin-bottom:5px;
            font-size:20px;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"]>.fm-ai-card--core .fm-ai-head p{
            font-size:12px;
            line-height:1.5;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"]>.fm-ai-card--core .fm-ai-form{
            margin-top:12px;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"]>.fm-ai-card--core .fm-ai-label{
            margin-bottom:5px;
            font-size:12px;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"]>.fm-ai-card--core .fm-ai-input-row :is(input,button){
            height:50px;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"]>.fm-ai-card--core .fm-ai-examples{
            margin-top:7px;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"]>.fm-ai-card--core .fm-ai-status{
            margin-top:10px;
            padding:10px 11px;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"]>.fm-ai-card--core .fm-ai-guardrail{
            margin-top:8px;
            padding-top:8px;
          }
          .fm-next-page[data-mode="real"] [data-screen="home"]>.fm-next-section-head{
            margin-bottom:14px;
          }
          '''
          anchor = '/* AI / Discovery state language */'
          if anchor not in ds:
              raise SystemExit('design-system density anchor not found')
          ds = ds.replace(anchor, density + '\n' + anchor, 1)
          ds_path.write_text(ds, encoding='utf-8')

          personalization_path = Path('src/v4/personalization.js')
          personalization = personalization_path.read_text(encoding='utf-8')
          old = "function explanationHtml(){const top=rank()[0];const match=MATCHES.find(item=>item.id===top?.id);if(!top||!match)return '';const baseReasons=(top.reasons||[]).slice(0,2);const details=[...baseReasons,...(top.memoryReasons||[])].slice(0,4);const sig=encodeURIComponent(`${memorySignature()}|${top.id}|${top.score}|${explanationOpen}`);return `<section class=\"fm-personalization-explanation\" data-personalization-explanation data-explanation-signature=\"${sig}\"><div><small>추천 이유 개인화</small><b>${match.place}</b></div><button type=\"button\" data-personalization-action=\"explain\" aria-expanded=\"${explanationOpen}\">왜 추천됐나요?</button>${explanationOpen?`<ul>${details.map(reason=>`<li>${reason}</li>`).join('')}</ul>`:''}</section>`}"
          new = "function hasPersonalizationSignal(memory){return Boolean(memory.profile||memory.recentMatchIds.length||memory.favorites.areas.length||memory.favorites.timeWindows.length||memory.favorites.formats.length)}\nfunction explanationHtml(){const memory=readMemory();if(!hasPersonalizationSignal(memory))return '';const top=rank()[0];const match=MATCHES.find(item=>item.id===top?.id);if(!top||!match||Number(top.personalizationAdjustment||0)<=0)return '';const baseReasons=(top.reasons||[]).slice(0,2);const details=[...baseReasons,...(top.memoryReasons||[])].slice(0,4);const sig=encodeURIComponent(`${memorySignature(memory)}|${top.id}|${top.score}|${explanationOpen}`);return `<section class=\"fm-personalization-explanation\" data-personalization-explanation data-explanation-signature=\"${sig}\"><div><small>추천 이유 개인화</small><b>${match.place}</b></div><button type=\"button\" data-personalization-action=\"explain\" aria-expanded=\"${explanationOpen}\">왜 추천됐나요?</button>${explanationOpen?`<ul>${details.map(reason=>`<li>${reason}</li>`).join('')}</ul>`:''}</section>`}"
          if old not in personalization:
              raise SystemExit('personalization explanation anchor not found')
          personalization = personalization.replace(old, new, 1)
          old = "function enhanceExplanation(){if(!root)return;for(const screen of root.querySelectorAll('[data-screen=\"home\"],[data-screen=\"discover\"]')){const existing=screen.querySelector('[data-personalization-explanation]');const html=explanationHtml();if(!html)continue;const probe=document.createElement('div');probe.innerHTML=html;const sig=probe.firstElementChild?.dataset.explanationSignature;if(existing?.dataset.explanationSignature===sig)continue;if(existing){existing.outerHTML=html;continue}const section=screen.querySelector('.fm-next-section');if(section){section.insertAdjacentHTML('afterbegin',html);continue}const list=screen.querySelector('.fm-next-list');if(list)list.insertAdjacentHTML('beforebegin',html)}}"
          new = "function enhanceExplanation(){if(!root)return;for(const screen of root.querySelectorAll('[data-screen=\"home\"],[data-screen=\"discover\"]')){const existing=screen.querySelector('[data-personalization-explanation]');const html=explanationHtml();if(!html){existing?.remove();continue}const probe=document.createElement('div');probe.innerHTML=html;const sig=probe.firstElementChild?.dataset.explanationSignature;if(existing?.dataset.explanationSignature===sig)continue;if(existing){existing.outerHTML=html;continue}const section=screen.querySelector('.fm-next-section');if(section){section.insertAdjacentHTML('afterbegin',html);continue}const list=screen.querySelector('.fm-next-list');if(list)list.insertAdjacentHTML('beforebegin',html)}}"
          if old not in personalization:
              raise SystemExit('personalization enhancement anchor not found')
          personalization = personalization.replace(old, new, 1)
          personalization_path.write_text(personalization, encoding='utf-8')

          release_test = Path('tests/e2e/v5.1-release-flow-review.spec.cjs')
          release = release_test.read_text(encoding='utf-8')
          marker = "test('welcome hero keeps readable contrast and an approved full-surface baseline'"
          if marker not in release:
              release += r'''

test('welcome hero keeps readable contrast and an approved full-surface baseline',async({page})=>{
  for(const viewport of [{width:390,height:844,name:'390'},{width:1440,height:900,name:'1440'}]){
    const errs=await openFresh(page,{width:viewport.width,height:viewport.height});
    const headline=page.locator('[data-screen="welcome"] .fm-next-intro h1');
    await expect(headline).toBeVisible();
    const color=await headline.evaluate(element=>getComputedStyle(element).color);
    expect(color,`welcome headline color at ${viewport.name}px`).toBe('rgb(255, 255, 255)');
    const topbar=page.locator('[data-screen="welcome"] .fm-next-topbar--dark');
    const background=await topbar.evaluate(element=>getComputedStyle(element).backgroundImage);
    expect(background).toContain('linear-gradient');
    await page.mouse.move(1,1);
    await expect(page).toHaveScreenshot(`release-flow-welcome-${viewport.name}.png`,{animations:'disabled',caret:'hide',fullPage:false,maxDiffPixels:24});
    expect(errs).toEqual([]);
  }
});
'''
              release_test.write_text(release, encoding='utf-8')

          visual_test = Path('tests/e2e/v5.1-visual-system-completion.spec.cjs')
          visual = visual_test.read_text(encoding='utf-8')
          marker = "test('390px Home keeps the decision flow compact before the match list'"
          if marker not in visual:
              visual += r'''

test('390px Home keeps the decision flow compact before the match list',async({page})=>{
  const errs=await openCleanApp(page,{width:390,height:844});
  await setupToHome(page);
  await expect(page.locator('.fm-ai-card--core')).toBeVisible();
  await expect(page.locator('[data-personalization-explanation]')).toHaveCount(0);
  const metrics=await page.evaluate(()=>{
    const first=document.querySelector('[data-screen="home"] .fm-next-match-card');
    const ai=document.querySelector('[data-screen="home"] .fm-ai-card--core');
    return {
      scrollHeight:document.documentElement.scrollHeight,
      firstMatchTop:first?.getBoundingClientRect().top??9999,
      aiHeight:ai?.getBoundingClientRect().height??9999
    };
  });
  expect(metrics.scrollHeight).toBeLessThanOrEqual(1160);
  expect(metrics.firstMatchTop).toBeLessThanOrEqual(760);
  expect(metrics.aiHeight).toBeLessThanOrEqual(350);
  await expectNoHorizontalOverflow(page);
  await page.mouse.move(1,1);
  const dynamicDates=page.locator('[data-screen="home"] .fm-next-match-date > span:first-child');
  await expect(page).toHaveScreenshot('visual-system-home-390-full.png',{animations:'disabled',caret:'hide',fullPage:true,maxDiffPixels:24,mask:[dynamicDates]});
  expect(errs).toEqual([]);
});

test('390px Discover does not claim personalization before memory exists',async({page})=>{
  const errs=await openCleanApp(page,{width:390,height:844});
  await setupToHome(page);
  await page.getByRole('button',{name:'전체 보기'}).click();
  await expect(page.locator('[data-screen="discover"]')).toBeVisible();
  await expect(page.locator('[data-personalization-explanation]')).toHaveCount(0);
  await expectNoHorizontalOverflow(page);
  await page.mouse.move(1,1);
  const dynamicDates=page.locator('[data-screen="discover"] .fm-next-match-date > span:first-child');
  await expect(page).toHaveScreenshot('visual-system-discover-390.png',{animations:'disabled',caret:'hide',fullPage:false,maxDiffPixels:24,mask:[dynamicDates]});
  expect(errs).toEqual([]);
});
'''
              visual_test.write_text(visual, encoding='utf-8')

          personalization_test = Path('tests/e2e/v4-personalization.spec.cjs')
          personalization_spec = personalization_test.read_text(encoding='utf-8')
          marker = "test('fresh recommendation surfaces do not claim personalization before memory exists'"
          if marker not in personalization_spec:
              personalization_spec += r'''

test('fresh recommendation surfaces do not claim personalization before memory exists',async({page})=>{await seed(page,'home');await expect(page.locator('[data-personalization-explanation]')).toHaveCount(0);const ranked=await page.evaluate(()=>window.__FOOTMATE_PERSONALIZATION__.rank());expect(ranked[0].personalizationAdjustment).toBe(0);await page.getByRole('button',{name:'전체 보기'}).click();await expect(page.locator('[data-screen="discover"]')).toBeVisible();await expect(page.locator('[data-personalization-explanation]')).toHaveCount(0)});
'''
              personalization_test.write_text(personalization_spec, encoding='utf-8')
          PY
      - name: Install Playwright audit dependencies
        run: npm install --no-save @playwright/test@1.55.1 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate audited changed-surface baselines and verify audit assertions
        run: npx playwright test tests/e2e/v5.1-release-flow-review.spec.cjs tests/e2e/v5.1-visual-system-completion.spec.cjs tests/e2e/v4-personalization.spec.cjs --update-snapshots
      - name: Commit audited corrections and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/product-visual-audit-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v4/design-system-v2.css src/v4/personalization.js tests/e2e .github/workflows/product-visual-audit-patch.yml
          git commit -m "fix: close product visual audit regressions [visual-audit-generated]"
          git push origin HEAD:fix/product-visual-audit-20260923
