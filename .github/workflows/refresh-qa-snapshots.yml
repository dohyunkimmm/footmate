name: Temporary FootMate Typography Snapshot Refresh
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/refresh-qa-snapshots.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.head_ref == 'fix/typography-qa-01-08-20261008' && github.event.pull_request.head.repo.full_name == 'dohyunkimmm/footmate'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/typography-qa-01-08-20261008
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned browser QA dependencies
        run: npm install --no-save --ignore-scripts '@playwright/test@1.55.1' '@axe-core/playwright@4.10.2' css-tree@3.1.0
      - name: Refresh only typography-affected Home images
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs tests/e2e/release-app.spec.cjs \
            --grep '390px Home uses neutral match media|Home lifecycle closes Return|Release App mobile changed surfaces match approved visual baselines' \
            --update-snapshots | tee /tmp/footmate-snapshot-refresh.log
      - name: Verify exactly four typography-affected baselines
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const log=fs.readFileSync('/tmp/footmate-snapshot-refresh.log','utf8');
          const expected=[
            'real-app-white-home-390-chromium-linux.png',
            'v6-release-home-upcoming-1440-chromium-linux.png',
            'v6-release-home-complete-1440-chromium-linux.png',
            'v6-release-home-upcoming-390-chromium-linux.png'
          ].sort();
          const actual=[...log.matchAll(/\/([^/\s]+\.png) is re-generated, writing actual/g)].map(m=>m[1]).sort();
          console.log('Snapshots regenerated:',actual);
          if(JSON.stringify(expected)!==JSON.stringify(actual))throw new Error('Unexpected snapshot update set');
          NODE
      - name: Commit four reviewed screenshot baselines
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs'),path=require('path'),cp=require('child_process');
            const {owner,repo}=context.repo;
            const branch='fix/typography-qa-01-08-20261008';
            const original=context.payload.pull_request.head.sha;
            const current=(await github.rest.repos.getBranch({owner,repo,branch})).data.commit.sha;
            if(current!==original)throw new Error('PR branch changed after checkout');
            const paths=[
              'tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-home-390-chromium-linux.png',
              'tests/e2e/release-app.spec.cjs-snapshots/v6-release-home-upcoming-1440-chromium-linux.png',
              'tests/e2e/release-app.spec.cjs-snapshots/v6-release-home-complete-1440-chromium-linux.png',
              'tests/e2e/release-app.spec.cjs-snapshots/v6-release-home-upcoming-390-chromium-linux.png'
            ];
            const entries=[];
            for(const file of paths){
              const content=fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE,file)).toString('base64');
              const blob=(await github.rest.git.createBlob({owner,repo,content,encoding:'base64'})).data.sha;
              entries.push({path:file,mode:'100644',type:'blob',sha:blob});
            }
            const parent=(await github.rest.git.getCommit({owner,repo,commit_sha:original})).data;
            const tree=(await github.rest.git.createTree({owner,repo,base_tree:parent.tree.sha,tree:entries})).data.sha;
            const commit=(await github.rest.git.createCommit({owner,repo,message:'test(visual): accept four reviewed 12px AI typography baselines',tree,parents:[original]})).data.sha;
            await github.rest.git.updateRef({owner,repo,ref:'heads/'+branch,sha:commit,force:false});
            console.log('Committed four reviewed images:',commit);
