name: Temporary FootMate Complete-State Snapshot Refresh
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/refresh-qa-snapshots.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.head_ref == 'fix/typography-qa-01-08-20261008'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/typography-qa-01-08-20261008
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned browser QA dependencies
        run: npm install --no-save --ignore-scripts '@playwright/test@1.55.1' '@axe-core/playwright@4.10.2' css-tree@3.1.0
      - name: Update finished-match Home screenshot
        run: npx playwright test --project=chromium tests/e2e/release-app.spec.cjs --grep 'Home lifecycle closes Return' --update-snapshots
      - name: Commit the reviewed complete-state screenshot
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/release-app.spec.cjs-snapshots/v6-release-home-complete-1440-chromium-linux.png
          git diff --cached --stat
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'test(visual): accept complete-state typography metadata snapshot'
          git push origin HEAD:fix/typography-qa-01-08-20261008
