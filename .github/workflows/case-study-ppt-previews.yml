name: FootMate Case Study PPT preview
on:
  push:
    branches: [main]
    paths:
      - 'src/case-study/downloads/footmate_report.pptx'
      - 'src/case-study/downloads/footmate_5year_strategy.pptx'
      - 'src/case-study/report-previews.js'
      - 'src/case-study/nine-sections.js'
      - 'qa/crosscheck-case-study-presentations.py'
      - 'src/case-study/previews/strategy/**'
      - '.github/workflows/case-study-ppt-previews.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/case-study/downloads/footmate_report.pptx'
      - 'src/case-study/downloads/footmate_5year_strategy.pptx'
      - 'src/case-study/report-previews.js'
      - 'src/case-study/nine-sections.js'
      - 'qa/crosscheck-case-study-presentations.py'
      - 'src/case-study/previews/strategy/**'
      - '.github/workflows/case-study-ppt-previews.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install presentation rendering support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-noto-cjk fonts-nanum
      - name: Confirm original presentation and published preview parity
        run: |
          set -euo pipefail
          mkdir -p /tmp/footmate-deck-qa
          libreoffice -env:UserInstallation=file:///tmp/footmate-deck-check1 --headless --convert-to pdf --outdir /tmp/footmate-deck-qa src/case-study/downloads/footmate_report.pptx
          libreoffice -env:UserInstallation=file:///tmp/footmate-deck-check2 --headless --convert-to pdf --outdir /tmp/footmate-deck-qa src/case-study/downloads/footmate_5year_strategy.pptx
          test "$(pdfinfo /tmp/footmate-deck-qa/footmate_report.pdf | awk '/^Pages:/ {print $2}')" = "9"
          test "$(pdfinfo /tmp/footmate-deck-qa/footmate_5year_strategy.pdf | awk '/^Pages:/ {print $2}')" = "6"
          python3 - <<'PY'
          import base64,json,re,zipfile
          from pathlib import Path
          root=Path('src/case-study')
          prefix='window.REPORT_SLIDES='
          script=(root/'report-previews.js').read_text(encoding='utf-8').strip()
          assert script.startswith(prefix) and script.endswith(';')
          slides=json.loads(script[len(prefix):-1])
          assert len(slides)==9,len(slides)
          for i,slide in enumerate(slides,1):
              src=slide['src']
              assert src.startswith('data:image/png;base64,')
              raw=base64.b64decode(src.split(',',1)[1],validate=True)
              assert raw.startswith(bytes.fromhex('89504e470d0a1a0a')) and len(raw)>5000,i
          for i in range(1,7):
              jpg=root/f'previews/strategy/slide-{i}.jpg'
              content=jpg.read_bytes()
              assert content[:3]==bytes.fromhex('ffd8ff') and len(content)>5000,str(jpg)
          forbidden=re.compile(r'Rolling\s*Forecast|수정\s?전망|재예측|분기\s?전망',re.I)
          assert not any(forbidden.search(slide['title']) for slide in slides)
          for name,count in [('footmate_report.pptx',9),('footmate_5year_strategy.pptx',6)]:
              with zipfile.ZipFile(root/'downloads'/name) as z:
                  parts=[p for p in z.namelist() if re.fullmatch(r'ppt/slides/slide[0-9]+\.xml',p)]
                  assert len(parts)==count,(name,len(parts))
                  for part in parts:
                      assert not forbidden.search(z.read(part).decode('utf-8','replace')),(name,part)
          print('PASS: 9 editable main slides, 6 editable strategy slides and all published previews')
          PY
      - name: Cross-check body against both slide decks
        run: python3 qa/crosscheck-case-study-presentations.py
      - name: Upload render evidence for quality review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footmate-case-study-ppt-render
          path: /tmp/footmate-deck-qa/*.pdf
          if-no-files-found: warn
          retention-days: 14
