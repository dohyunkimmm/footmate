name: MY Hub Contract Refresh
on:
  push:
    branches:
      - feat/my-matchday-hub-20260926
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/my-matchday-hub-20260926
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Update obsolete standalone schedule contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/e2e/v5.1-visual-system-completion.spec.cjs')
          text=path.read_text()
          old="""test('1440px Schedule empty and Profile match the completed product surfaces',async({page})=>{
            const errs=await openCleanApp(page,{width:1440,height:900});
            await setupToHome(page);
            await page.getByRole('button',{name:'내 경기'}).click();
            await expect(page.locator('[data-screen=\"schedule\"]')).toBeVisible();
            await page.mouse.move(1,1);
            await expect(page).toHaveScreenshot('visual-system-schedule-empty-1440.png',exactScreenshot);
            await page.getByRole('button',{name:'MY'}).click();
            await expect(page.locator('[data-screen=\"profile\"]')).toBeVisible();
            await page.mouse.move(1,1);
            await expect(page).toHaveScreenshot('visual-system-profile-1440.png',exactScreenshot);
            await expectNoHorizontalOverflow(page);
            await expectDocumentLocked(page);
            expect(errs).toEqual([]);
          });"""
          new="""test('1440px MY owns the empty match state and Profile matches the completed product surface',async({page})=>{
            const errs=await openCleanApp(page,{width:1440,height:900});
            await setupToHome(page);
            const homeNav=page.locator('[data-screen=\"home\"] .fm-next-nav');
            await expect(homeNav.locator('button')).toHaveCount(3);
            expect(await homeNav.locator('button').evaluateAll(nodes=>nodes.map(node=>node.textContent.trim()))).toEqual(['홈','경기 찾기','MY']);
            await expect(homeNav.locator('[data-action=\"nav-schedule\"]')).toHaveCount(0);
            await page.getByRole('button',{name:'MY'}).click();
            const profile=page.locator('[data-screen=\"profile\"]');
            await expect(profile).toBeVisible();
            const hub=profile.locator('[data-my-matchday-hub]');
            await expect(hub).toBeVisible();
            await expect(hub.getByText('아직 참가한 경기가 없어요')).toBeVisible();
            await expect(hub.getByRole('button',{name:'경기 찾기'})).toBeVisible();
            await page.mouse.move(1,1);
            await expect(page).toHaveScreenshot('visual-system-profile-1440.png',exactScreenshot);
            await expectNoHorizontalOverflow(page);
            await expectDocumentLocked(page);
            expect(errs).toEqual([]);
          });"""
          if old not in text:
              raise SystemExit('expected obsolete schedule contract block not found')
          path.write_text(text.replace(old,new))
          obsolete=Path('tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-schedule-empty-1440-chromium-linux.png')
          if obsolete.exists(): obsolete.unlink()
          PY
      - name: Install visual QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
          npx playwright install --with-deps chromium
      - name: Recheck unrelated checked-in panel before changing any baseline
        continue-on-error: true
        run: npx playwright test tests/e2e/v5.1-release-flow-review.spec.cjs --project=chromium -g "checked-in continuation action matches"
      - name: Refresh intended IA visual contracts
        run: |
          npx playwright test tests/e2e/v5.1-design-system-v2.spec.cjs --project=chromium -g "Profile personalization is a first-class" --update-snapshots
          npx playwright test tests/e2e/v5.1-visual-system-completion.spec.cjs --project=chromium --update-snapshots
      - name: Commit contract and baselines
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/v5.1-visual-system-completion.spec.cjs tests/e2e/v5.1-design-system-v2.spec.cjs-snapshots tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "test: align visual contracts with MY matchday hub"
          git push origin HEAD:feat/my-matchday-hub-20260926
