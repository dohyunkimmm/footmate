name: Case Study cover copy baseline
on:
  push:
    branches: [codex/case-study-editorial-review]
    paths-ignore:
      - '**/*-snapshots/**'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/case-study-editorial-review
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - run: npm install --no-save @playwright/test@1.55.1 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps chromium
      - name: Refresh P1 full-body cover-copy baselines
        run: npx playwright test tests/e2e/v5.1-case-study-visual.spec.cjs --update-snapshots --grep "full body section 1 matches"
      - name: Publish reviewed cover-copy baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/
          git diff --cached --quiet || git commit -m 'test: refresh static cover copy baselines'
          git push origin HEAD:codex/case-study-editorial-review
      - name: Compare P1 full-body cover-copy baselines
        run: npx playwright test tests/e2e/v5.1-case-study-visual.spec.cjs --grep "full body section 1 matches"
