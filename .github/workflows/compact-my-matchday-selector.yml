name: Compact MY matchday selector
on:
  push:
    branches:
      - feat/my-match-hub-3tab-20260927
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Shorten repeated MY matchday selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/v4/design-system-v2.css')
          css=path.read_text()
          old=':is([data-screen="profile"],[data-screen="schedule"]) [data-my-matches][data-matchday-module-version]'
          new='[data-matchday-module-version]'
          count=css.count(old)
          if count < 10:
              raise SystemExit(f'unexpected selector count: {count}')
          css=css.replace(old,new)
          if old in css:
              raise SystemExit('long selector remains')
          path.write_text(css)
          print(f'compacted {count} selector occurrences')
          PY
      - name: Verify CSS budget
        run: node scripts/check-v4.9-performance-budget.cjs
      - name: Commit compact selector
        run: |
          rm .github/workflows/compact-my-matchday-selector.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v4/design-system-v2.css .github/workflows/compact-my-matchday-selector.yml
          git diff --cached --check
          git commit -m "fix: keep MY matchday ownership within CSS budget"
          git push
