name: Temporary AI Label Baseline Refresh
on:
  push:
    branches: [fix/remove-ai-core-label-real-app-20260927]
    paths:
      - .github/workflows/tmp-refresh-ai-label-baselines.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh intentional AI label removal baselines
        run: |
          npx playwright test --project=chromium tests/e2e/v5.1-release-flow-review.spec.cjs --grep "AI Match Assistant is a primary core feature with explicit rules fallback" --update-snapshots
          npx playwright test --project=chromium tests/e2e/v5.1-visual-baseline.spec.cjs --grep "390px AI card matches the approved visual baseline" --update-snapshots
          npx playwright test --project=chromium tests/e2e/v5.1-visual-system-completion.spec.cjs --grep "1440px Home and Discover match the completed visual hierarchy|390px AI fallback matches the completed state hierarchy|390px AI loading and Discovery empty states match the completed state system|390px Home keeps the decision flow compact before the match list|320px home keeps matches scrollable above shell navigation and retains readable controls|375px home keeps matches scrollable above shell navigation and retains readable controls|390px home keeps matches scrollable above shell navigation and retains readable controls|430px home keeps matches scrollable above shell navigation and retains readable controls" --update-snapshots
      - name: Commit refreshed Ubuntu Chromium baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-ai-core-1440-chromium-linux.png \
            tests/e2e/v5.1-visual-baseline.spec.cjs-snapshots/real-app-ai-card-390-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-home-1440-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-ai-fallback-390-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-ai-loading-390-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-home-390-full-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-320-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-375-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-390-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-430-chromium-linux.png
          if ! git diff --cached --quiet; then
            git commit -m "test: refresh AI label removal baselines"
            git push origin HEAD:fix/remove-ai-core-label-real-app-20260927
          fi
