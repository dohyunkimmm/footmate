name: Apply Welcome Desktop Headroom Temp
on:
  push:
    branches:
      - fix/welcome-brand-copy-offset-20260926
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/welcome-brand-copy-offset-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Sync latest main and replace unsafe prototype
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git checkout origin/main -- src/v4/personalization.css tests/e2e/real-app-white-surface.spec.cjs tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-welcome-390-chromium-linux.png tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-personalized-welcome-390-chromium-linux.png tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-390-chromium-linux.png tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-1440-chromium-linux.png
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          css_path=Path('src/v4/personalization.css')
          css=css_path.read_text().rstrip()+"\n@media(min-width:700px){#footmate-next .fm-next-page[data-mode=real] .fm-next-app:not([data-embed=true]):has([data-screen=welcome]){height:calc(100dvh - 20px);max-height:856px;transform:translateY(-6px)}}\n"
          css_path.write_text(css)
          test_path=Path('tests/e2e/real-app-white-surface.spec.cjs')
          test=test_path.read_text()
          marker="test('390px personalized Welcome keeps one primary CTA and one returning-user shortcut',async({page})=>{"
          block=dedent("""
          test('1440px Welcome moves the visible brand 12px upward while preserving lower geometry',async({page})=>{
            const errs=await openCleanApp(page,{width:1440,height:900});
            const app=page.locator('.fm-next-app:not([data-embed="true"])');
            const measure=async()=>app.evaluate(node=>{
              const box=node.getBoundingClientRect();
              const brand=node.querySelector('[data-screen="welcome"] .fm-next-brand').getBoundingClientRect();
              const headline=node.querySelector('[data-screen="welcome"] h1').getBoundingClientRect();
              const action=node.querySelector('[data-screen="welcome"] .fm-next-actions button').getBoundingClientRect();
              return {top:box.top,bottom:box.bottom,height:box.height,brandTop:brand.top,headlineTop:headline.top,actionTop:action.top};
            });
            const actual=await measure();
            const baseline=await app.evaluate(node=>{
              const original=node.style.cssText;
              node.style.setProperty('height','calc(100dvh - 32px)','important');
              node.style.setProperty('max-height','844px','important');
              node.style.setProperty('transform','none','important');
              const box=node.getBoundingClientRect();
              const brand=node.querySelector('[data-screen="welcome"] .fm-next-brand').getBoundingClientRect();
              const headline=node.querySelector('[data-screen="welcome"] h1').getBoundingClientRect();
              const action=node.querySelector('[data-screen="welcome"] .fm-next-actions button').getBoundingClientRect();
              const result={top:box.top,bottom:box.bottom,height:box.height,brandTop:brand.top,headlineTop:headline.top,actionTop:action.top};
              node.style.cssText=original;
              return result;
            });
            const delta=baseline.brandTop-actual.brandTop;
            expect(delta).toBeGreaterThan(11.5);
            expect(delta).toBeLessThan(12.5);
            expect(Math.abs(actual.bottom-baseline.bottom)).toBeLessThan(.5);
            expect(Math.abs(actual.headlineTop-baseline.headlineTop)).toBeLessThan(.5);
            expect(Math.abs(actual.actionTop-baseline.actionTop)).toBeLessThan(.5);
            expect(actual.brandTop).toBeGreaterThanOrEqual(0);
            expect(errs).toEqual([]);
          });

          """)
          if marker not in test:
            raise SystemExit('Welcome insertion marker not found')
          test=test.replace(marker,block+marker,1)
          test_path.write_text(test)
          PY
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify geometry and unchanged mobile Welcome
        run: npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs --grep '1440px Welcome moves|390px Welcome|390px personalized Welcome'
      - name: Refresh approved release Welcome baselines
        run: npx playwright test --project=chromium tests/e2e/v5.1-release-flow-review.spec.cjs --grep 'welcome hero keeps readable contrast' --update-snapshots
      - name: Verify refreshed baseline by real comparison
        run: npx playwright test --project=chromium tests/e2e/v5.1-release-flow-review.spec.cjs --grep 'welcome hero keeps readable contrast'
      - name: Remove temporary workflow and guard final scope
        run: |
          rm .github/workflows/apply-welcome-desktop-headroom-temp.yml
          python - <<'PY'
          import subprocess
          allowed={'src/v4/personalization.css','tests/e2e/real-app-white-surface.spec.cjs','tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-1440-chromium-linux.png','.github/workflows/apply-welcome-desktop-headroom-temp.yml'}
          status=subprocess.check_output(['git','status','--short']).decode().splitlines()
          paths={line[3:] for line in status}
          print('\n'.join(status))
          unexpected=paths-allowed
          if unexpected:
            raise SystemExit(f'Unexpected final changes: {sorted(unexpected)}')
          required={'src/v4/personalization.css','tests/e2e/real-app-white-surface.spec.cjs','tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-1440-chromium-linux.png'}
          if not required.issubset(paths):
            raise SystemExit(f'Missing required final changes: {sorted(required-paths)}')
          PY
      - name: Commit safe fix
        run: |
          git add -A
          git commit -m 'fix: move desktop Welcome brand visibly upward'
          git push origin HEAD:fix/welcome-brand-copy-offset-20260926
