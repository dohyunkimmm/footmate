name: Fix Discover Density PR339 v2
on:
  push:
    branches: [polish/discover-card-density-20260926]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[discover-pr339-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/discover-card-density-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Repair Discover source owners and contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace_once(text, old, new, label):
              if old not in text: raise SystemExit(f'missing expected source: {label}')
              return text.replace(old,new,1)

          p=Path('src/v4/app.js'); s=p.read_text()
          s=replace_once(s,"${topbar({title:'경기 찾기',actionHtml:`<button type=\"button\" class=\"fm-next-icon-button\" data-action=\"edit-setup\" aria-label=\"경기 조건 수정\">${icon('level')}</button>`})}","${topbar({actionHtml:`<button type=\"button\" class=\"fm-next-icon-button\" data-action=\"edit-setup\" aria-label=\"경기 조건 수정\">${icon('level')}</button>`})}",'topbar title')
          s=replace_once(s,'      <div class="fm-next-section-head"><div><h1>${state.region} 추천 경기</h1><p>${state.level} · ${state.position} 기준 · 가까운 순</p></div></div>','      <div class="fm-next-section-head" data-discovery-heading hidden style="display:none"><div><h1></h1><p></p></div></div>','default heading')
          p.write_text(s)

          p=Path('src/v4/discovery.js'); s=p.read_text()
          s=replace_once(s,'      <div class="fm-next-match-tags"><span class="fm-next-tag fm-next-tag--strong">${row.fit||match.fit}</span><span class="fm-next-tag">${match.distance}</span><span class="fm-next-tag">${spotLabel(match,state)}</span><span class="fm-next-tag" style="margin-left:auto">${match.level}</span></div>\n      <div class="fm-next-match-footer" style="justify-content:flex-end"><div class="fm-next-price">${money(match.price)}</div></div>','      <div class="fm-next-match-tags"><span class="fm-next-tag fm-next-tag--strong">${row.fit||match.fit}</span><span class="fm-next-tag">${match.distance}</span><span class="fm-next-tag">${spotLabel(match,state)}</span><span class="fm-next-tag" style="margin-left:auto;white-space:nowrap">${match.level}</span></div>\n      <div class="fm-next-match-footer"><div><small>${match.region} · ${match.format} · ${match.duration}</small></div><div class="fm-next-price">${money(match.price)}</div></div>','discovery card')
          s=replace_once(s,"function compactDiscoveryHeader(screen){\n  const topbar=screen.querySelector('.fm-next-topbar');\n  const title=topbar?.querySelector(':scope > strong');\n  if(title?.textContent.trim()==='경기 찾기')title.remove();\n  topbar?.classList.remove('fm-next-topbar--titled');\n  screen.querySelector('.fm-next-section-head')?.remove();\n}\n\n",'','header remover')
          s=replace_once(s,'  compactDiscoveryHeader(screen);\n','','header remover call')
          p.write_text(s)

          p=Path('src/v4/recommendation.js'); s=p.read_text()
          s=replace_once(s,'  function card(item,index){','  function card(item,index,scope=\'home\'){','recommendation card signature')
          s=replace_once(s,'        <div class="fm-next-match-tags"><span class="fm-next-tag fm-next-tag--strong">${item.fit}</span><span class="fm-next-tag">${match.distance}</span><span class="fm-next-tag">${item.spotLabel}</span></div>\n        <div class="fm-next-match-footer"><div><small>${match.format} · ${match.duration}</small><b>${match.level} · ${match.surface}</b></div><div class="fm-next-price">${money(match.price)}</div></div>','        <div class="fm-next-match-tags"><span class="fm-next-tag fm-next-tag--strong">${item.fit}</span><span class="fm-next-tag">${match.distance}</span><span class="fm-next-tag">${item.spotLabel}</span>${scope===\'discover\'?`<span class="fm-next-tag" style="margin-left:auto;white-space:nowrap">${match.level}</span>`:\'\'}</div>\n        <div class="fm-next-match-footer">${scope===\'discover\'?`<div><small>${match.format} · ${match.duration}</small></div>`:`<div><small>${match.format} · ${match.duration}</small><b>${match.level} · ${match.surface}</b></div>`}<div class="fm-next-price">${money(match.price)}</div></div>','recommendation card body')
          s=replace_once(s,"    list.innerHTML=ranked.slice(0,2).map(card).join('');","    list.innerHTML=ranked.slice(0,2).map((item,index)=>card(item,index,'home')).join('');",'home card scope')
          s=replace_once(s,"    list.innerHTML=ranked.map(card).join('');","    list.innerHTML=ranked.map((item,index)=>card(item,index,'discover')).join('');",'discover card scope')
          p.write_text(s)

          p=Path('src/v5/ai-match-assistant.js'); s=p.read_text()
          s=replace_once(s,"  const head=screen.querySelector('.fm-next-section-head');text(head?.querySelector('h1'),active&&saved?.result?'AI 조회 결과':'경기 찾기');text(head?.querySelector('p'),active&&saved?.result?'조회 결과를 필터와 정렬로 조정할 수 있어요.':'추천 기준을 유지한 채 전체 경기를 탐색할 수 있어요.');","  const head=screen.querySelector('.fm-next-section-head');const showingAiResult=Boolean(active&&saved?.result);if(head){hidden(head,!showingAiResult);head.style.display=showingAiResult?'flex':'none'}text(head?.querySelector('h1'),showingAiResult?'AI 조회 결과':'');text(head?.querySelector('p'),showingAiResult?'조회 결과를 필터와 정렬로 조정할 수 있어요.':'');",'AI-only heading')
          p.write_text(s)

          p=Path('tests/e2e/product-completion.spec.cjs'); s=p.read_text()
          s=replace_once(s,"  await expect(screen.locator('.fm-next-section-head h1')).toHaveText('경기 찾기');","  await expect(screen.locator('.fm-next-topbar > strong')).toHaveCount(0);\n  await expect(screen.locator('[data-discovery-heading]')).toBeHidden();",'product default heading')
          p.write_text(s)

          p=Path('tests/e2e/v5.1-visual-system-completion.spec.cjs'); s=p.read_text()
          old="""  const discoverTopGap=await page.locator('[data-screen=\"discover\"]').evaluate(element=>{
    const header=element.querySelector('.fm-next-topbar').getBoundingClientRect();
    const heading=element.querySelector('.fm-next-section-head').getBoundingClientRect();
    const title=element.querySelector('.fm-next-topbar>strong').getBoundingClientRect();
    const app=element.closest('.fm-next-app').getBoundingClientRect();
    return {gap:heading.top-header.bottom,titleCenter:title.left+title.width/2,appCenter:app.left+app.width/2};
  });
  expect(discoverTopGap.gap).toBeGreaterThanOrEqual(18);
  expect(Math.abs(discoverTopGap.titleCenter-discoverTopGap.appCenter)).toBeLessThanOrEqual(1);"""
          new="""  const discoverTopGap=await page.locator('[data-screen=\"discover\"]').evaluate(element=>{
    const header=element.querySelector('.fm-next-topbar').getBoundingClientRect();
    const conditions=element.querySelector('.fm-next-section > .fm-next-match-tags').getBoundingClientRect();
    const heading=element.querySelector('[data-discovery-heading]');
    return {gap:conditions.top-header.bottom,titleCount:element.querySelectorAll('.fm-next-topbar>strong').length,headingHidden:Boolean(heading?.hidden),headingDisplay:heading?getComputedStyle(heading).display:null};
  });
  expect(discoverTopGap.gap).toBeGreaterThanOrEqual(18);
  expect(discoverTopGap.titleCount).toBe(0);
  expect(discoverTopGap.headingHidden).toBe(true);
  expect(discoverTopGap.headingDisplay).toBe('none');"""
          s=replace_once(s,old,new,'desktop geometry')
          p.write_text(s)

          p=Path('tests/e2e/real-app-white-surface.spec.cjs'); s=p.read_text()
          s=replace_once(s,"  await expect(screen).toBeVisible();\n  const media=screen.locator('.fm-next-match-card-media').first();","  await expect(screen).toBeVisible();\n  await expect(screen.locator('.fm-next-topbar > strong')).toHaveCount(0);\n  await expect(screen.locator('[data-discovery-heading]')).toBeHidden();\n  const firstCard=screen.locator('.fm-next-match-card').first();\n  await expect(firstCard).not.toContainText('인조잔디');\n  await expect(firstCard.locator('.fm-next-match-tags .fm-next-tag').last()).toContainText(/입문|초중급|중급|고급/);\n  await expect(firstCard.locator('.fm-next-match-footer small')).toContainText(/vs/);\n  const media=screen.locator('.fm-next-match-card-media').first();",'surface assertions')
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          node --check src/v4/app.js
          node --check src/v4/discovery.js
          node --check src/v4/recommendation.js
          node --check src/v5/ai-match-assistant.js
          node --check tests/e2e/product-completion.spec.cjs
          node --check tests/e2e/v5.1-visual-system-completion.spec.cjs
          node --check tests/e2e/real-app-white-surface.spec.cjs
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION" css-tree@3.1.0
          npx playwright install --with-deps chromium
      - name: Refresh affected Discover baselines
        run: |
          npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs -g "390px Discover uses the same neutral match surface system" --update-snapshots
          npx playwright test --project=chromium tests/e2e/product-completion.spec.cjs -g "Discover owns filters, sorting and whole-match exploration" --update-snapshots
          npx playwright test --project=chromium tests/e2e/v5.1-visual-system-completion.spec.cjs -g "1440px Home and Discover match|390px Discover does not claim personalization|px discover keeps matches scrollable" --update-snapshots
      - name: Compare affected Discover baselines and contracts
        run: |
          npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs -g "390px Discover uses the same neutral match surface system"
          npx playwright test --project=chromium tests/e2e/product-completion.spec.cjs -g "Home AI example executes search|Discover owns filters, sorting and whole-match exploration"
          npx playwright test --project=chromium tests/e2e/v5.1-visual-system-completion.spec.cjs -g "1440px Home and Discover match|390px Discover does not claim personalization|px discover keeps matches scrollable"
      - name: Commit implementation and baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-discovery-density-pr339.yml .github/workflows/fix-discovery-density-pr339-v2.yml
          git add -A
          git commit -m "fix: preserve Discover metadata and refresh baselines [discover-pr339-repaired]"
          git push origin HEAD:polish/discover-card-density-20260926
