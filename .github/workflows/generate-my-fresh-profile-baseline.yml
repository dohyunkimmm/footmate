name: Generate MY Fresh Profile Baseline
on:
  push:
    branches: [fix/my-fresh-profile-containment-20260926]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Playwright
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Generate approved baseline candidate
        run: npx playwright test tests/e2e/my-fresh-profile-containment.spec.cjs --project=chromium --update-snapshots
      - name: Commit generated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/my-fresh-profile-containment.spec.cjs-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes"
            exit 0
          fi
          git commit -m "test: add fresh MY profile visual baseline"
          git push
