name: Temporary Real App Baseline Refresh
on:
  push:
    branches: [feat/real-app-visual-finish-p0-p2]
    paths:
      - .github/UPDATE_REAL_APP_BASELINES
      - .github/workflows/tmp-update-real-app-baselines.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Install browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh approved Ubuntu Chromium baselines
        run: |
          npx playwright test --project=chromium --update-snapshots \
            tests/e2e/real-app-white-surface.spec.cjs \
            tests/e2e/product-completion.spec.cjs \
            tests/e2e/v5.1-visual-baseline.spec.cjs \
            tests/e2e/v5.1-design-system-v2.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs
      - name: Commit refreshed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/e2e/real-app-white-surface.spec.cjs-snapshots \
            tests/e2e/product-completion.spec.cjs-snapshots \
            tests/e2e/v5.1-visual-baseline.spec.cjs-snapshots \
            tests/e2e/v5.1-design-system-v2.spec.cjs-snapshots \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots
          git diff --cached --quiet && { echo "No baseline changes generated"; exit 1; }
          git commit -m "test: refresh approved Real App visual baselines"
          git push origin HEAD:${GITHUB_REF_NAME}
