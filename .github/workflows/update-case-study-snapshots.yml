name: Refresh Case Study Visual Baselines
on:
  push:
    branches: [portfolio/ai-service-planner-95]
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.head_commit.message == 'prepare case study snapshot refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Install browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh reviewed Case Study baselines
        run: npx playwright test --project=chromium tests/e2e/v5.1-case-study-visual.spec.cjs --update-snapshots
      - name: Commit reviewed baselines and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots
          git rm .github/workflows/update-case-study-snapshots.yml
          git commit -m "test: refresh case study visual baselines"
          git push origin HEAD:${GITHUB_REF_NAME}
