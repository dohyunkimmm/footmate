name: Finalize V3 Full Product Visual QA

on:
  push:
    branches:
      - design/visual-hierarchy-v3-20260927
    paths:
      - .github/workflows/v3-full-product-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/visual-hierarchy-v3-20260927
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          npm install --no-save --ignore-scripts @playwright/test@1.55.1 @axe-core/playwright@4.10.2
          node scripts/check-qa-toolchain.cjs
          node scripts/check-v4.9-performance-budget.cjs
      - name: Update reviewed v3 runtime and visual contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');

          const designPath='tests/e2e/v5.1-design-system-v2.spec.cjs';
          let design=fs.readFileSync(designPath,'utf8');
          const profileStart=design.indexOf("test('1440px Profile personalization is a first-class Design System v2 surface'");
          const profileEnd=design.indexOf("\ntest('1440px Detail decision content uses the same surface family'",profileStart);
          if(profileStart<0||profileEnd<0) throw new Error('Profile test block not found');
          let profile=design.slice(profileStart,profileEnd);
          const profileBefore=profile;
          profile=profile.replace(
            "return {radius:parseFloat(style.borderRadius),shadow:style.boxShadow,background:style.backgroundColor};",
            "return {radius:parseFloat(style.borderRadius),shadow:style.boxShadow,background:style.backgroundColor,border:style.borderTopWidth};"
          );
          profile=profile.replace(
            "expect(metrics.shadow).not.toBe('none');",
            "expect(metrics.border).not.toBe('0px');"
          );
          if(profile===profileBefore||!profile.includes("expect(metrics.border).not.toBe('0px');")) throw new Error('Profile surface contract was not updated');
          design=design.slice(0,profileStart)+profile+design.slice(profileEnd);
          fs.writeFileSync(designPath,design);

          const cssPath='src/v4/design-system-v2.css';
          let css=fs.readFileSync(cssPath,'utf8');
          const filterBase=`.fm-next-page[data-mode="real"] .fm-next-app:not([data-embed="true"]) [data-screen="discover"] .fm-discovery-filter-button{
            border-color:var(--fm-v3-brand);
            background:var(--fm-v3-brand);
            color:#fff;
            box-shadow:0 7px 18px rgba(7,61,43,.12);
          }`;
          const filterFeedback=`.fm-next-page[data-mode="real"] .fm-next-app:not([data-embed="true"]) [data-screen="discover"] .fm-discovery-filter-button:hover,
          .fm-next-page[data-mode="real"] .fm-next-app:not([data-embed="true"]) [data-screen="discover"] .fm-discovery-filter-button:focus-visible{
            border-color:var(--fm-v3-brand-2);
            background:var(--fm-v3-brand-2);
            box-shadow:0 9px 22px rgba(7,61,43,.18);
          }`;
          if(!css.includes(filterFeedback)){
            if(!css.includes(filterBase)) throw new Error('Discover filter base rule not found');
            css=css.replace(filterBase,`${filterBase}\n${filterFeedback}`);
          }
          fs.writeFileSync(cssPath,css);
          NODE
          git diff --check
          node scripts/check-v4.9-performance-budget.cjs
      - name: Refresh only reviewed Product visual baselines
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --project=chromium \
            tests/e2e/v4-personalization.spec.cjs \
            tests/e2e/v5.1-design-system-v2.spec.cjs \
            tests/e2e/v5.1-release-flow-review.spec.cjs \
            tests/e2e/v5.1-visual-baseline.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs \
            --update-snapshots
      - name: Compare refreshed Product baselines without update mode
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --project=chromium \
            tests/e2e/v4-personalization.spec.cjs \
            tests/e2e/v5.1-design-system-v2.spec.cjs \
            tests/e2e/v5.1-release-flow-review.spec.cjs \
            tests/e2e/v5.1-visual-baseline.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs
      - name: Run full Product Chromium gate without Case Study mutation
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --project=chromium \
            tests/e2e/v5.1-core.spec.cjs \
            tests/e2e/v5.1-product-integrity.spec.cjs \
            tests/e2e/v5.1-decision-flow-polish.spec.cjs \
            tests/e2e/v5.1-visual-baseline.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs \
            tests/e2e/v5.1-design-system-v2.spec.cjs \
            tests/e2e/v5.1-release-flow-review.spec.cjs \
            tests/e2e/v5.1-beta.spec.cjs \
            tests/e2e/v5.1-beta-operator.spec.cjs \
            tests/e2e/v5.2-real-beta-readiness.spec.cjs \
            tests/e2e/v5.2-beta-email-reliability.spec.cjs \
            tests/e2e/v5.3-beta-free-growth.spec.cjs \
            tests/e2e/v5.3-beta-auth-mfa.spec.cjs \
            tests/e2e/v5.3-beta-push-media.spec.cjs \
            tests/e2e/v5.1-ai-assistant.spec.cjs \
            tests/e2e/v4-discovery.spec.cjs \
            tests/e2e/priority-ux.spec.cjs \
            tests/e2e/checkin-state.spec.cjs \
            tests/e2e/v4-decision.spec.cjs \
            tests/e2e/v4-participation.spec.cjs \
            tests/e2e/v4-matchday.spec.cjs \
            tests/e2e/v4-return.spec.cjs \
            tests/e2e/v4-personalization.spec.cjs \
            tests/e2e/v4-platform.spec.cjs
      - name: Commit only verified Product runtime contracts and baselines
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v3-full-product-finalize.yml
          git add -A
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: align full product visual contracts with v3 hierarchy'
          git push origin HEAD:design/visual-hierarchy-v3-20260927
