name: FootMate v6 Production Verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  statuses: read
concurrency:
  group: footmate-v6-production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    name: v6 Production Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Check Production v6 test syntax
        run: node --check tests/e2e/v6-production.spec.cjs

  production:
    name: Production v6 Journey
    needs: contract
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Wait for exact Vercel deployment
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          for attempt in $(seq 1 42); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" --jq '[.statuses[]|select(.context=="Vercel")][0].state // ""')"
            [ "$state" = success ] && exit 0
            if [ "$state" = failure ] || [ "$state" = error ]; then exit 1; fi
            sleep 10
          done
          exit 1
      - name: Install pinned Playwright
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify v6 journey on exact Production
        env: {BASE_URL: https://footmate-black.vercel.app, PRODUCTION_SMOKE: '1', FOOTMATE_STRICT_PRODUCTION: 'true'}
        run: npx playwright test --project=chromium tests/e2e/v6-production.spec.cjs
      - name: Upload v6 Production evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v6-production-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
