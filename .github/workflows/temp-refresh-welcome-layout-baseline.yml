name: Temporary Refresh Welcome Layout Baseline
on:
  push:
    branches: [fix/welcome-layout-regression-20260925]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Install exact QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh changed welcome baselines
        run: npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs tests/e2e/v5.1-release-flow-review.spec.cjs --update-snapshots
      - name: Verify screenshot comparison
        run: npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs tests/e2e/v5.1-release-flow-review.spec.cjs
      - name: Commit approved changed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/*-snapshots/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: refresh welcome layout visual baselines"
          git push
