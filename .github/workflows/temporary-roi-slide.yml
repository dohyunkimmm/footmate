name: Generate FootMate ROI slide (temporary)
on:
  push:
    branches:
      - feat/footmate-roi-case-study-20261102
    paths:
      - scripts/add-roi-slide.py
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PowerPoint editor
        run: python -m pip install --disable-pip-version-check python-pptx
      - name: Update existing report and slide preview
        run: python scripts/add-roi-slide.py
      - name: Commit updated report assets to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/case-study/downloads/footmate_report.pptx src/case-study/report-previews.js
          if ! git diff --cached --quiet; then
            git commit -m "Append 12-month ROI slide to presentation and web preview"
            git push origin HEAD:feat/footmate-roi-case-study-20261102
          fi
