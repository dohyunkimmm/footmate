name: Temporary Home AI Baseline Regeneration
on:
  push:
    branches: [polish/home-ai-entry-compact]
permissions:
  contents: write
jobs:
  regenerate:
    if: contains(github.event.head_commit.message, '[regen-home-ai-baselines]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/home-ai-entry-compact
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Regenerate release-flow Home AI baseline
        run: npx playwright test tests/e2e/v5.1-release-flow-review.spec.cjs --project=chromium -g "AI Match Assistant is a primary core feature with explicit rules fallback" --update-snapshots --workers=1
      - name: Regenerate visual-baseline Home AI baseline
        run: npx playwright test tests/e2e/v5.1-visual-baseline.spec.cjs --project=chromium -g "390px AI card matches the approved visual baseline" --update-snapshots --workers=1
      - name: Regenerate visual-system Home AI baselines
        run: npx playwright test tests/e2e/v5.1-visual-system-completion.spec.cjs --project=chromium -g "1440px Home and Discover match the completed visual hierarchy|390px AI fallback matches the completed state hierarchy|390px AI loading and Discovery empty states match the completed state system|390px Home keeps the decision flow compact before the match list|home keeps matches scrollable above shell navigation and retains readable controls" --update-snapshots --workers=1
      - name: Regenerate product-completion Home AI baselines
        run: npx playwright test tests/e2e/product-completion.spec.cjs --project=chromium -g "Home is the AI Match Assistant entry with one compact For You list|AI fallback exposes an explicit retry action on Home without duplicating results there" --update-snapshots --workers=1
      - name: Regenerate Real App White Home baseline
        run: npx playwright test tests/e2e/real-app-white-surface.spec.cjs --project=chromium -g "390px Home uses neutral match media while raising the core AI surface" --update-snapshots --workers=1
      - name: Commit regenerated Home AI baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-ai-core-1440-chromium-linux.png \
            tests/e2e/v5.1-visual-baseline.spec.cjs-snapshots/real-app-ai-card-390-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-home-1440-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-ai-fallback-390-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-ai-loading-390-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-home-390-full-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-320-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-375-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-390-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-430-chromium-linux.png \
            tests/e2e/product-completion.spec.cjs-snapshots/product-completion-home-ia-390-chromium-linux.png \
            tests/e2e/product-completion.spec.cjs-snapshots/product-completion-ai-fallback-ia-390-chromium-linux.png \
            tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-home-390-chromium-linux.png
          if git diff --cached --quiet; then
            echo "No baseline changes"
          else
            git commit -m "test: refresh intentional Home AI baselines"
            git push origin HEAD:polish/home-ai-entry-compact
          fi
