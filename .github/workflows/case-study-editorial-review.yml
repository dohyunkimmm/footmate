name: Case Study editorial review
on:
  push:
    branches: [codex/case-study-editorial-review]
    paths-ignore:
      - '**/*-snapshots/**'
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/case-study-editorial-review
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - run: npm install --no-save @playwright/test@1.55.1 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps chromium
      - name: Capture review candidates
        id: capture
        continue-on-error: true
        run: npx playwright test tests/e2e/v5.1-case-study-visual.spec.cjs --update-snapshots --grep "cover"
      - name: Publish candidate renders for editorial inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/
          git diff --cached --quiet || git commit -m 'test: capture candidate Case Study editorial renders'
          git push origin HEAD:codex/case-study-editorial-review
      - name: Compare renders and verify contracts
        run: npx playwright test tests/e2e/v5.1-case-study-visual.spec.cjs --grep cover
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: case-study-editorial-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
