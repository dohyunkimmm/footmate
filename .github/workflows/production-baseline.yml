name: FootMate Exact Production Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - tests/production-v30-smoke.cjs
      - tests/e2e/v30-production.spec.cjs
      - .github/workflows/production-baseline.yml

permissions:
  contents: read

jobs:
  exact-v3-production:
    name: Exact v3 Production HTTP + Chromium
    if: github.head_ref == 'fix/v3-production-baseline-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification contract
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record verified deployment baseline
        run: echo 'Vercel exact Production baseline cf766cb047b23ef302f06a80429765f45511bdcf / dpl_51Gki6ZZhy2shP6QH9U1yifT98zG'
      - name: Run exact v3 Production HTTP smoke
        env:
          FOOTMATE_PRODUCTION_URL: https://footmate-black.vercel.app
          FOOTMATE_STRICT_PRODUCTION: 'true'
          GITHUB_SHA: cf766cb047b23ef302f06a80429765f45511bdcf
        run: node tests/production-v30-smoke.cjs
      - name: Install production browser dependency
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run exact v3 Production Chromium smoke
        env:
          BASE_URL: https://footmate-black.vercel.app
          PRODUCTION_SMOKE: '1'
          FOOTMATE_STRICT_PRODUCTION: 'true'
        run: npx playwright test tests/e2e/v30-production.spec.cjs
      - name: Upload exact Production evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: exact-v3-production-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
