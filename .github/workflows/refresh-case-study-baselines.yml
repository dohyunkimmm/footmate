name: Refresh Case Study Baselines

on:
  push:
    branches:
      - style/system-typography
    paths:
      - .github/workflows/refresh-case-study-baselines.yml

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/system-typography
          fetch-depth: 0

      - name: Download approved typography QA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/case-study-qa.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10733362666/zip"
          mkdir -p /tmp/case-study-qa
          unzip -q /tmp/case-study-qa.zip -d /tmp/case-study-qa

      - name: Refresh deterministic visual baselines
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil

          root = Path('/tmp/case-study-qa/test-results/playwright')
          target = Path('tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots')
          groups = {}
          for path in root.rglob('*-actual.png'):
              groups.setdefault(path.name, []).append(path)

          if len(groups) != 20:
              raise SystemExit(f'Expected 20 visual baselines, found {len(groups)}')

          for name, paths in sorted(groups.items()):
              digests = {hashlib.sha256(path.read_bytes()).hexdigest() for path in paths}
              if len(digests) != 1:
                  raise SystemExit(f'Non-deterministic retry screenshots for {name}')
              out_name = name.replace('-actual.png', '-chromium-linux.png')
              shutil.copyfile(paths[0], target / out_name)
              print(out_name)
          PY

      - name: Commit refreshed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots
          if git diff --cached --quiet; then
            echo "No baseline changes to commit"
            exit 0
          fi
          git commit -m "test: refresh case study typography baselines"
          git push origin HEAD:style/system-typography
