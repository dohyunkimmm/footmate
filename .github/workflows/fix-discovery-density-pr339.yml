name: Fix Discover Density PR339
on:
  push:
    branches: [polish/discover-card-density-20260926]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[discover-pr339-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/discover-card-density-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Repair Discover source and contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected source: {label}')
              return text.replace(old, new, 1)

          app_path=Path('src/v4/app.js')
          app=app_path.read_text()
          app=replace_once(app,
              "${topbar({title:'경기 찾기',actionHtml:`<button type=\"button\" class=\"fm-next-icon-button\" data-action=\"edit-setup\" aria-label=\"경기 조건 수정\">${icon('level')}</button>`})}",
              "${topbar({actionHtml:`<button type=\"button\" class=\"fm-next-icon-button\" data-action=\"edit-setup\" aria-label=\"경기 조건 수정\">${icon('level')}</button>`})}",
              'Discover topbar title')
          app=replace_once(app,
              '      <div class="fm-next-section-head"><div><h1>${state.region} 추천 경기</h1><p>${state.level} · ${state.position} 기준 · 가까운 순</p></div></div>',
              '      <div class="fm-next-section-head" data-discovery-heading hidden style="display:none"><div><h1></h1><p></p></div></div>',
              'Discover default heading')
          app_path.write_text(app)

          discovery_path=Path('src/v4/discovery.js')
          discovery=discovery_path.read_text()
          discovery=replace_once(discovery,
              '      <div class="fm-next-match-tags"><span class="fm-next-tag fm-next-tag--strong">${row.fit||match.fit}</span><span class="fm-next-tag">${match.distance}</span><span class="fm-next-tag">${spotLabel(match,state)}</span><span class="fm-next-tag" style="margin-left:auto">${match.level}</span></div>\n      <div class="fm-next-match-footer" style="justify-content:flex-end"><div class="fm-next-price">${money(match.price)}</div></div>',
              '      <div class="fm-next-match-tags"><span class="fm-next-tag fm-next-tag--strong">${row.fit||match.fit}</span><span class="fm-next-tag">${match.distance}</span><span class="fm-next-tag">${spotLabel(match,state)}</span><span class="fm-next-tag" style="margin-left:auto;white-space:nowrap">${match.level}</span></div>\n      <div class="fm-next-match-footer"><div><small>${match.region} · ${match.format} · ${match.duration}</small></div><div class="fm-next-price">${money(match.price)}</div></div>',
              'Discover card metadata')
          discovery=replace_once(discovery,
              "function compactDiscoveryHeader(screen){\n  const topbar=screen.querySelector('.fm-next-topbar');\n  const title=topbar?.querySelector(':scope > strong');\n  if(title?.textContent.trim()==='경기 찾기')title.remove();\n  topbar?.classList.remove('fm-next-topbar--titled');\n  screen.querySelector('.fm-next-section-head')?.remove();\n}\n\n",
              '',
              'runtime header remover')
          discovery=replace_once(discovery,'  compactDiscoveryHeader(screen);\n','', 'runtime header remover call')
          discovery_path.write_text(discovery)

          ai_path=Path('src/v5/ai-match-assistant.js')
          ai=ai_path.read_text()
          ai=replace_once(ai,
              "  const head=screen.querySelector('.fm-next-section-head');text(head?.querySelector('h1'),active&&saved?.result?'AI 조회 결과':'경기 찾기');text(head?.querySelector('p'),active&&saved?.result?'조회 결과를 필터와 정렬로 조정할 수 있어요.':'추천 기준을 유지한 채 전체 경기를 탐색할 수 있어요.');",
              "  const head=screen.querySelector('.fm-next-section-head');const showingAiResult=Boolean(active&&saved?.result);if(head){hidden(head,!showingAiResult);head.style.display=showingAiResult?'flex':'none'}text(head?.querySelector('h1'),showingAiResult?'AI 조회 결과':'');text(head?.querySelector('p'),showingAiResult?'조회 결과를 필터와 정렬로 조정할 수 있어요.':'');",
              'Discover AI-only heading')
          ai_path.write_text(ai)

          product_path=Path('tests/e2e/product-completion.spec.cjs')
          product=product_path.read_text()
          product=replace_once(product,
              "  await expect(screen.locator('.fm-next-section-head h1')).toHaveText('경기 찾기');",
              "  await expect(screen.locator('.fm-next-topbar > strong')).toHaveCount(0);\n  await expect(screen.locator('[data-discovery-heading]')).toBeHidden();",
              'default Discover heading contract')
          product_path.write_text(product)

          visual_path=Path('tests/e2e/v5.1-visual-system-completion.spec.cjs')
          visual=visual_path.read_text()
          visual=replace_once(visual,
              "  const discoverTopGap=await page.locator('[data-screen=\"discover\"]').evaluate(element=>{\n    const header=element.querySelector('.fm-next-topbar').getBoundingClientRect();\n    const heading=element.querySelector('.fm-next-section-head').getBoundingClientRect();\n    const title=element.querySelector('.fm-next-topbar>strong').getBoundingClientRect();\n    const app=element.closest('.fm-next-app').getBoundingClientRect();\n    return {gap:heading.top-header.bottom,titleCenter:title.left+title.width/2,appCenter:app.left+app.width/2};\n  });\n  expect(discoverTopGap.gap).toBeGreaterThanOrEqual(18);\n  expect(Math.abs(discoverTopGap.titleCenter-discoverTopGap.appCenter)).toBeLessThanOrEqual(1);",
              "  const discoverTopGap=await page.locator('[data-screen=\"discover\"]').evaluate(element=>{\n    const header=element.querySelector('.fm-next-topbar').getBoundingClientRect();\n    const conditions=element.querySelector('.fm-next-section > .fm-next-match-tags').getBoundingClientRect();\n    const heading=element.querySelector('[data-discovery-heading]');\n    return {gap:conditions.top-header.bottom,titleCount:element.querySelectorAll('.fm-next-topbar>strong').length,headingHidden:Boolean(heading?.hidden),headingDisplay:heading?getComputedStyle(heading).display:null};\n  });\n  expect(discoverTopGap.gap).toBeGreaterThanOrEqual(18);\n  expect(discoverTopGap.titleCount).toBe(0);\n  expect(discoverTopGap.headingHidden).toBe(true);\n  expect(discoverTopGap.headingDisplay).toBe('none');",
              'Discover desktop geometry contract')
          visual_path.write_text(visual)

          white_path=Path('tests/e2e/real-app-white-surface.spec.cjs')
          white=white_path.read_text()
          white=replace_once(white,
              "  await expect(screen).toBeVisible();\n  const media=screen.locator('.fm-next-match-card-media').first();",
              "  await expect(screen).toBeVisible();\n  await expect(screen.locator('.fm-next-topbar > strong')).toHaveCount(0);\n  await expect(screen.locator('[data-discovery-heading]')).toBeHidden();\n  const firstCard=screen.locator('.fm-next-match-card').first();\n  await expect(firstCard).not.toContainText('인조잔디');\n  await expect(firstCard.locator('.fm-next-match-tags .fm-next-tag').last()).toContainText(/입문|초중급|중급/);\n  await expect(firstCard.locator('.fm-next-match-footer small')).toContainText(/vs/);\n  const media=screen.locator('.fm-next-match-card-media').first();",
              'Discover surface regression assertions')
          white_path.write_text(white)
          PY
      - name: Syntax check changed JavaScript
        run: |
          node --check src/v4/app.js
          node --check src/v4/discovery.js
          node --check src/v5/ai-match-assistant.js
          node --check tests/e2e/product-completion.spec.cjs
          node --check tests/e2e/v5.1-visual-system-completion.spec.cjs
          node --check tests/e2e/real-app-white-surface.spec.cjs
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION" css-tree@3.1.0
          npx playwright install --with-deps chromium
      - name: Refresh affected Discover baselines
        run: |
          npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs -g "390px Discover uses the same neutral match surface system" --update-snapshots
          npx playwright test --project=chromium tests/e2e/product-completion.spec.cjs -g "Discover owns filters, sorting and whole-match exploration" --update-snapshots
          npx playwright test --project=chromium tests/e2e/v5.1-visual-system-completion.spec.cjs -g "1440px Home and Discover match|390px Discover does not claim personalization|px discover keeps matches scrollable" --update-snapshots
      - name: Compare affected Discover baselines and contracts
        run: |
          npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs -g "390px Discover uses the same neutral match surface system"
          npx playwright test --project=chromium tests/e2e/product-completion.spec.cjs -g "Home AI example executes search|Discover owns filters, sorting and whole-match exploration"
          npx playwright test --project=chromium tests/e2e/v5.1-visual-system-completion.spec.cjs -g "1440px Home and Discover match|390px Discover does not claim personalization|px discover keeps matches scrollable"
      - name: Commit repaired implementation and baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-discovery-density-pr339.yml
          git add -A
          git commit -m "fix: preserve Discover AI contract and refresh baselines [discover-pr339-repaired]"
          git push origin HEAD:polish/discover-card-density-20260926
