name: Refresh White Welcome Product Baseline
on:
  push:
    branches: [ui/real-app-white-surface-completion]
    paths:
      - .github/workflows/refresh-white-welcome-product-baseline.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Align Welcome contrast contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/e2e/v5.1-release-flow-review.spec.cjs')
          text=path.read_text()
          old="""    const color=await headline.evaluate(element=>getComputedStyle(element).color);\n    expect(color,`welcome headline color at ${viewport.name}px`).toBe('rgb(255, 255, 255)');\n    const topbar=page.locator('[data-screen=\"welcome\"] .fm-next-topbar--dark');\n    const background=await topbar.evaluate(element=>getComputedStyle(element).backgroundImage);\n    expect(background).toContain('linear-gradient');"""
          new="""    const color=await headline.evaluate(element=>getComputedStyle(element).color);\n    expect(color,`welcome headline color at ${viewport.name}px`).toBe('rgb(19, 32, 25)');\n    const topbar=page.locator('[data-screen=\"welcome\"] .fm-next-topbar--dark');\n    const background=await topbar.evaluate(element=>getComputedStyle(element).backgroundColor);\n    expect(background).toBe('rgba(255, 255, 255, 0.86)');"""
          if old not in text:
              raise SystemExit('Expected legacy Welcome contract not found')
          path.write_text(text.replace(old,new))
          PY
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh Welcome snapshots only
        run: npx playwright test tests/e2e/v5.1-release-flow-review.spec.cjs --grep "welcome hero keeps readable contrast" --update-snapshots
      - name: Commit Product contract
        run: |
          git status --short
          git add tests/e2e/v5.1-release-flow-review.spec.cjs tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-390-chromium-linux.png tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-1440-chromium-linux.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: align Welcome visual contract with white-first app"
          git push
