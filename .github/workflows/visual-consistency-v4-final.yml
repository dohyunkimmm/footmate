name: Visual Consistency V4 Final
on:
  push:
    branches: [design/visual-consistency-v4-20260928]
    paths:
      - .github/workflows/visual-consistency-v4-final.yml
permissions:
  contents: write
jobs:
  final-visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/visual-consistency-v4-20260928
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION" css-tree@3.1.0
      - name: Check integrated ownership and performance budget
        run: |
          node - <<'NODE'
          const fs=require('fs'),csstree=require('css-tree');
          const css=fs.readFileSync('src/v4/design-system-v2.css','utf8');
          const html=fs.readFileSync('app.html','utf8');
          const bootstrap=fs.readFileSync('src/v4/platform/presentation/bootstrap.js','utf8');
          if(!css.includes('Visual Consistency v4')||!css.includes('--fm-v4-consistency:1'))throw new Error('integrated visual consistency ownership missing');
          if(html.includes('/src/v4/visual-consistency-v4.css'))throw new Error('standalone consistency stylesheet returned');
          if(bootstrap.includes('visual-consistency-v4-compat'))throw new Error('compat stylesheet loader returned');
          csstree.parse(css);
          NODE
          node scripts/check-v4.9-performance-budget.cjs
      - name: Refresh impacted Product visual baselines
        run: >-
          npx playwright test --project=chromium
          tests/e2e/visual-consistency-v4.spec.cjs
          tests/e2e/v5.1-visual-system-completion.spec.cjs
          tests/e2e/v5.1-visual-baseline.spec.cjs
          tests/e2e/v5.1-release-flow-review.spec.cjs
          tests/e2e/real-app-white-surface.spec.cjs
          --update-snapshots
      - name: Compare impacted Product visual baselines without updates
        run: >-
          npx playwright test --project=chromium
          tests/e2e/visual-consistency-v4.spec.cjs
          tests/e2e/v5.1-visual-system-completion.spec.cjs
          tests/e2e/v5.1-visual-baseline.spec.cjs
          tests/e2e/v5.1-release-flow-review.spec.cjs
          tests/e2e/real-app-white-surface.spec.cjs
      - name: Run focused functional regression
        run: >-
          npx playwright test --project=chromium
          tests/e2e/welcome-position.spec.cjs
          tests/e2e/welcome-source-layout.spec.cjs
          tests/e2e/v4-participation.spec.cjs
          tests/e2e/v5.1-core.spec.cjs
      - name: Commit verified visual baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add 'tests/e2e/*-snapshots'
          if git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            echo 'No baseline changes to commit.'
            exit 0
          fi
          git -C "$GITHUB_WORKSPACE" commit -m "test: verify final visual consistency baselines"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:design/visual-consistency-v4-20260928
      - name: Upload final visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-consistency-v4-final-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
