name: MY Hub Snapshot Refresh
on:
  push:
    branches:
      - feat/my-matchday-hub-20260926
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/my-matchday-hub-20260926
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install visual QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
          npx playwright install --with-deps chromium
      - name: Refresh affected MY snapshots
        run: npx playwright test tests/e2e/my-fresh-profile-containment.spec.cjs tests/e2e/v4-personalization.spec.cjs --update-snapshots
      - name: Commit refreshed baselines
        run: |
          if git diff --quiet -- tests/e2e/*-snapshots; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/*-snapshots
          git commit -m "chore: refresh MY visual baselines"
          git push origin HEAD:feat/my-matchday-hub-20260926
