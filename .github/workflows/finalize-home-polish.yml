name: Finalize Home Polish
on:
  push:
    branches: [polish/home-ai-density-20260926]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/home-ai-density-20260926
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Align compact Home scroll contract
        run: |
          python -c "from pathlib import Path; p=Path('tests/e2e/v5.1-visual-system-completion.spec.cjs'); t=p.read_text(); old=\"    await screen.evaluate(element=>element.scrollTo({top:element.scrollHeight,behavior:'instant'}));\\n    await expect.poll(()=>screen.evaluate(element=>element.scrollTop)).toBeGreaterThan(0);\\n    const last=screen.locator('.fm-next-match-card').last();\"; new=\"    await screen.evaluate(element=>element.scrollTo({top:element.scrollHeight,behavior:'instant'}));\\n    if(metrics.scrollHeight>metrics.clientHeight)await expect.poll(()=>screen.evaluate(element=>element.scrollTop)).toBeGreaterThan(0);\\n    else expect(await screen.evaluate(element=>element.scrollTop)).toBe(0);\\n    const last=screen.locator('.fm-next-match-card').last();\"; p.write_text(t.replace(old,new,1)) if old in t else None"
      - name: Install Chromium QA
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
          npx playwright install --with-deps chromium
      - name: Refresh affected Home baselines
        run: |
          npx playwright test --project=chromium tests/e2e/product-completion.spec.cjs -g "Home" --update-snapshots
          npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs -g "Home|Welcome/Home/Discover" --update-snapshots
          npx playwright test --project=chromium tests/e2e/v5.1-visual-system-completion.spec.cjs -g "Home|home" --update-snapshots
          npx playwright test --project=chromium tests/e2e/v5.1-visual-baseline.spec.cjs -g "AI|ai" --update-snapshots
      - name: Commit final test and baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-visual-system-completion.spec.cjs tests/e2e/*-snapshots
          if ! git diff --cached --quiet; then
            git commit -m "test: update Home polish visual baselines"
            git pull --rebase origin polish/home-ai-density-20260926
            git push origin HEAD:polish/home-ai-density-20260926
          fi
