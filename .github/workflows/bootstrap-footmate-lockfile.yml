name: Temporary FootMate lockfile bootstrap
on:
  push:
    branches:
      - chore/bootstrap-footmate-lockfile-20261009
    paths:
      - .github/workflows/bootstrap-footmate-lockfile.yml
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'dohyunkimmm/footmate' && github.ref == 'refs/heads/chore/bootstrap-footmate-lockfile-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate deterministic dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile generated"; exit 1
          fi
          git commit -m "chore(deps): add verified npm lockfile"
          git push origin HEAD:chore/bootstrap-footmate-lockfile-20261009
