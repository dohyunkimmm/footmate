name: Fix Welcome Budget Temp
on:
  push:
    branches:
      - fix/welcome-brand-copy-offset-20260926
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/welcome-brand-copy-offset-20260926
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Recover shipped CSS budget without changing rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/v4/visual-polish.css')
          css=path.read_text()
          comments=["/* FootMate Real App visual system\n   Consolidates the previous polish batches and applies the visible redesign pass.\n   Preserve IA, copy, routes, state machines, recommendation ownership and sample data. */\n\n","/* Visual Redesign Pass · premium sport utility\n   Deep-green identity stays. Surfaces, typography, spacing and CTA hierarchy become visibly more editorial and product-like. */\n"]
          removed=0
          for comment in comments:
            if comment not in css:
              raise SystemExit('Expected CSS comment missing')
            removed+=len(comment.encode())
            css=css.replace(comment,'',1)
          path.write_text(css)
          print(f'Removed {removed} non-rendering CSS bytes')
          if removed < 200:
            raise SystemExit('Insufficient CSS budget recovery')
          PY
      - name: Check performance budget
        run: node scripts/check-v4.9-performance-budget.cjs
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" css-tree@3.1.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify exact geometry and visual comparisons
        run: |
          npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs --grep '1440px Welcome moves|390px Welcome|390px personalized Welcome'
          npx playwright test --project=chromium tests/e2e/v5.1-release-flow-review.spec.cjs --grep 'welcome hero keeps readable contrast'
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-welcome-budget-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep Welcome headroom within CSS budget'
          git push origin HEAD:fix/welcome-brand-copy-offset-20260926
