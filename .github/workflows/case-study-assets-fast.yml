name: FootMate Original Files QA
on:
  push:
    branches: ['improvement/footmate-case-study-qa-20261104']
    paths:
      - '.github/workflows/case-study-assets-fast.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Update original files and validate workbook and slides
        run: |
          set -euo pipefail
          python3 -m venv /tmp/footmate-files
          /tmp/footmate-files/bin/pip install --quiet python-pptx==1.0.2
          /tmp/footmate-files/bin/python qa/refine-case-study-assets.py
          /tmp/footmate-files/bin/python qa/improve-case-study-chart.py
          /tmp/footmate-files/bin/python - <<'PY'
          from zipfile import ZipFile
          from pptx import Presentation
          with ZipFile('src/case-study/downloads/footmate_model.xlsx') as z:
              assert z.testzip() is None
              assert 'xl/worksheets/sheet6.xml' in z.namelist()
          p = Presentation('src/case-study/downloads/footmate_report.pptx')
          assert len(p.slides) == 10
          assert any(s.has_chart for s in p.slides[4].shapes)
          print('PASS: all slides preserved and workbook has source-gated ledger checks')
          PY
      - name: Commit revised originals without touching runtime files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/case-study/downloads/footmate_model.xlsx src/case-study/downloads/footmate_report.pptx
          if git diff --cached --quiet; then
            echo 'PASS originals already current'
          else
            git commit -m 'docs: refine original FootMate financial model and slides'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
