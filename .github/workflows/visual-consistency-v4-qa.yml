name: Real App Visual Consistency V4 QA
on:
  pull_request:
    branches: [main]
    paths:
      - app.html
      - src/v4/visual-consistency-v4.css
      - tests/e2e/visual-consistency-v4.spec.cjs
      - tests/e2e/visual-consistency-v4.spec.cjs-snapshots/**
      - tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/**
      - tests/e2e/v5.1-visual-baseline.spec.cjs-snapshots/**
      - tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/**
      - tests/e2e/real-app-white-surface.spec.cjs-snapshots/**
      - .github/workflows/visual-consistency-v4-qa.yml
  push:
    branches: [main]
    paths:
      - app.html
      - src/v4/visual-consistency-v4.css
      - tests/e2e/visual-consistency-v4.spec.cjs
      - tests/e2e/visual-consistency-v4.spec.cjs-snapshots/**
      - tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/**
      - tests/e2e/v5.1-visual-baseline.spec.cjs-snapshots/**
      - tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/**
      - tests/e2e/real-app-white-surface.spec.cjs-snapshots/**
      - .github/workflows/visual-consistency-v4-qa.yml
permissions:
  contents: read
jobs:
  visual-consistency:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION" css-tree@3.1.0
      - name: Verify consistency layer ownership and CSS syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const csstree=require('css-tree');
          const html=fs.readFileSync('app.html','utf8');
          const css=fs.readFileSync('src/v4/visual-consistency-v4.css','utf8');
          if(!html.includes('/src/v4/visual-consistency-v4.css?v=1'))throw new Error('visual consistency stylesheet link missing');
          if(!css.includes('Visual Consistency v4'))throw new Error('visual consistency ownership marker missing');
          csstree.parse(css);
          console.log('PASS visual consistency ownership and CSS syntax');
          NODE
      - name: Compare final journey visual baselines
        run: npx playwright test --project=chromium tests/e2e/visual-consistency-v4.spec.cjs
      - name: Compare impacted established Product baselines
        run: npx playwright test --project=chromium tests/e2e/v5.1-visual-system-completion.spec.cjs tests/e2e/v5.1-visual-baseline.spec.cjs tests/e2e/v5.1-release-flow-review.spec.cjs tests/e2e/real-app-white-surface.spec.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-consistency-v4-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
