name: PR 218 Finalize v2

on:
  push:
    branches:
      - fix/product-flow-design-system-v2-20260923

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/product-flow-design-system-v2-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Sync latest main and apply requested corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit -X theirs
          python - <<'PY'
          from pathlib import Path
          import re

          # Visible setup terminology comes from source; canonical stored values stay compatible.
          p=Path('src/v4/app.js')
          text=p.read_text()
          text=text.replace("options:[['MF','미드필더'],['FW','포워드'],['DF','수비'],['GK','골키퍼']]", "options:[['MF','미드필더'],['FW','공격수'],['DF','수비'],['GK','골키퍼']]")
          if 'function setupDisplayValue' not in text:
              needle='\nfunction setupView(){'
              if needle not in text: raise SystemExit('setupView insertion point missing')
              text=text.replace(needle, "\nfunction setupDisplayValue(key,value){\n  if(key==='level')return {'초중급':'초급','중급+':'고급'}[value]||value;\n  return value;\n}\n\nfunction setupView(){",1)
          text=text.replace('<b>${value}</b><span>${desc}</span>', '<b>${setupDisplayValue(data.key,value)}</b><span>${desc}</span>')
          p.write_text(text)

          # Keep the restored narrow Auth contract non-grid on wide viewports.
          p=Path('app.html')
          text=p.read_text()
          text=text.replace('.fm-next-page[data-mode="real"] .fm-next-auth-v3 .fm-auth-card{width:calc(100% - 40px);display:block;', '.fm-next-page[data-mode="real"] .fm-next-auth-v3 .fm-auth-card{width:calc(100% - 40px);display:block;grid-template-columns:none;grid-template-rows:none;')
          p.write_text(text)

          # Real pointer and keyboard interaction feedback for AI examples.
          p=Path('src/v5/ai-match-assistant.css')
          text=p.read_text()
          marker='/* PR 218 interaction feedback final */'
          if marker not in text:
              text += '\n\n'+marker+'\n.fm-next-page[data-mode="real"] .fm-ai-examples button:hover,.fm-next-page[data-mode="real"] .fm-ai-examples button:focus{background:#eef4ea!important;border-color:#8fa69a!important}\n'
          p.write_text(text)

          # Replace obsolete 1040px/2-column desktop contract with the requested stable narrow shell.
          p=Path('tests/e2e/v5.1-decision-flow-polish.spec.cjs')
          text=p.read_text()
          pattern=r"test\('1440px Real App uses intentional desktop density through Detail, Checkout, and Success',async\(\{page\}\)=>\{.*?\n\}\);\n\n(?=test\('430px)"
          replacement="""test('1440px Real App keeps the stable narrow shell through Detail, Checkout, and Success',async({page})=>{\n  const errs=await openCleanApp(page,{width:1440,height:900});\n  await setupToHome(page);\n  await openFirstDetail(page);\n  const app=await rect(page.locator('.fm-next-app'));\n  expect(app.width).toBeGreaterThanOrEqual(558);\n  expect(app.width).toBeLessThanOrEqual(562);\n  const detailSections=await page.locator('[data-screen=\"detail\"]>.fm-next-detail-section').evaluateAll(nodes=>nodes.map(node=>{const box=node.getBoundingClientRect();return {x:box.x,y:box.y,width:box.width,height:box.height}}));\n  expect(detailSections.length).toBeGreaterThanOrEqual(4);\n  for(let index=0;index<detailSections.length;index+=1){\n    expect(detailSections[index].width).toBeGreaterThanOrEqual(490);\n    expect(detailSections[index].width).toBeLessThanOrEqual(525);\n    if(index>0){expect(detailSections[index].y).toBeGreaterThan(detailSections[index-1].y);expect(Math.abs(detailSections[index].x-detailSections[0].x)).toBeLessThanOrEqual(2);}\n  }\n  const sticky=await rect(page.locator('.fm-next-sticky-cta'));\n  expect(sticky.width).toBeGreaterThanOrEqual(534);\n  expect(sticky.width).toBeLessThanOrEqual(538);\n  await reachCheckout(page);\n  const checkoutSections=await page.locator('[data-screen=\"checkout\"]>.fm-next-detail-section').evaluateAll(nodes=>nodes.map(node=>{const box=node.getBoundingClientRect();return {x:box.x,y:box.y,width:box.width,height:box.height}}));\n  expect(checkoutSections.length).toBeGreaterThanOrEqual(2);\n  for(let index=0;index<checkoutSections.length;index+=1){\n    expect(checkoutSections[index].width).toBeGreaterThanOrEqual(490);\n    expect(checkoutSections[index].width).toBeLessThanOrEqual(525);\n    if(index>0){expect(checkoutSections[index].y).toBeGreaterThan(checkoutSections[index-1].y);expect(Math.abs(checkoutSections[index].x-checkoutSections[0].x)).toBeLessThanOrEqual(2);}\n  }\n  const submit=await rect(page.locator('[data-participation-submit]'));\n  expect(submit.width).toBeGreaterThanOrEqual(500);\n  expect(submit.width).toBeLessThanOrEqual(522);\n  expect(submit.height).toBeGreaterThanOrEqual(50);\n  await page.locator('[data-participation-submit]').click();\n  await expect(page.locator('[data-screen=\"success\"]')).toBeVisible({timeout:5000});\n  const ticket=await rect(page.locator('.fm-next-ticket'));\n  expect(ticket.width).toBeGreaterThanOrEqual(250);\n  expect(ticket.width).toBeLessThanOrEqual(app.width-40);\n  const successActions=await page.locator('[data-screen=\"success\"] .fm-next-actions .fm-next-button').evaluateAll(nodes=>nodes.map(node=>{const box=node.getBoundingClientRect();return {x:box.x,y:box.y,width:box.width,height:box.height,bottom:box.bottom}}));\n  expect(successActions).toHaveLength(2);\n  expect(successActions[1].y).toBeGreaterThanOrEqual(successActions[0].bottom);\n  for(const action of successActions){expect(action.width).toBeGreaterThanOrEqual(250);expect(action.width).toBeLessThanOrEqual(app.width-40);}\n  expect(errs).toEqual([]);\n});\n\n"""
          if 'uses intentional desktop density' in text:
              text,count=re.subn(pattern,replacement,text,flags=re.S)
              if count!=1: raise SystemExit(f'decision-flow replacement count={count}')
          elif 'keeps the stable narrow shell' not in text: raise SystemExit('decision-flow contract missing')
          p.write_text(text)

          p=Path('tests/e2e/v5.1-visual-baseline.spec.cjs')
          text=p.read_text()
          pattern=r"test\('1440px Home and Discover use intentional two-column card density',async\(\{page\}\)=>\{.*?\n\}\);\n\n(?=test\('390px decision)"
          replacement="""test('1440px Home and Discover preserve the stable narrow card density',async({page})=>{\n  const errs=await openCleanApp(page,{width:1440,height:900});\n  await setup(page);\n  const homeList=page.locator('[data-screen=\"home\"]>.fm-next-list');\n  const homeCards=page.locator('[data-screen=\"home\"]>.fm-next-list .fm-next-match-card');\n  await expect(homeCards).toHaveCount(2);\n  await expect.poll(()=>gridColumnCount(homeList)).toBe(1);\n  for(const width of await cardWidths(homeCards))expect(width).toBeGreaterThanOrEqual(500);\n  await page.getByRole('button',{name:'전체 보기'}).click();\n  await expect(page.locator('[data-screen=\"discover\"]')).toBeVisible();\n  const discoverList=page.locator('[data-screen=\"discover\"] .fm-next-list');\n  const discoverCards=page.locator('[data-screen=\"discover\"] .fm-next-list .fm-next-match-card');\n  expect(await discoverCards.count()).toBeGreaterThanOrEqual(2);\n  await expect.poll(()=>gridColumnCount(discoverList)).toBe(1);\n  for(const width of await cardWidths(discoverCards))expect(width).toBeGreaterThanOrEqual(500);\n  const overflow=await page.evaluate(()=>({viewport:innerWidth,document:document.documentElement.scrollWidth,body:document.body.scrollWidth}));\n  expect(overflow.document).toBeLessThanOrEqual(overflow.viewport);\n  expect(overflow.body).toBeLessThanOrEqual(overflow.viewport);\n  expect(errs).toEqual([]);\n});\n\n"""
          if 'use intentional two-column card density' in text:
              text,count=re.subn(pattern,replacement,text,flags=re.S)
              if count!=1: raise SystemExit(f'visual-baseline replacement count={count}')
          elif 'preserve the stable narrow card density' not in text: raise SystemExit('visual baseline density contract missing')
          p.write_text(text)

          p=Path('tests/e2e/v5.1-design-system-v2.spec.cjs')
          text=p.read_text()
          text=text.replace('expect(parseFloat(geometry.borderRadius)).toBeLessThanOrEqual(1);', "expect(parseFloat(geometry.borderRadius)).toBeGreaterThanOrEqual(28);\n  expect(parseFloat(geometry.borderRadius)).toBeLessThanOrEqual(36);")
          text=text.replace('expect(navGeometry.width).toBeGreaterThanOrEqual(558);\n  expect(navGeometry.width).toBeLessThanOrEqual(562);', 'expect(navGeometry.width).toBeGreaterThanOrEqual(534);\n  expect(navGeometry.width).toBeLessThanOrEqual(538);')
          p.write_text(text)

          p=Path('tests/e2e/v5.1-visual-system-completion.spec.cjs')
          text=p.read_text()
          old="""  const columns=await authCard.evaluate(element=>getComputedStyle(element).gridTemplateColumns.split(' ').filter(Boolean).length);\n  expect(columns).toBe(2);"""
          new="""  const authDisplay=await authCard.evaluate(element=>getComputedStyle(element).display);\n  expect(authDisplay).not.toBe('grid');"""
          if old in text: text=text.replace(old,new,1)
          elif new not in text: raise SystemExit('Auth layout assertion pattern missing')
          p.write_text(text)
          PY
      - name: Install browser QA dependencies
        run: npm install --no-save @playwright/test@1.55.1 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh intentionally changed baselines
        run: >-
          npx playwright test
          tests/e2e/v5.1-visual-baseline.spec.cjs
          tests/e2e/v5.1-visual-system-completion.spec.cjs
          tests/e2e/v5.1-design-system-v2.spec.cjs
          tests/e2e/v5.1-release-flow-review.spec.cjs
          tests/e2e/v5.1-case-study-visual.spec.cjs
          --update-snapshots
      - name: Compare corrected Product surfaces
        run: >-
          npx playwright test
          tests/e2e/v5.1-product-integrity.spec.cjs
          tests/e2e/v5.1-decision-flow-polish.spec.cjs
          tests/e2e/v5.1-visual-baseline.spec.cjs
          tests/e2e/v5.1-visual-system-completion.spec.cjs
          tests/e2e/v5.1-design-system-v2.spec.cjs
          tests/e2e/v5.1-release-flow-review.spec.cjs
          tests/e2e/v5.1-case-study-visual.spec.cjs
      - name: Commit verified corrections and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr218-finalize-v2.yml
          git checkout -- package-lock.json 2>/dev/null || true
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: finalize requested Product flow corrections"
          git push origin HEAD:fix/product-flow-design-system-v2-20260923
