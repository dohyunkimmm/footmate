name: V3 Equivalent Scope Compact

on:
  push:
    branches:
      - design/visual-hierarchy-v3-20260927
    paths:
      - .github/workflows/v3-selector-compact.yml

permissions:
  contents: write

jobs:
  compact-and-verify:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/visual-hierarchy-v3-20260927
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore reviewed CSS and compact equivalent real-app scope
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=3f49fb5b682f3967130de23b5f37420fe133e145
          for file in src/v4/app.css src/v4/design-system-v2.css src/v4/visual-polish.css src/v5/ai-match-assistant.css; do
            git show "$BASE:$file" > "$file"
          done
          npm install --no-save --ignore-scripts csso@5.0.5 css-tree@3.1.0 @playwright/test@1.55.1 @axe-core/playwright@4.10.2
          node <<'NODE'
          const fs=require('fs');
          const csso=require('csso');
          const csstree=require('css-tree');
          const {chromium}=require('@playwright/test');
          (async()=>{
            const appPath='src/v4/app.js';
            let appSource=fs.readFileSync(appPath,'utf8');
            const appNeedle="  const activeScreen=root.querySelector('[data-screen]');";
            const appMarker="  root.querySelector('.fm-next-app')?.classList.toggle('fm-v3',mode==='real'&&!embed);\n"+appNeedle;
            if(!appSource.includes("classList.toggle('fm-v3'")){
              if(!appSource.includes(appNeedle)) throw new Error('app marker insertion point missing');
              appSource=appSource.replace(appNeedle,appMarker);
              fs.writeFileSync(appPath,appSource);
            }

            const design='src/v4/design-system-v2.css';
            const source=fs.readFileSync(design,'utf8');
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            await page.setContent('<!doctype html><html><head></head><body></body></html>');
            await page.addStyleTag({content:source});
            let effective=await page.evaluate(()=>Array.from(document.styleSheets[0].cssRules,rule=>rule.cssText).join('\n'));
            await browser.close();
            const scope='.fm-next-page[data-mode="real"] .fm-next-app:not([data-embed="true"])';
            const equivalentScope='.fm-v3.fm-v3.fm-v3.fm-v3';
            const scopeCount=effective.split(scope).length-1;
            if(scopeCount<10) throw new Error(`unexpected real-app scope count: ${scopeCount}`);
            effective=effective.split(scope).join(equivalentScope);
            const vars={
              '--fm-v3-ink':'--v3-i','--fm-v3-text':'--v3-t','--fm-v3-muted':'--v3-m',
              '--fm-v3-brand':'--v3-b','--fm-v3-brand-2':'--v3-b2','--fm-v3-brand-soft':'--v3-bs',
              '--fm-v3-accent':'--v3-a','--fm-v3-accent-soft':'--v3-as','--fm-v3-line':'--v3-l',
              '--fm-v3-line-strong':'--v3-ls','--fm-v3-canvas':'--v3-c','--fm-v3-subtle':'--v3-u',
              '--fm-v3-shadow':'--v3-s','--fm-v3-shadow-raised':'--v3-sr',
              '--fm-v3-radius-lg':'--v3-rl','--fm-v3-radius-md':'--v3-rm','--fm-v3-radius-sm':'--v3-rs'
            };
            for(const [from,to] of Object.entries(vars)) effective=effective.split(from).join(to);
            const compactDesign=csso.minify(effective,{restructure:true}).css;
            const markers=[
              '/* FootMate Design System v2 */',
              '/* White-first Real App surface ownership */',
              '/* Product completion compatibility ownership */',
              '/* FootMate Real App Visual Finish · P0–P2 */',
              '/* FootMate Real App · Visual Hierarchy v3 */'
            ].join('\n');
            const designOutput=markers+'\n'+compactDesign+'\n';
            csstree.parse(designOutput);
            fs.writeFileSync(design,designOutput);
            console.log(`design: ${Buffer.byteLength(source)} -> ${Buffer.byteLength(designOutput)}; scopes=${scopeCount}`);
            const modules=[
              'src/v4/app.css','src/v4/experience.css','src/v4/discovery.css','src/v4/decision.css',
              'src/v4/participation.css','src/v4/matchday.css','src/v4/return.css','src/v4/personalization.css',
              'src/v4/visual-polish.css','src/v5/ai-match-assistant.css'
            ];
            for(const file of modules){
              const css=fs.readFileSync(file,'utf8');
              const compact=csso.minify(css,{restructure:true}).css+'\n';
              fs.writeFileSync(file,compact);
              console.log(`${file}: ${Buffer.byteLength(css)} -> ${Buffer.byteLength(compact)}`);
            }
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          node scripts/check-v4.9-performance-budget.cjs
      - name: Verify reviewed visual baselines before commit
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/e2e/real-app-white-surface.spec.cjs tests/e2e/priority-ux.spec.cjs tests/e2e/my-fresh-profile-containment.spec.cjs tests/e2e/welcome-position.spec.cjs tests/e2e/welcome-source-layout.spec.cjs tests/e2e/product-completion.spec.cjs tests/e2e/real-app-visual-finish.spec.cjs
          npx playwright test --project=chromium tests/e2e/checkin-state.spec.cjs tests/e2e/v4-matchday.spec.cjs tests/e2e/v5.1-release-flow-review.spec.cjs tests/e2e/v5.1-visual-system-completion.spec.cjs --grep 'check-in|MY match hub visual regression|checked-in continuation action|1440px Matchday panel|1440px joined Schedule'
      - name: Commit verified equivalent-scope compaction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v3-selector-compact.yml
          git add -A
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'perf: compact equivalent real-app CSS scope'
          git push origin HEAD:design/visual-hierarchy-v3-20260927
