name: Approved V3 CSS Set Verification

on:
  push:
    branches:
      - design/visual-hierarchy-v3-20260927
    paths:
      - .github/workflows/v3-selector-compact.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/visual-hierarchy-v3-20260927
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore complete CSS set used for approved v3 baselines
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          APPROVED=2c4eac627d0f5a1cf075f1ac1f38823c745961e8
          for file in src/v4/app.css src/v4/design-system-v2.css src/v4/visual-polish.css src/v5/ai-match-assistant.css; do
            git show "$APPROVED:$file" > "$file"
          done
          npm install --no-save --ignore-scripts @playwright/test@1.55.1 @axe-core/playwright@4.10.2
          node scripts/check-v4.9-performance-budget.cjs
      - name: Verify current approved visual baselines
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/e2e/real-app-white-surface.spec.cjs tests/e2e/priority-ux.spec.cjs tests/e2e/my-fresh-profile-containment.spec.cjs tests/e2e/welcome-position.spec.cjs tests/e2e/welcome-source-layout.spec.cjs tests/e2e/product-completion.spec.cjs tests/e2e/real-app-visual-finish.spec.cjs
          npx playwright test --project=chromium tests/e2e/checkin-state.spec.cjs tests/e2e/v4-matchday.spec.cjs tests/e2e/v5.1-release-flow-review.spec.cjs tests/e2e/v5.1-visual-system-completion.spec.cjs --grep 'check-in|MY match hub visual regression|checked-in continuation action|1440px Matchday panel|1440px joined Schedule'
      - name: Commit verified approved v3 CSS set
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v3-selector-compact.yml
          git add -A
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: restore approved visual hierarchy CSS set'
          git push origin HEAD:design/visual-hierarchy-v3-20260927
