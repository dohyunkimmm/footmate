name: V3 Browser-Effective CSS Compact

on:
  push:
    branches:
      - design/visual-hierarchy-v3-20260927
    paths:
      - .github/workflows/v3-selector-compact.yml

permissions:
  contents: write

jobs:
  compact-and-verify:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/visual-hierarchy-v3-20260927
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore reviewed CSS and compact browser-effective rules
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE=3f49fb5b682f3967130de23b5f37420fe133e145
          for file in src/v4/app.css src/v4/design-system-v2.css src/v4/visual-polish.css src/v5/ai-match-assistant.css; do
            git show "$BASE:$file" > "$file"
          done
          npm install --no-save --ignore-scripts csso@5.0.5 css-tree@3.1.0 @playwright/test@1.55.1 @axe-core/playwright@4.10.2
          node <<'NODE'
          const fs=require('fs');
          const csso=require('csso');
          const csstree=require('css-tree');
          const {chromium}=require('@playwright/test');
          (async()=>{
            const design='src/v4/design-system-v2.css';
            const source=fs.readFileSync(design,'utf8');
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            await page.setContent('<!doctype html><html><head></head><body></body></html>');
            await page.addStyleTag({content:source});
            const effective=await page.evaluate(()=>Array.from(document.styleSheets[0].cssRules,rule=>rule.cssText).join('\n'));
            await browser.close();
            const compactDesign=csso.minify(effective,{restructure:true}).css;
            const markers=[
              '/* FootMate Design System v2 */',
              '/* White-first Real App surface ownership */',
              '/* Product completion compatibility ownership */',
              '/* FootMate Real App Visual Finish · P0–P2 */',
              '/* FootMate Real App · Visual Hierarchy v3 */'
            ].join('\n');
            const designOutput=markers+'\n'+compactDesign+'\n';
            csstree.parse(designOutput);
            fs.writeFileSync(design,designOutput);
            console.log(`design: ${Buffer.byteLength(source)} -> ${Buffer.byteLength(designOutput)}`);
            const modules=[
              'src/v4/app.css','src/v4/experience.css','src/v4/discovery.css','src/v4/decision.css',
              'src/v4/participation.css','src/v4/matchday.css','src/v4/return.css','src/v4/personalization.css',
              'src/v4/visual-polish.css','src/v5/ai-match-assistant.css'
            ];
            for(const file of modules){
              const css=fs.readFileSync(file,'utf8');
              const compact=csso.minify(css,{restructure:true}).css+'\n';
              fs.writeFileSync(file,compact);
              console.log(`${file}: ${Buffer.byteLength(css)} -> ${Buffer.byteLength(compact)}`);
            }
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          node scripts/check-v4.9-performance-budget.cjs
      - name: Verify reviewed visual baselines before commit
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/e2e/real-app-white-surface.spec.cjs tests/e2e/priority-ux.spec.cjs tests/e2e/my-fresh-profile-containment.spec.cjs tests/e2e/welcome-position.spec.cjs tests/e2e/welcome-source-layout.spec.cjs tests/e2e/product-completion.spec.cjs tests/e2e/real-app-visual-finish.spec.cjs
          npx playwright test --project=chromium tests/e2e/checkin-state.spec.cjs tests/e2e/v4-matchday.spec.cjs tests/e2e/v5.1-release-flow-review.spec.cjs tests/e2e/v5.1-visual-system-completion.spec.cjs --grep 'check-in|MY match hub visual regression|checked-in continuation action|1440px Matchday panel|1440px joined Schedule'
      - name: Commit verified browser-effective compaction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v3-selector-compact.yml
          git add -A
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'perf: compact browser-effective CSS without visual changes'
          git push origin HEAD:design/visual-hierarchy-v3-20260927
