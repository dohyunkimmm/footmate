name: V3 Baseline Review Artifact

on:
  push:
    branches:
      - design/visual-hierarchy-v3-20260927
    paths:
      - .github/workflows/v3-selector-compact.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/visual-hierarchy-v3-20260927
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore reviewed v3 runtime CSS and generate candidate baselines
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          APPROVED=35e9ec32f8c99033044b5ea7cb70c60c980827ef
          for file in src/v4/app.css src/v4/design-system-v2.css src/v4/visual-polish.css src/v5/ai-match-assistant.css; do
            git show "$APPROVED:$file" > "$file"
          done
          npm install --no-save --ignore-scripts @playwright/test@1.55.1 @axe-core/playwright@4.10.2
          node scripts/check-v4.9-performance-budget.cjs
          npx playwright test --project=chromium \
            tests/e2e/real-app-white-surface.spec.cjs \
            tests/e2e/priority-ux.spec.cjs \
            tests/e2e/my-fresh-profile-containment.spec.cjs \
            tests/e2e/product-completion.spec.cjs \
            --update-snapshots
          npx playwright test --project=chromium \
            tests/e2e/checkin-state.spec.cjs \
            tests/e2e/v4-matchday.spec.cjs \
            tests/e2e/v5.1-release-flow-review.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs \
            --grep 'check-in|MY match hub visual regression|checked-in continuation action|1440px Matchday panel|1440px joined Schedule' \
            --update-snapshots
          mkdir -p review-before review-after
          git diff --name-only -- '*.png' > review-changed.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            mkdir -p "review-before/$(dirname "$file")" "review-after/$(dirname "$file")"
            git show "HEAD:$file" > "review-before/$file"
            cp "$file" "review-after/$file"
          done < review-changed.txt
          cat review-changed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v3-baseline-review-${{ github.run_id }}
          path: |
            review-before
            review-after
            review-changed.txt
          if-no-files-found: error
          retention-days: 1
