name: PR341 Refresh Home Baselines

on:
  push:
    branches: [polish/home-ai-compact-20260926]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[pr341-baselines]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: polish/home-ai-compact-20260926

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Align Home AI copy and density contract
        run: |
          python - <<'PY'
          from pathlib import Path

          target = 'AI에게 원하는 경기를 검색해보세요.'
          replacements = {
              Path('src/v5/ai-match-assistant.js'): [
                  ('AI에게 원하는 경기를 말해보세요.', target),
              ],
              Path('app.html'): [
                  ('AI에게 원하는 경기를 말해보세요.', target),
                  ('원하는 경기를 말해보세요.', target),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              before = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text == before:
                  raise SystemExit(f'expected copy not found in {path}')
              path.write_text(text, encoding='utf-8')

          for path in Path('tests').rglob('*'):
              if not path.is_file() or path.suffix not in {'.cjs', '.mjs', '.js'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('AI에게 원하는 경기를 말해보세요.', target).replace('원하는 경기를 말해보세요.', target)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          density_path = Path('tests/e2e/v5.1-visual-system-completion.spec.cjs')
          density_text = density_path.read_text(encoding='utf-8')
          old = """    await screen.evaluate(element=>element.scrollTo({top:element.scrollHeight,behavior:'instant'}));\n    await expect.poll(()=>screen.evaluate(element=>element.scrollTop)).toBeGreaterThan(0);\n"""
          new = """    await screen.evaluate(element=>element.scrollTo({top:element.scrollHeight,behavior:'instant'}));\n    if(metrics.scrollHeight>metrics.clientHeight){\n      await expect.poll(()=>screen.evaluate(element=>element.scrollTop)).toBeGreaterThan(0);\n    }\n"""
          if old not in density_text:
              raise SystemExit('expected Home density scroll contract not found')
          density_path.write_text(density_text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Install browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
          npx playwright install --with-deps chromium

      - name: Refresh affected Home screenshot baselines
        run: |
          npx playwright test --project=chromium \
            tests/e2e/v5.1-visual-baseline.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs \
            tests/e2e/v5.1-release-flow-review.spec.cjs \
            --update-snapshots

      - name: Commit source and approved visual baseline updates
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html src/v5/ai-match-assistant.js tests
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "test: align Home AI copy and refresh baselines [pr341-baselines]"
          git push origin HEAD:polish/home-ai-compact-20260926
