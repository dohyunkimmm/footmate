name: Visual Baseline Bootstrap
on:
  push:
    branches: [test/visual-baseline-gate]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/visual-baseline-gate
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate approved Linux Chromium baselines
        run: npx playwright test tests/e2e/v5.1-visual-baseline.spec.cjs --update-snapshots
      - name: Commit generated visual baselines to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-visual-baseline.spec.cjs-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit"
            exit 0
          fi
          git commit -m "test: bootstrap visual baseline snapshots"
          git push origin HEAD:test/visual-baseline-gate
