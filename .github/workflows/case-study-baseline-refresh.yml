name: Case Study Baseline Refresh

on:
  push:
    branches:
      - content/case-study-final-copy-qa-v2
    paths:
      - 'src/v5/case-study-connected.js'
      - 'tests/e2e/v5.1-case-study-visual.spec.cjs'
      - '.github/workflows/case-study-baseline-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate Case Study screenshot baselines
        run: npx playwright test tests/e2e/v5.1-case-study-visual.spec.cjs --update-snapshots
      - name: Commit generated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes"
            exit 0
          fi
          git commit -m "test: approve Case Study copy visual baselines"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload generated baselines
        uses: actions/upload-artifact@v6
        with:
          name: case-study-baselines-${{ github.run_id }}
          path: tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/
          if-no-files-found: error
          retention-days: 7
