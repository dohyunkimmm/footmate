name: Temporary Case Study Baseline Refresh
on:
  push:
    branches:
      - fix/case-study-english-toc-layout
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[case-study-baseline]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', package-manager-cache: false}
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Generate approved 13-section Case Study baselines
        run: npx playwright test tests/e2e/v5.1-case-study-visual.spec.cjs --update-snapshots
      - name: Compare against generated baselines
        run: npx playwright test tests/e2e/v5.1-case-study-visual.spec.cjs
      - name: Commit baseline files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots
          if git diff --cached --quiet; then
            echo 'No baseline changes.'
            exit 0
          fi
          git commit -m 'test: refresh 13-section Case Study baselines [case-study-baseline]'
          git push
