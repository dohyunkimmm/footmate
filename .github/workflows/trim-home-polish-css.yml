name: Trim Home Polish CSS
on:
  push:
    branches: [polish/home-ai-density-20260926]
permissions:
  contents: write
jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/home-ai-density-20260926
      - name: Remove obsolete Home greeting styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/v5/ai-match-assistant.css')
          t=p.read_text()
          obsolete='.fm-next-page[data-mode="real"] [data-screen="home"] .fm-next-greeting{padding:12px 0 2px}.fm-next-page[data-mode="real"] [data-screen="home"] .fm-next-greeting small{margin-bottom:3px;color:#35634f;font-size:10px;font-weight:800;letter-spacing:.08em}.fm-next-page[data-mode="real"] [data-screen="home"] .fm-next-greeting h1{max-width:340px;font-size:26px;line-height:1.2}\n'
          if obsolete not in t: raise SystemExit('obsolete greeting CSS not found')
          p.write_text(t.replace(obsolete,'',1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v5/ai-match-assistant.css
          git commit -m "polish: remove obsolete Home greeting styles"
          git push origin HEAD:polish/home-ai-density-20260926
