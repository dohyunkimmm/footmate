name: Real App Snapshot Refresh
on:
  push:
    branches: [fix/real-app-mobile-shell]
permissions:
  contents: write
concurrency:
  group: real-app-snapshot-refresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh approved Real App shell baselines
        run: >-
          npx playwright test --project=chromium --update-snapshots=all
          tests/e2e/v5.1-design-system-v2.spec.cjs
          tests/e2e/v5.1-release-flow-review.spec.cjs
          tests/e2e/v5.1-visual-baseline.spec.cjs
          tests/e2e/v5.1-visual-system-completion.spec.cjs
      - name: Commit refreshed visual baselines
        run: |
          git add \
            tests/e2e/v5.1-design-system-v2.spec.cjs-snapshots \
            tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots \
            tests/e2e/v5.1-visual-baseline.spec.cjs-snapshots \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots
          if git diff --cached --quiet; then
            echo "No baseline changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: refresh Real App shell visual baselines"
          git push origin HEAD:fix/real-app-mobile-shell
