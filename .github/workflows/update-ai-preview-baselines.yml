name: Update AI Preview Visual Baselines

on:
  pull_request:
    branches: [main]
    paths:
      - src/v4/case-study-layout-refinement.css
      - .github/workflows/update-ai-preview-baselines.yml

permissions:
  contents: write

jobs:
  update-baselines:
    if: github.head_ref == 'fix/case-study-ai-preview-spacing-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify installed QA toolchain
        run: node scripts/check-qa-toolchain.cjs

      - name: Regenerate Case Study baselines
        run: npx playwright test tests/e2e/v5.1-case-study-visual.spec.cjs --project=chromium --update-snapshots

      - name: Commit reviewed baseline changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-case-study-visual.spec.cjs-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "test: update AI case study visual baselines"
          git push origin HEAD:${{ github.head_ref }}
