name: Temporary Remove AI Core Label
on:
  push:
    branches: [fix/remove-ai-core-label-real-app-20260927]
    paths:
      - .github/workflows/tmp-remove-ai-core-label.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Remove duplicate AI presentation label and align contract
        run: |
          python - <<'PY'
          from pathlib import Path

          bootstrap = Path('src/v5/presentation/bootstrap.js')
          text = bootstrap.read_text()
          old = "    if(!card.querySelector('[data-ai-core-label]'))card.insertAdjacentHTML('afterbegin','<div class=\"fm-ai-core-label\" data-ai-core-label><span>CORE FEATURE</span><b>AI MATCHING</b></div>');"
          new = "    card.querySelectorAll('[data-ai-core-label]').forEach(label=>label.remove());"
          if old not in text:
              raise SystemExit('bootstrap target not found')
          bootstrap.write_text(text.replace(old, new, 1))

          spec = Path('tests/e2e/v5.1-release-flow-review.spec.cjs')
          text = spec.read_text()
          old = "  await expect(card.locator('.fm-ai-core-label')).toBeVisible();"
          new = "  await expect(card.locator('[data-ai-core-label]')).toHaveCount(0);"
          if old not in text:
              raise SystemExit('test target not found')
          spec.write_text(text.replace(old, new, 1))
          PY
      - name: Commit runtime and contract fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v5/presentation/bootstrap.js tests/e2e/v5.1-release-flow-review.spec.cjs
          git commit -m "fix: remove duplicate AI matching label"
          git push origin HEAD:fix/remove-ai-core-label-real-app-20260927
