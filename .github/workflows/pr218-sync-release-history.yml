name: PR218 Release History Sync

on:
  push:
    branches:
      - docs/sync-pr218-20260923

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync release history and remove temporary workflow
        shell: bash
        env:
          SECTION_B64: 
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path('docs/RELEASE-HISTORY.md')
          text = path.read_text(encoding='utf-8')
          marker = '## v5.1.1 — AI Match Assistant Resilience Patch · 2026-09-20'
          section = base64.b64decode(__import__('os').environ['SECTION_B64']).decode('utf-8')
          if 'Runtime PR: #218' not in text:
              if marker not in text:
                  raise SystemExit('release history insertion marker not found')
              path.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/pr218-sync-release-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RELEASE-HISTORY.md .github/workflows/pr218-sync-release-history.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: sync PR 218 release closure"
          git push origin HEAD:docs/sync-pr218-20260923
