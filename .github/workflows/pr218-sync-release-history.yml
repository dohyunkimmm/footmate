name: PR218 Release History Typo Fix

on:
  push:
    branches:
      - docs/sync-pr218-20260923

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fix release history typo and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/RELEASE-HISTORY.md')
          text = path.read_text(encoding='utf-8')
          if '첨 화면' not in text:
              raise SystemExit('expected typo not found')
          path.write_text(text.replace('첨 화면', '첫 화면', 1), encoding='utf-8')
          PY
          rm -f .github/workflows/pr218-sync-release-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RELEASE-HISTORY.md .github/workflows/pr218-sync-release-history.yml
          git commit -m "docs: fix PR 218 release history wording"
          git push origin HEAD:docs/sync-pr218-20260923
