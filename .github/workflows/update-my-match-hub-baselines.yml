name: Repair and refresh MY match hub QA
on:
  push:
    branches:
      - feat/my-match-hub-3tab-20260927
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Align MY ownership contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path=Path('src/v4/design-system-v2.css')
          css=css_path.read_text()
          old='[data-screen="schedule"][data-matchday-module-version]'
          new=':is([data-screen="profile"],[data-screen="schedule"]) [data-my-matches][data-matchday-module-version]'
          count=css.count(old)
          if count < 1:
              raise SystemExit('legacy schedule matchday selector not found')
          css=css.replace(old+' .fm-next-section{',new+'{')
          css=css.replace(old,new)
          if old in css:
              raise SystemExit('legacy schedule matchday selector remains')

          compact_pairs=[
            ('padding:14px 16px;','padding:11px 16px;'),
            ('margin-bottom:10px;','margin-bottom:8px;'),
            ('margin-top:10px;','margin-top:8px;'),
          ]
          anchors=[
            new+' .fm-next-upcoming{',
            new+' .fm-next-upcoming-top{',
            new+' .fm-next-upcoming-actions{',
          ]
          for anchor,(before,after) in zip(anchors,compact_pairs):
              start=css.find(anchor)
              if start < 0:
                  raise SystemExit(f'compact anchor missing: {anchor}')
              end=css.find('}',start)
              block=css[start:end]
              if before not in block:
                  raise SystemExit(f'compact value missing in {anchor}: {before}')
              css=css[:start]+block.replace(before,after,1)+css[end:]
          css_path.write_text(css)

          test_path=Path('tests/e2e/v5.1-visual-system-completion.spec.cjs')
          test=test_path.read_text()
          old_block='''test('1440px Schedule empty and Profile match the completed product surfaces',async({page})=>{\n  const errs=await openCleanApp(page,{width:1440,height:900});\n  await setupToHome(page);\n  await page.getByRole('button',{name:'내 경기'}).click();\n  await expect(page.locator('[data-screen="schedule"]')).toBeVisible();\n  await page.mouse.move(1,1);\n  await expect(page).toHaveScreenshot('visual-system-schedule-empty-1440.png',exactScreenshot);\n  await page.getByRole('button',{name:'MY'}).click();\n  await expect(page.locator('[data-screen="profile"]')).toBeVisible();\n  await page.mouse.move(1,1);\n  await expect(page).toHaveScreenshot('visual-system-profile-1440.png',exactScreenshot);\n  await expectNoHorizontalOverflow(page);\n  await expectDocumentLocked(page);\n  expect(errs).toEqual([]);\n});'''
          new_block='''test('1440px MY owns the empty match state and Profile matches the completed product surface',async({page})=>{\n  const errs=await openCleanApp(page,{width:1440,height:900});\n  await setupToHome(page);\n  await page.getByRole('button',{name:'MY'}).click();\n  const profile=page.locator('[data-screen="profile"]');\n  const hub=profile.locator('[data-my-matches]');\n  await expect(profile).toBeVisible();\n  await expect(hub).toContainText('아직 참가한 경기가 없어요.');\n  await expect(hub.getByRole('button',{name:'경기 찾기'})).toBeVisible();\n  await page.mouse.move(1,1);\n  await expect(page).toHaveScreenshot('visual-system-profile-1440.png',exactScreenshot);\n  await expectNoHorizontalOverflow(page);\n  await expectDocumentLocked(page);\n  expect(errs).toEqual([]);\n});'''
          if test.count(old_block) != 1:
              raise SystemExit(f'expected one outdated schedule/profile test block, found {test.count(old_block)}')
          test=test.replace(old_block,new_block)
          test_path.write_text(test)
          PY
      - name: Install browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION" css-tree@3.1.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Regenerate intentionally changed visual baselines
        run: |
          npx playwright test --project=chromium --update-snapshots=all \
            tests/e2e/real-app-white-surface.spec.cjs \
            tests/e2e/my-fresh-profile-containment.spec.cjs \
            tests/e2e/product-completion.spec.cjs \
            tests/e2e/v4-matchday.spec.cjs \
            tests/e2e/v4-personalization.spec.cjs \
            tests/e2e/v5.1-visual-baseline.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs \
            tests/e2e/v5.1-design-system-v2.spec.cjs \
            tests/e2e/v5.1-release-flow-review.spec.cjs
      - name: Commit QA repair and generated baselines
        run: |
          rm .github/workflows/update-my-match-hub-baselines.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v4/design-system-v2.css tests/e2e .github/workflows/update-my-match-hub-baselines.yml
          git diff --cached --check
          git status --short
          git commit -m "test: align MY hub QA and visual baselines"
          git push
