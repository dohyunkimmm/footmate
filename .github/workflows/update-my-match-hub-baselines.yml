name: Update MY match hub baselines
on:
  push:
    branches:
      - feat/my-match-hub-3tab-20260927
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'chore: refresh MY hub visual baselines'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION" css-tree@3.1.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Regenerate intentionally changed visual baselines
        run: |
          npx playwright test --project=chromium --update-snapshots \
            tests/e2e/real-app-white-surface.spec.cjs \
            tests/e2e/my-fresh-profile-containment.spec.cjs \
            tests/e2e/product-completion.spec.cjs \
            tests/e2e/v4-matchday.spec.cjs \
            tests/e2e/v4-personalization.spec.cjs \
            tests/e2e/v5.1-visual-baseline.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs \
            tests/e2e/v5.1-design-system-v2.spec.cjs \
            tests/e2e/v5.1-release-flow-review.spec.cjs
      - name: Commit generated baselines only
        run: |
          rm .github/workflows/update-my-match-hub-baselines.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e .github/workflows/update-my-match-hub-baselines.yml
          git diff --cached --check
          git status --short
          git commit -m "test: update three-tab MY visual baselines"
          git push
