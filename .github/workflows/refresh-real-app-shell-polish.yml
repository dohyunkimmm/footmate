name: Refresh Real App shell polish baselines
on:
  push:
    branches: [fix/real-app-shell-polish-20260925]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION" css-tree@3.1.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh approved Real App snapshots
        run: >
          npx playwright test --project=chromium --update-snapshots
          tests/e2e/real-app-white-surface.spec.cjs
          tests/e2e/product-completion.spec.cjs
          tests/e2e/v5.1-design-system-v2.spec.cjs
          tests/e2e/v5.1-release-flow-review.spec.cjs
          tests/e2e/v5.1-visual-baseline.spec.cjs
          tests/e2e/v5.1-visual-system-completion.spec.cjs
      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/*-snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "test: refresh Real App shell polish baselines"
          git push
