name: Patch Real App setup selection
on:
  push:
    branches: [fix/real-app-unselected-setup]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/real-app-unselected-setup
          fetch-depth: 0
      - name: Apply scoped product and test patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path=Path('src/v4/app.js')
          text=app_path.read_text()
          replacements=[
            (
              "  const current=state[data.key];\n  return `<section class=\"fm-next-screen fm-next-screen--plain\" data-screen=\"setup\">",
              "  const current=state[data.key];\n  const nextDisabled=current?'':'disabled aria-disabled=\"true\"';\n  return `<section class=\"fm-next-screen fm-next-screen--plain\" data-screen=\"setup\">"
            ),
            (
              "${button(step===setupSteps.length-1?(state.setupOrigin?'설정 적용':`추천 경기 보기 ${icon('arrow')}`):'다음','setup-next','primary')}",
              "${button(step===setupSteps.length-1?(state.setupOrigin?'설정 적용':`추천 경기 보기 ${icon('arrow')}`):'다음','setup-next','primary',nextDisabled)}"
            ),
            (
              "  if(action==='start-setup'){setState({route:'setup',setupStep:0});return;}",
              "  if(action==='start-setup'){setState(state.setupComplete?{route:'setup',setupStep:0}:{route:'setup',setupStep:0,region:'',position:'',level:''});return;}"
            ),
            (
              "  if(action==='setup-next'){\n    if(state.setupStep<setupSteps.length-1){setState({setupStep:state.setupStep+1});}\n    else finishSetup();\n    return;\n  }",
              "  if(action==='setup-next'){\n    const step=Math.max(0,Math.min(setupSteps.length-1,state.setupStep||0));\n    const data=setupSteps[step];\n    if(!state[data.key])return;\n    if(step<setupSteps.length-1){setState({setupStep:step+1});}\n    else finishSetup();\n    return;\n  }"
            )
          ]
          for old,new in replacements:
            if old not in text:
              raise SystemExit(f'app.js patch target missing: {old[:90]!r}')
            text=text.replace(old,new,1)
          app_path.write_text(text)

          helper="""\nasync function chooseSetupDefaultIfNeeded(page){\n  const setup=page.locator('[data-screen=\"setup\"]');\n  if(!await setup.isVisible().catch(()=>false))return;\n  if(await setup.locator('[data-action=\"choose-setup\"][aria-pressed=\"true\"]').count())return;\n  const field=await setup.locator('[data-action=\"choose-setup\"]').first().getAttribute('data-field');\n  const value={region:'수원 · 영통',position:'MF',level:'중급'}[field];\n  if(value)await setup.locator(`[data-action=\"choose-setup\"][data-value=\"${value}\"]`).click();\n}\n"""
          next_pattern=re.compile(r"(?P<indent>^[ \\t]*)await (?P<page>[A-Za-z_$][\\w$]*)\\.getByRole\\('button',\\{name:'다음'\\}\\)\\.click\\(\\);",re.M)
          finish_pattern=re.compile(r"(?P<indent>^[ \\t]*)await (?P<page>[A-Za-z_$][\\w$]*)\\.getByRole\\('button',\\{name:/추천 경기 보기/\\}\\)\\.click\\(\\);",re.M)
          changed=[]
          for path in sorted(Path('tests/e2e').glob('*.cjs')):
            source=path.read_text()
            updated=next_pattern.sub(lambda m:f"{m.group('indent')}await chooseSetupDefaultIfNeeded({m.group('page')});\\n{m.group(0)}",source)
            updated=finish_pattern.sub(lambda m:f"{m.group('indent')}await chooseSetupDefaultIfNeeded({m.group('page')});\\n{m.group(0)}",updated)
            if updated==source:
              continue
            if 'async function chooseSetupDefaultIfNeeded' not in updated:
              match=re.search(r"^const .*require\\('@playwright/test'\\);\\n",updated,re.M)
              if not match:
                raise SystemExit(f'Playwright require line missing in {path}')
              updated=updated[:match.end()]+helper+updated[match.end():]
            path.write_text(updated)
            changed.append(str(path))

          visual=Path('tests/e2e/real-app-visual-finish.spec.cjs')
          source=visual.read_text()
          marker="test('standalone Real App keeps visual finish ownership without an extra stylesheet request'"
          if "fresh Real App setup starts unselected and requires an explicit choice" not in source:
            test_code="""\ntest('fresh Real App setup starts unselected and requires an explicit choice',async({page})=>{\n  const errs=await openCleanApp(page);\n  await page.getByRole('button',{name:/내 경기 찾아보기/}).click();\n  const screen=page.locator('[data-screen=\"setup\"]');\n  const next=screen.locator('[data-action=\"setup-next\"]');\n  await expect(screen.locator('[data-action=\"choose-setup\"][aria-pressed=\"true\"]')).toHaveCount(0);\n  await expect(next).toBeDisabled();\n\n  await screen.locator('[data-action=\"choose-setup\"][data-value=\"수원 · 영통\"]').click();\n  await expect(next).toBeEnabled();\n  await next.click();\n  await expect(screen.locator('[data-action=\"choose-setup\"][aria-pressed=\"true\"]')).toHaveCount(0);\n  await expect(screen.locator('[data-action=\"setup-next\"]')).toBeDisabled();\n\n  await screen.locator('[data-action=\"choose-setup\"][data-value=\"MF\"]').click();\n  await screen.locator('[data-action=\"setup-next\"]').click();\n  await expect(screen.locator('[data-action=\"choose-setup\"][aria-pressed=\"true\"]')).toHaveCount(0);\n  await screen.locator('[data-action=\"choose-setup\"][data-value=\"중급\"]').click();\n  await screen.locator('[data-action=\"setup-next\"]').click();\n  await expect(page.locator('[data-screen=\"home\"]')).toBeVisible();\n\n  const session=await page.evaluate(()=>JSON.parse(localStorage.getItem('footmate:v4:session')||'{}'));\n  expect(session).toMatchObject({setupComplete:true,region:'수원 · 영통',position:'MF',level:'중급'});\n  expect(errs).toEqual([]);\n});\n\n"""
            pos=source.find(marker)
            if pos<0:
              raise SystemExit('real-app-visual-finish insertion marker missing')
            source=source[:pos]+test_code+source[pos:]
            visual.write_text(source)
            if str(visual) not in changed:
              changed.append(str(visual))

          if not changed:
            raise SystemExit('no test helpers were updated')
          print('Updated tests:')
          print('\n'.join(changed))
          PY

          node --check src/v4/app.js
          git diff --check
          git status --short
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-real-app-unselected-setup.yml
          git add src/v4/app.js tests/e2e
          git commit -m "fix: require explicit Real App setup choices"
          git push origin HEAD:fix/real-app-unselected-setup
