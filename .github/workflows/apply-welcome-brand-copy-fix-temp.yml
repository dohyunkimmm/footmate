name: Apply Welcome Brand Copy Fix Temp
on:
  push:
    branches:
      - fix/welcome-brand-copy-offset-20260926
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/welcome-brand-copy-offset-20260926
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply visible brand-copy offset and lock it
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path=Path('src/v4/personalization.css')
          css=css_path.read_text()
          base='#footmate-next .fm-next-page[data-mode=real] [data-screen=welcome] .fm-next-topbar--dark .fm-next-brand{transform:translateY(-12px)!important}'
          child='#footmate-next .fm-next-page[data-mode=real] [data-screen=welcome] .fm-next-topbar--dark .fm-next-brand>span:last-child{display:block;transform:translateY(-12px)!important}'
          if child not in css:
            if base not in css:
              raise SystemExit('Expected Welcome brand baseline rule not found')
            css=css.replace(base,base+child,1)
            css_path.write_text(css)

          test_path=Path('tests/e2e/real-app-white-surface.spec.cjs')
          test=test_path.read_text()
          existing="  await expect(page.locator('[data-screen=\"welcome\"] .fm-next-topbar--dark .fm-next-brand')).toHaveCSS('transform','matrix(1, 0, 0, 1, 0, -12)');"
          added="  await expect(page.locator('[data-screen=\"welcome\"] .fm-next-topbar--dark .fm-next-brand>span:last-child')).toHaveCSS('transform','matrix(1, 0, 0, 1, 0, -12)');"
          if added not in test:
            if existing not in test:
              raise SystemExit('Expected Welcome geometry assertion not found')
            test=test.replace(existing,existing+'\n'+added,1)
            test_path.write_text(test)
          PY
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate only approved Welcome baselines
        run: |
          npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs --grep '390px Welcome|390px personalized Welcome' --update-snapshots
          npx playwright test --project=chromium tests/e2e/v5.1-release-flow-review.spec.cjs --grep 'welcome hero keeps readable contrast' --update-snapshots
      - name: Verify generated baselines by real screenshot comparison
        run: |
          npx playwright test --project=chromium tests/e2e/real-app-white-surface.spec.cjs --grep '390px Welcome|390px personalized Welcome'
          npx playwright test --project=chromium tests/e2e/v5.1-release-flow-review.spec.cjs --grep 'welcome hero keeps readable contrast'
      - name: Remove temporary workflow and guard scope
        run: |
          rm .github/workflows/apply-welcome-brand-copy-fix-temp.yml
          git status --short
          python - <<'PY'
          import subprocess
          required={
            'src/v4/personalization.css',
            'tests/e2e/real-app-white-surface.spec.cjs',
            '.github/workflows/apply-welcome-brand-copy-fix-temp.yml',
          }
          allowed_baselines={
            'tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-welcome-390-chromium-linux.png',
            'tests/e2e/real-app-white-surface.spec.cjs-snapshots/real-app-white-personalized-welcome-390-chromium-linux.png',
            'tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-390-chromium-linux.png',
            'tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-welcome-1440-chromium-linux.png',
          }
          changed=set(subprocess.check_output(['git','status','--short']).decode().splitlines())
          paths={line[3:] for line in changed}
          if not required.issubset(paths):
            raise SystemExit(f'Missing required change(s): {sorted(required-paths)}')
          if not paths.issubset(required|allowed_baselines):
            raise SystemExit(f'Unexpected changed files: {sorted(paths-(required|allowed_baselines))}')
          baseline_changes=paths & allowed_baselines
          if not baseline_changes:
            raise SystemExit('No Welcome baseline changed; visible offset was not captured')
          print(f'PASS scope: {sorted(paths)}')
          PY
      - name: Commit fix and refreshed baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: move Welcome brand copy visibly upward'
          git push origin HEAD:fix/welcome-brand-copy-offset-20260926
