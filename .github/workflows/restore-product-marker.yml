name: Restore Product Ownership Marker

on:
  push:
    branches:
      - design/visual-hierarchy-v3-20260927
    paths:
      - .github/workflows/restore-product-marker.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/visual-hierarchy-v3-20260927
          fetch-depth: 0
      - name: Restore product completion ownership marker
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python - <<'PY'
          from pathlib import Path
          path = Path('src/v4/design-system-v2.css')
          css = path.read_text()
          marker = '/* Product completion compatibility ownership */'
          if marker not in css:
              path.write_text(marker + '\n' + css)
          PY
          node scripts/check-v4.9-performance-budget.cjs
          rm .github/workflows/restore-product-marker.yml
          git add -A
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: restore product completion QA marker'
          git push origin HEAD:design/visual-hierarchy-v3-20260927
