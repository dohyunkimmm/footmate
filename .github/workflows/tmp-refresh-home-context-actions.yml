name: Temporary Home context actions baseline refresh
on:
  push:
    branches: [polish/home-ai-entry-compact]
permissions:
  contents: write
jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[refresh-home-context-actions]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/home-ai-entry-compact
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Refresh Home context actions baseline
        run: |
          npx playwright test tests/e2e/v5.1-visual-baseline.spec.cjs --project=chromium -g "320px context actions match the approved responsive visual baseline" --update-snapshots=all
      - name: Commit refreshed baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-visual-baseline.spec.cjs-snapshots/real-app-context-actions-320-chromium-linux.png
          if git diff --cached --quiet; then
            echo "No baseline change"
          else
            git commit -m "test: refresh Home context actions baseline"
            git push origin HEAD:polish/home-ai-entry-compact
          fi
