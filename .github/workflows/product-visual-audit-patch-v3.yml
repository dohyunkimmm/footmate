name: Product Visual Audit Patch v3

on:
  push:
    branches:
      - fix/product-visual-audit-20260923

permissions:
  contents: write

jobs:
  patch-and-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply audited Product corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,re
          workflow=Path('.github/workflows/product-visual-audit-patch.yml').read_text(encoding='utf-8')
          match=re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > /tmp/product-visual-audit.py",workflow)
          if not match:
              raise SystemExit('audit patch payload not found')
          Path('/tmp/product-visual-audit.py').write_bytes(base64.b64decode(match.group(1)))
          PY
          python /tmp/product-visual-audit.py
      - name: Compact the idle Home AI surface and refine density contract
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/product-visual-home-compact.py
          python /tmp/product-visual-home-compact.py
      - name: Install Playwright audit dependencies
        run: npm install --no-save @playwright/test@1.55.1 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate audited changed-surface baselines and verify assertions
        run: npx playwright test tests/e2e/v5.1-release-flow-review.spec.cjs tests/e2e/v5.1-visual-system-completion.spec.cjs tests/e2e/v4-personalization.spec.cjs --update-snapshots
      - name: Commit audited corrections and remove one-time workflows
        shell: bash
        run: |
          rm -f .github/workflows/product-visual-audit-patch.yml .github/workflows/product-visual-audit-patch-v2.yml .github/workflows/product-visual-audit-patch-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v4/design-system-v2.css src/v4/personalization.js tests/e2e .github/workflows/product-visual-audit-patch.yml .github/workflows/product-visual-audit-patch-v2.yml .github/workflows/product-visual-audit-patch-v3.yml
          git commit -m "fix: close product visual audit regressions [visual-audit-generated]"
          git push origin HEAD:fix/product-visual-audit-20260923
