name: Finalize Real App Shell Polish Baselines

on:
  push:
    branches:
      - fix/real-app-shell-polish
    paths:
      - .github/workflows/refresh-real-app-shell-polish-baselines.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/real-app-shell-polish
          fetch-depth: 0
      - name: Restore unchanged mobile baselines and remove one-off workflow
        run: |
          git fetch origin main
          git checkout origin/main -- \
            tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots/release-flow-checked-in-390-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-discover-375-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-discover-390-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-discover-430-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-320-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-375-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-390-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/product-density-home-430-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-ai-loading-390-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-discover-390-chromium-linux.png \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots/visual-system-discovery-empty-390-chromium-linux.png
          git rm .github/workflows/refresh-real-app-shell-polish-baselines.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e
          git commit -m "test: keep mobile baselines unchanged after shell polish"
          git push origin HEAD:fix/real-app-shell-polish
