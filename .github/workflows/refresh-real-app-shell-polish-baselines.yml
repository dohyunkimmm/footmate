name: Refresh Real App Shell Polish Baselines

on:
  push:
    branches:
      - fix/real-app-shell-polish
    paths:
      - app.html
      - tests/e2e/v5.1-design-system-v2.spec.cjs
      - tests/e2e/v5.1-decision-flow-polish.spec.cjs
      - .github/workflows/refresh-real-app-shell-polish-baselines.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/real-app-shell-polish
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install visual QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
          npx playwright install --with-deps chromium
      - name: Refresh affected Ubuntu Chromium baselines
        run: |
          npx playwright test \
            tests/e2e/v5.1-design-system-v2.spec.cjs \
            tests/e2e/v5.1-release-flow-review.spec.cjs \
            tests/e2e/v5.1-visual-baseline.spec.cjs \
            tests/e2e/v5.1-visual-system-completion.spec.cjs \
            --project=chromium --update-snapshots=all
      - name: Commit changed approved baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/e2e/v5.1-design-system-v2.spec.cjs-snapshots \
            tests/e2e/v5.1-release-flow-review.spec.cjs-snapshots \
            tests/e2e/v5.1-visual-baseline.spec.cjs-snapshots \
            tests/e2e/v5.1-visual-system-completion.spec.cjs-snapshots
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "test: refresh Real App shell polish visual baselines"
          git push origin HEAD:fix/real-app-shell-polish
