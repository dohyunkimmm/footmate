name: Temporary MY Save CTA Baseline Regeneration
on:
  push:
    branches: [fix/my-save-cta-width]
permissions:
  contents: write
jobs:
  regenerate:
    if: contains(github.event.head_commit.message, '[regen-my-save-cta-baseline]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/my-save-cta-width
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Verify MY save CTA width and regenerate affected baseline
        run: |
          npx playwright test tests/e2e/my-save-cta-width.spec.cjs --project=chromium
          npx playwright test tests/e2e/v5.1-design-system-v2.spec.cjs --project=chromium -g "1440px Profile personalization" --update-snapshots
      - name: Commit regenerated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v5.1-design-system-v2.spec.cjs-snapshots/design-system-v2-personalization-1440-chromium-linux.png
          if git diff --cached --quiet; then
            echo "No baseline changes"
          else
            git commit -m "test: refresh full-width MY save CTA baseline"
            git push origin HEAD:fix/my-save-cta-width
          fi
