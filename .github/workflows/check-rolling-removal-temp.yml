name: Verify Case Study and Workbook After Forecast Removal
on:
  push:
    branches: [remove-rolling-forecast-content-20261108]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-rolling-forecast-content-20261108
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install project QA dependencies
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./package.json').qaToolchain.playwright")"
          AXE_VERSION="$(node -p "require('./package.json').qaToolchain.axeCorePlaywright")"
          npm install --no-save --ignore-scripts "@playwright/test@$PLAYWRIGHT_VERSION" "@axe-core/playwright@$AXE_VERSION"
      - name: Validate case study materials and slide navigation
        run: npx playwright test --project=chromium tests/e2e/case-study-eleven-stages.spec.cjs
      - name: Check XLSX workbook formulas, charts and integrity
        run: |
          python3 -m pip install --quiet openpyxl --break-system-packages
          python3 - <<'PY'
          from openpyxl import load_workbook
          path='src/case-study/downloads/footmate_model.xlsx'
          formulas=load_workbook(path,data_only=False)
          cache=load_workbook(path,data_only=True)
          assert len(formulas.sheetnames)==10
          assert len(formulas['운영보고']._charts)==1
          assert len(formulas['운영보고']._charts[0].series)==2
          assert formulas['운영보고']['C6'].value=="=SUM('월별손익'!N6:N17)"
          assert formulas['운영보고']['C7'].value=="=SUM('월별손익'!O6:O17)"
          assert cache['운영보고']['C6'].value==18681100
          assert cache['운영보고']['C7'].value==-4840730
          assert cache['전략KPI']['B6'].value==18681100
          assert cache['전략KPI']['B7'].value==448300
          assert cache['전략KPI']['B8'].value==-2806690
          for sheet in formulas:
              for row in sheet:
                  for cell in row:
                      assert cell.data_type!='e', (sheet.title,cell.coordinate,cell.value)
          print('PASS: 10 sheets, linked financial formulas and values, 2 chart series, no cached cell errors')
          PY
      - name: Upload case-study visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rolling-clean-case-study-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
