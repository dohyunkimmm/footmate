name: Verify Case Study and Workbook After Forecast Removal
on:
  push:
    branches: [remove-rolling-forecast-content-20261108]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate workbook formulas, cached values and chart series without reformatting
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          import re
          path='src/case-study/downloads/footmate_model.xlsx'
          m='{http://schemas.openxmlformats.org/spreadsheetml/2006/main}'
          c='{http://schemas.openxmlformats.org/drawingml/2006/chart}'
          with ZipFile(path) as z:
              assert z.testzip() is None
              wb=ET.fromstring(z.read('xl/workbook.xml'))
              assert len(list(wb.iter(m+'sheet')))==10
              sheet1=ET.fromstring(z.read('xl/worksheets/sheet1.xml'))
              sheet3=ET.fromstring(z.read('xl/worksheets/sheet3.xml'))
              sheet9=ET.fromstring(z.read('xl/worksheets/sheet9.xml'))
              chart=ET.fromstring(z.read('xl/drawings/charts/chart1.xml'))
              assert len(list(chart.iter(c+'ser')))==2
              def cells(sheet):return {cell.attrib['r']:cell for cell in sheet.iter(m+'c')}
              def value(cell):
                  v=cell.find(m+'v')
                  return v.text if v is not None else None
              a=cells(sheet1)
              assert a['C6'].find(m+'f').text=="SUM('월별손익'!N6:N17)"
              assert a['C7'].find(m+'f').text=="SUM('월별손익'!O6:O17)"
              assert int(float(value(a['C6'])))==18681100
              assert int(float(value(a['C7'])))==-4840730
              b=cells(sheet3)
              assert b['N12'].find(m+'f').text=='H12'
              assert b['O12'].find(m+'f').text=='I12'
              assert 'P12' not in b and 'Q12' not in b
              k=cells(sheet9)
              assert [int(float(value(k[x]))) for x in ('B6','B7','B8')]==[18681100,448300,-2806690]
              for file in z.namelist():
                  if not file.endswith('.xml'):continue
                  raw=z.read(file).decode('utf-8','replace')
                  assert not re.search(r'Rolling\s*Forecast|수정\s?전망|재예측|분기\s?전망',raw,re.I),file
                  if not file.startswith('xl/worksheets/sheet'):continue
                  sheet=ET.fromstring(raw)
                  assert all(cell.attrib.get('t')!='e' for cell in sheet.iter(m+'c')),file
              print('PASS: 10 sheets, 2 chart series, linked plan and virtual scenario formulas, cached values and no spreadsheet errors')
          PY
