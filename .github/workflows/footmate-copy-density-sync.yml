name: FootMate one-time 15-slide description sync
on:
  push:
    branches:
      - polish/footmate-table-copy-and-15-slide-layout-20261109
    paths:
      - qa/polish-footmate-presentations-20261109.py
      - .github/workflows/footmate-copy-density-sync.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'dohyunkimmm/footmate'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install typography and slide preview tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-noto-cjk fonts-nanum
          python -m pip install --disable-pip-version-check python-pptx==1.0.2
      - name: Update both editable decks and all preview images
        run: python qa/polish-footmate-presentations-20261109.py
      - name: Check 31-table portfolio copy against all 15 PowerPoint slides
        run: python qa/crosscheck-case-study-presentations.py
      - name: Commit only revised slide decks and their rendered previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/case-study/downloads/footmate_report.pptx \
            src/case-study/downloads/footmate_5year_strategy.pptx \
            src/case-study/report-previews.js \
            src/case-study/previews/strategy/
          if ! git diff --cached --quiet; then
            git commit -m "assets: shorten 15 slide descriptions and refresh previews"
            git fetch origin "polish/footmate-table-copy-and-15-slide-layout-20261109"
            git rebase FETCH_HEAD
            git push origin "HEAD:polish/footmate-table-copy-and-15-slide-layout-20261109"
          fi
